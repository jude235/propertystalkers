<style>
  /* Emerald & Gold with Plus Jakarta Sans, adapted from the design file. */
  :root {
    --brand-deep: #0b231c;   /* header (brand-900) */
    --brand: #11352b;        /* buttons, pins (brand-800) */
    --brand-ink: #ffffff;    /* text on emerald */
    --brand-soft: #e1f0ec;   /* brand-100 */
    --brass: #d4af37;        /* gold accent */
    --brass-light: #f4ebd0;
    --brass-ink: #8a6d12;    /* gold dark enough for text on cream */
    --req: #7a5a27;          /* request pins and headers */
    --ink: #1e293b;          /* slate-800 */
    --muted: #64748b;        /* slate-500 */
    --line: #ece5d4;         /* cream-200 */
    --bg: #fcfbf7;           /* cream-50: cards */
    --soft: #f7f4eb;         /* cream-100: page, fields */
    --wa: #1f7a4d;
    --warn-bg: #f6e7c8;
    --warn-ink: #5e4210;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(11, 35, 28, .18);
    --serif: "Plus Jakarta Sans", system-ui, sans-serif;
  }
  /* Optional colour themes (chosen in My profile / the palette button). */
  /* A see-through film over the map imagery (pins stay on top), in the theme's colour. */
  :root { --map-tint: rgba(17, 53, 43, .24); }
  :root[data-theme="navy"] { --map-tint: rgba(17, 34, 64, .24); }
  :root[data-theme="slate"] { --map-tint: rgba(39, 39, 42, .22); }
  :root[data-theme="clay"] { --map-tint: rgba(60, 72, 88, .2); }
  :root[data-theme="navy"] { --brand-deep: #0a192f; --brand: #112240; --brand-soft: #ebf8ff; --brass: #f6ad55; --brass-light: #feebc8; --brass-ink: #a85d0f; --req: #6b4f2a; --bg: #f8fafc; --soft: #f1f5f9; --line: #e2e8f0; --ink: #1a202c; --muted: #64748b; }
  :root[data-theme="slate"] { --brand-deep: #18181b; --brand: #27272a; --brand-soft: #f4f4f5; --brass: #fb923c; --brass-light: #ffedd5; --brass-ink: #b4520f; --req: #7a4a22; --bg: #fafaf9; --soft: #f5f5f4; --line: #e7e5e4; --ink: #1c1917; --muted: #6b6560; }
  :root[data-theme="clay"] { --brand-deep: #2d3748; --brand: #3c4858; --brand-soft: #edf2f7; --brass: #dd6b20; --brass-light: #feebc8; --brass-ink: #a94e12; --req: #7a5a27; --bg: #fbfbf9; --soft: #f4f3ef; --line: #e6e4dc; --ink: #2d3748; --muted: #6b7280; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--soft); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  #map-wrap { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; background: #e9e2d3; }
  /* Phones: a bar in the header's colours along the bottom, down behind the phone's own navigation buttons.
     The post button and Stalker sit in it; the map ends above it so Google's logo and terms stay visible. */
  .bottombar { display: none; }
  @media (max-width: 759px) {
    :root { --bar: 68px; }
    .bottombar { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 18; height: calc(var(--bar) + env(safe-area-inset-bottom));
      background: var(--brand-deep); border-top: 2px solid var(--brass); box-shadow: 0 -6px 18px rgba(0, 0, 0, .18); }
    #map-wrap { bottom: calc(var(--bar) + env(safe-area-inset-bottom)); }
    .fab { bottom: calc(11px + env(safe-area-inset-bottom)) !important; box-shadow: none; }
    .ask-fab { bottom: calc(7px + env(safe-area-inset-bottom)) !important; box-shadow: none; }
    .role-pill { display: none !important; }  /* on phones the Switch button in the bar does this */
    .switch-btn:not([hidden]) { display: flex; position: fixed; left: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20; height: 44px; width: 72px;
      padding: 0 4px; border-radius: 999px; border: 1px solid var(--brass); background: transparent; color: var(--brand-ink); cursor: pointer;
      flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
    .switch-btn b { font-size: 12px; font-weight: 700; }
    .switch-btn small { font-size: 9px; color: var(--brass); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Post button in the exact middle of the screen; Switch and Stalker sit the same distance from each edge. */
    .fab { left: 50% !important; max-width: calc(100vw - 196px); }
    .ask-fab { right: 20px !important; }
  }
  .switch-btn { display: none; }

  /* ---------- header ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; }
  .header { pointer-events: auto; background: var(--brand-deep, var(--brand)); color: var(--brand-ink);
    padding: calc(12px + env(safe-area-inset-top)) 16px 14px; border-bottom: 2px solid var(--brass);
    box-shadow: 0 6px 20px rgba(15, 59, 46, .25); }
  .header-in { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand-mark { width: 30px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; }
  .brand-name { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: clamp(18px, 5.2vw, 22px); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; padding-bottom: 1px; }
  .brand-name span { color: var(--brass); }
  .account { border: 1px solid rgba(243, 235, 221, .5); cursor: pointer; background: transparent; color: var(--brand-ink);
    height: 38px; min-width: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; flex: 0 0 auto; }
  .banner-inline { background: #fff3e6; border: 1px solid #f0c48a; color: #7a4a10; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  /* Signed in: just the round picture (or initials). */
  button.account.profile-btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 42px; width: 42px; height: 42px; padding: 0; border-radius: 50%; position: relative; }
  button.account.profile-btn .pav { flex: 0 0 auto; width: 36px; height: 36px; font-size: 14px; }
  .pav { width: 30px; height: 30px; border-radius: 50%; background: var(--brass); color: var(--brand); display: grid; place-items: center; font-size: 13px; font-weight: 500; overflow: hidden; }
  .pav img, .avatar img, .pf-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pf-pic-row { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
  .pf-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--brand); color: var(--brass); border: 2px solid var(--brass);
    font-family: var(--serif); font-weight: 700; font-size: 24px; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
  .pf-pic-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pdot { position: absolute; top: 2px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #e0583c; border: 2px solid var(--brand); }
  .plabel-s { display: none; }
  @media (max-width: 400px) { .plabel { display: none; } .plabel-s { display: inline; } .account.profile-btn { padding: 0 10px 0 4px; gap: 6px; } .brand-name { font-size: 18px; } }
  @media (max-width: 340px) { .plabel-s { display: none; } .account.profile-btn { padding: 0 4px; } }
  .account.avatar-btn { padding: 0; width: 38px; background: var(--brass); border-color: var(--brass); color: var(--brand); font-weight: 500; }

  /* Properties / Requests switch */
  .tabs { display: flex; width: 100%; max-width: 380px; padding: 4px; border-radius: 999px;
    background: rgba(243, 235, 221, .10); border: 1px solid rgba(243, 235, 221, .28); }
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; background: none;
    padding: 9px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; color: rgba(243, 235, 221, .88);
    transition: background .2s, color .2s; }
  .tab:hover { color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--brand-ink); color: var(--brand); box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
  .tab .n { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; line-height: 20px; text-align: center;
    background: rgba(243, 235, 221, .18); color: inherit; }
  .tab .n:empty { display: none; }
  .tab[aria-selected="true"] .n { background: var(--brand); color: var(--brand-ink); }
  .tabs[hidden] { display: none; }

  /* Search */
  .search { position: relative; flex: 1; min-width: 0; }
  .search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid rgba(243, 235, 221, .35);
    background: rgba(243, 235, 221, .12); color: var(--brand-ink); padding: 0 80px 0 42px; font-size: 15px; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: rgba(243, 235, 221, .75); }
  .search input:focus { outline: none; background: var(--brand-ink); color: var(--ink); border-color: var(--brass); }
  .search input:focus::placeholder { color: var(--muted); }
  .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--brass); display: flex; }
  .s-clear { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .s-clear[hidden] { display: none; }
  .s-filter { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--brass); color: var(--brand-deep); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .s-filter:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }
  .s-filter .f-n { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand-ink);
    color: var(--brand); border: 1px solid var(--brass); font-size: 11px; font-weight: 800; line-height: 16px; text-align: center; }
  .s-filter .f-n[hidden] { display: none; }
  /* Filters sheet */
  .fsec h3 { font-size: 14px; font-weight: 700; color: var(--brand); margin: 18px 0 8px; }
  .fsec:first-child h3 { margin-top: 0; }
  .fopts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fopt { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #ffffff; color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 500; }
  .fopt[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .frow .field { margin: 0; }
  .fhint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .ffoot { display: flex; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .ffoot .btn { flex: 1; }
  .ffoot .btn.accent { flex: 2; }
  .linkish { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: inherit; text-decoration: underline; cursor: pointer; }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg); color: var(--ink); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 25; border: 1px solid var(--line); }
  .results[hidden] { display: none; }
  .result { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px;
    cursor: pointer; border-bottom: 1px solid var(--line); color: var(--ink); }
  .result:last-child { border-bottom: 0; }
  .result:hover, .result.sel { background: var(--soft); }
  .result img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  .result .r-main { min-width: 0; flex: 1; }
  .result b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .r-price { font-family: var(--serif); font-weight: 700; color: var(--brand); white-space: nowrap; font-size: 15px; }
  .result.go { color: var(--brass-ink); font-weight: 500; font-size: 14px; }
  .result.empty { cursor: default; color: var(--muted); font-size: 13px; }

  /* Filters */
  .filters { pointer-events: auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters[hidden] { display: none; }
  .fchip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(15, 59, 46, .14); display: inline-flex; align-items: center; gap: 6px; }
  .fchip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .fchip.list { border-color: var(--brass); color: var(--brass-ink); }
  .fchip .n { font-size: 12px; opacity: .8; }
  .match { display: inline-block; font-size: 12px; font-weight: 700; color: #2f6f8f; background: #e8f2f6; border-radius: 999px; padding: 2px 8px; margin-top: 4px; }
  .sec-h .match { margin: 0 0 0 6px; vertical-align: middle; }
  .amen.interests span.same { border-color: #2f6f8f; color: #24576f; background: #e8f2f6; }

  /* List of properties in view */
  .list-head { padding: 22px 18px 8px; }
  .list-head h2 { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--brand); margin: 0 0 4px; }
  .list-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .litem { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 18px; cursor: pointer; color: var(--ink); }
  .litem:hover { background: var(--soft); }
  .litem img { width: 84px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  .litem div { min-width: 0; }
  .litem b { display: block; font-weight: 500; font-size: 15px; }
  .litem small { display: block; color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .litem .lp { font-family: var(--serif); font-weight: 700; color: var(--brand); font-size: 16px; }
  .tag.dev { color: var(--brand); background: none; }
  .banner-row { padding: 12px 16px 0; }
  .banner { pointer-events: auto; max-width: 420px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brass);
    border-radius: 0 12px 12px 0; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); box-shadow: 0 4px 14px rgba(15, 59, 46, .12); }
  .banner b { color: var(--ink); font-weight: 500; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--brass); cursor: pointer; background: var(--brand); color: var(--brand-ink); font-weight: 500; font-size: 15px;
    letter-spacing: .03em; padding: 14px 24px; border-radius: 999px; box-shadow: 0 10px 24px rgba(15, 59, 46, .35);
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fab svg { color: var(--brass); }
  .role-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(15, 59, 46, .18); cursor: pointer; white-space: nowrap; }
  .role-pill b { font-weight: 500; color: var(--brand); }
  .role-pill span { color: var(--brass-ink); font-weight: 500; margin-left: 6px; }
  .role-pill[hidden] { display: none; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  /* Set the pin: full-screen map with a fixed pin in the middle. */
  .picker { position: fixed; inset: 0; z-index: 60; background: #000; }
  .picker[hidden] { display: none; }
  #pk-map { position: absolute; inset: 0; }
  .pk-top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
  .pk-search { flex: 1; position: relative; }
  .pk-search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line); padding: 0 14px; font-size: 16px; background: var(--bg); box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
  .pk-top .icon-btn { width: 42px; height: 42px; flex: 0 0 auto; }
  .pk-sug { position: absolute; top: 46px; left: 0; right: 0; background: var(--bg); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); overflow: hidden; }
  .pk-sug button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; font-size: 14px; cursor: pointer; }
  .pk-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 2; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45)); }
  .pk-pin::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 8px; height: 4px; margin-left: -4px; border-radius: 50%; background: rgba(0, 0, 0, .45); }
  .pk-hint { position: absolute; left: 50%; top: calc(50% + 14px); transform: translateX(-50%); z-index: 2; background: rgba(15, 59, 46, .88); color: var(--brand-ink); font-size: 13px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
  .pk-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; z-index: 2; }
  .pk-bottom .btn { height: 48px; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
  .pk-bottom .btn:not(.accent) { background: var(--bg); }
  .pin-btn { margin-top: 10px; width: 100%; }
  .bell { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(243, 235, 221, .35); background: transparent; color: var(--brand-ink); display: grid; place-items: center; cursor: pointer; }
  .bell[hidden] { display: none; }
  .bell-n { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #c0392b; color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .ask-fab { position: fixed; right: 12px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 19; border: 1px solid var(--brass); background: var(--brand); color: var(--brand-ink);
    font-size: 14px; font-weight: 500; letter-spacing: .02em; padding: 6px 14px 6px 8px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(15, 59, 46, .35); }
  /* The robot's white eyes glow and blink. */
  .robot .r-eyes { transform-origin: 16px 16.5px; filter: drop-shadow(0 0 2.5px #fff) drop-shadow(0 0 5px rgba(255, 255, 255, .8)); animation: r-blink 3.6s infinite; }
  .robot .r-tip { filter: drop-shadow(0 0 3px #fff); animation: r-glow 1.8s ease-in-out infinite; }
  @keyframes r-blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } 88% { opacity: 1; } 91% { opacity: .35; } 94% { opacity: 1; } }
  @keyframes r-glow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .robot .r-eyes, .robot .r-tip { animation: none; } }
  /* Phones: a round Stalker button and a slimmer post button, so they never touch. */
  @media (max-width: 600px) {
    .ask-fab { padding: 0; width: 52px; height: 52px; justify-content: center; right: 10px; bottom: calc(24px + env(safe-area-inset-bottom)); }
    .ask-fab span { display: none; }
    .ask-fab .robot { width: 32px; height: 32px; }
    .fab { padding: 12px 18px; font-size: 14px; gap: 6px; max-width: calc(100vw - 150px); }

function placeholder(id) {
  let seed = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const h = [158, 165, 38, 32][Math.floor(rnd() * 4)]; // emerald and brass tones
  let towers = "", x = 30;
  while (x < 780) {
    const w = 60 + rnd() * 70, top = 140 + rnd() * 230;
    towers += `<rect x="${x}" y="${top}" width="${w}" height="${600 - top}" fill="hsl(${h},30%,${22 + rnd() * 14}%)"/>`;

async function freshToken(force) {
  if (!S.sb || !S.session) return null;
  try {
    if (force) { const { data } = await S.sb.auth.refreshSession(); if (data && data.session) S.session = data.session; }
    else { const { data } = await S.sb.auth.getSession(); if (data && data.session) S.session = data.session; }
  } catch (e) {}
  return S.session ? S.session.access_token : null;
}

async function api(path, opts = {}, retried) {
  const headers = { "content-type": "application/json" };
  const token = await freshToken(false);
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch("/api" + path, { ...opts, headers });
  if (res.status === 401 && token && !retried && await freshToken(true)) return api(path, opts, true);
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(body.error && body.error.includes(" ") ? body.error : "Something went wrong. Please try again.");
    err.code = body.error; err.status = res.status;
    throw err;
  }
  return body;
}

/* ---------------- start up ---------------- */
async function boot() {
  try {
    S.cfg = await api("/config");
  } catch (e) {
    return notice("Almost ready", "The site's server isn't connected yet. Follow the setup guide to add your Supabase, Google Maps and AI keys, then reload this page.");
  }
  if (!window.supabase) return notice("Couldn't load", "Please check your internet connection and reload the page.");

  // Talk to Supabase through our own domain (/sb), so sign-in and photos work even where
  // *.supabase.co is blocked. Keep the original storage key so people stay signed in.
  S.sbBase = location.origin + "/sb";
  const ref = new URL(S.cfg.supabaseUrl).hostname.split(".")[0];
  S.sb = window.supabase.createClient(S.sbBase, S.cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: `sb-${ref}-auth-token` }
  });
  try {
    const { data } = await withTimeout(S.sb.auth.getSession(), 8000);
    S.session = data.session;
  } catch (e) { S.session = null; }
  S.userId = S.session ? S.session.user.id : null;
  S.sb.auth.onAuthStateChange((_event, session) => {
    S.session = session;
    const id = session ? session.user.id : null;
    if (id === S.userId) return;
    S.userId = id;
    setTimeout(afterAuthChange, 0);
  });

  try {
    await loadGoogleMaps();
  } catch (e) {
    return notice("The map couldn't load", "Please check your internet connection and reload. If this keeps happening, the Google Maps key may need fixing (see the setup guide).");
  }
  await initMap();
  await refreshMe();
  await loadFeed();
  openFromHash();
  if (docked() && S.panelMode !== "details") openList();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); }
}

async function afterAuthChange() {
  await refreshMe();
  await loadFeed();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); return; }
  if (S.me && !profileComplete()) renderProfileStepThen(() => { closeSheet(); toast("Profile saved."); });
}

window.gm_authFailure = () => notice("Google Maps key problem", "The Google Maps key was rejected. Check that the Maps JavaScript API is enabled and the key allows this website (see the setup guide).");

function loadGoogleMaps() {
  return new Promise((resolve, reject) => {
    window.__psMapsReady = resolve;
    const s = document.createElement("script");
    const q = new URLSearchParams({ key: S.cfg.mapsKey, v: "weekly", libraries: "marker", loading: "async", callback: "__psMapsReady", region: "IN", language: "en" });
    s.src = "https://maps.googleapis.com/maps/api/js?" + q;
    s.async = true;
    s.onerror = () => reject(new Error("maps"));
    document.head.appendChild(s);
  });
}

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

/* A see-through film in the theme's colour over the map imagery. It lives in the map's lowest layer,
   so pins, clusters and labels stay crisp on top, and it never blocks taps. */
async function addMapTint(map) {
  try {
    const { OverlayView } = await google.maps.importLibrary("maps");
    if (!OverlayView) return;
    class Tint extends OverlayView {
      onAdd() {
        this.div = document.createElement("div");
        this.div.className = "map-tint";
        this.getPanes().mapPane.appendChild(this.div);
      }
      draw() {
        const pr = this.getProjection(), c = this.getMap() && this.getMap().getCenter();
        if (!pr || !c || !this.div) return;
        const px = pr.fromLatLngToDivPixel(c);
        this.div.style.left = Math.round(px.x - 5000) + "px";
        this.div.style.top = Math.round(px.y - 5000) + "px";
      }
      onRemove() { if (this.div) this.div.remove(); }
    }
    const tint = new Tint();
    tint.setMap(map);
    map.addListener("idle", () => tint.draw());
  } catch (e) { /* the map works fine without the film */ }
}

/* ---------------- the map's data: only what's on screen ----------------
   The server sends pins for the visible area, or counts per area when zoomed out.
   Requests wait until the map stops moving, older answers never overwrite newer ones,
   and recent answers are reused for 30 seconds. */
const DEAL_CHIPS = ["sale", "rent", "share", "stay"], CAT_CHIPS = ["project", "commercial", "land"];
S.chips = (() => {
  try {
    const c = JSON.parse(store.get("ps_chips") || "null");

})();
const saveChips = () => store.set("ps_chips", JSON.stringify([...S.chips]));
S.cache = new Map();          // id -> post: a lean pin, or the full post once it's been opened
S.mapMode = "pins"; S.clusters = []; S.total = 0;
S.markers = new Map();        // id -> { marker, el, sig }
S.areaMarks = [];
const getPost = (id) => S.cache.get(id) || null;
function cachePut(p) {
  const v = { ...(S.cache.get(p.id) || {}), ...p };
  S.cache.set(p.id, v);
  return v;
}
async function loadFull(id) {
  const c = S.cache.get(id);
  if (c && c._full) return c;
  try {
    const { post } = await api("/posts/" + encodeURIComponent(id));
    const v = cachePut({ ...post, _full: true });
    if (!S.signedIn) { v.watched = LOCAL.get("ps_short").includes(v.id); v.hidden = LOCAL.get("ps_hidden").includes(v.id); }
    return v;

function chipQuery() {
  const a = S.adv, q = new URLSearchParams();
  q.set("kind", S.tab);
  if (S.tab === "listing") {
    const deals = [...S.chips].filter((c) => DEAL_CHIPS.includes(c)), cats = [...S.chips].filter((c) => CAT_CHIPS.includes(c));
    if (deals.length) q.set("deals", deals.join(","));
    if (cats.length) q.set("cats", cats.join(","));
  }
  if (a.types.length) q.set("types", a.types.join(","));
  if (a.beds) q.set("beds", a.beds);
  if (num(a.min)) q.set("pmin", num(a.min));
  if (num(a.max)) q.set("pmax", num(a.max));
  if (num(a.smin)) q.set("smin", num(a.smin));
  if (num(a.smax)) q.set("smax", num(a.smax));
  if (S.tab === "listing") {
    if (a.by.length) q.set("by", a.by.join(","));
    if (a.amen.length) q.set("amen", a.amen.join(","));
    if (a.photos) q.set("photos", "1");
  }
  return q;
}
/** The visible area, a little bigger and snapped to a grid, so small moves reuse the last answer. */
function viewBox(pad = 0.25) {
  const b = S.map && S.map.getBounds && S.map.getBounds();
  if (!b || !b.getNorthEast) return null;
  const ne = b.getNorthEast(), sw = b.getSouthWest();
  let n = ne.lat(), s = sw.lat(), e = ne.lng(), w = sw.lng();
  const z = Math.round(S.map.getZoom());
  const step = Math.max(360 / Math.pow(2, z) / 2, 0.0005);
  const span = e >= w ? e - w : e + 360 - w;
  const latPad = (n - s) * pad, lngPad = span * pad;
  n = Math.min(85, Math.ceil((n + latPad) / step) * step);
  s = Math.max(-85, Math.floor((s - latPad) / step) * step);
  if (span + 2 * lngPad >= 360) { w = -180; e = 180; }
  else {
    w = Math.floor((w - lngPad) / step) * step; e = Math.ceil((e + lngPad) / step) * step;
    if (w < -180) w += 360;
    if (e > 180) e -= 360;
  }
  const r = (x) => +x.toFixed(5);
  return { w: r(w), s: r(s), e: r(e), n: r(n), z };
}
/** Exactly what's on screen, as map query parameters. */
function screenQuery(q) {
  const b = S.map.getBounds(), ne = b.getNorthEast(), sw = b.getSouthWest();
  const cl = (v, m) => Math.max(-m, Math.min(m, v));
  q.set("w", cl(sw.lng(), 180)); q.set("e", cl(ne.lng(), 180)); q.set("s", cl(sw.lat(), 85)); q.set("n", cl(ne.lat(), 85)); q.set("z", Math.round(S.map.getZoom()));
  return q;
}
let mapSeq = 0, mapAbort = null, mapTimer = null;
const mapMemo = new Map();
function scheduleMap(delay = 300) { clearTimeout(mapTimer); mapTimer = setTimeout(() => refreshMap(), delay); }
async function refreshMap(force = false) {
  if (!S.map) return;
  const box = viewBox();
  if (!box) return;
  const q = chipQuery();
  Object.entries(box).forEach(([k, v]) => q.set(k, v));
  const path = "/map?" + q.toString();
  const seq = ++mapSeq;
  if (force) mapMemo.clear();
  let data;
  const hit = mapMemo.get(path);
  if (hit && Date.now() - hit.t < 30000) data = hit.data;
  else {
    if (mapAbort) mapAbort.abort();
    const ctl = (mapAbort = new AbortController());
    try { data = await api(path, { signal: ctl.signal }); }
    catch (e) {
      if (e.name === "AbortError" || seq !== mapSeq) return;
      return toast("Couldn't load the map. Please check your connection.");
    }
    mapMemo.set(path, { t: Date.now(), data });
    if (mapMemo.size > 60) mapMemo.delete(mapMemo.keys().next().value);
  }
  if (seq !== mapSeq) return; // a newer view is already on its way
  S.access = data.access;
  S.signedIn = data.signedIn;
  if (S.signedIn && await mergeLocalSaved()) return refreshMap(true);
  S.mapMode = data.mode;
  S.total = data.total;
  S.clusters = data.mode === "clusters" ? data.clusters : [];
  S.posts = data.mode === "pins" ? data.pins.map(cachePut) : [];
  if (!S.signedIn) applyLocalSaved();
  S.loaded = true;
  renderMarkers();
  if (panel.classList.contains("open") && S.panelMode === "list" && S.listMode !== "short") openList();
}

  return refreshMap(true);

const F_BY = [["landlord", "Owner"], ["broker", "Broker"], ["developer", "Developer"]];
const num = (v) => { const n = Number(String(v ?? "").replace(/[^\d.]/g, "")); return String(v ?? "").trim() !== "" && isFinite(n) && n > 0 ? n : null; };
function advCount(a = S.adv) {

}
function bedsOf(p) {
  if (p.bedrooms) return Number(p.bedrooms);
  const c = Array.isArray(p.configs) ? p.configs.map(Number).filter((n) => n > 0) : [];
  return c.length ? Math.max(...c) : 0;
}
function passAdv(p, a = S.adv) {
  if (a.types.length && !a.types.includes(p.property_type)) return false;
  if (a.beds && bedsOf(p) < a.beds) return false;
  const lo = num(a.min), hi = num(a.max);
  if ((lo || hi) && (p.price == null || (lo && p.price < lo) || (hi && p.price > hi))) return false;
  const slo = num(a.smin), shi = num(a.smax);
  if ((slo || shi) && (!p.size_sqft || (slo && p.size_sqft < slo) || (shi && p.size_sqft > shi))) return false;
  if (p.kind === "listing") {

    if (a.amen.length && !a.amen.every((x) => (p.amenities || []).includes(x))) return false;

  if (!canSeeRequests && S.tab === "request") S.tab = "listing";
  $("#filters").hidden = S.tab !== "listing";
  document.querySelectorAll(".fchip[data-f]").forEach((c) => c.setAttribute("aria-pressed", String(S.chips.has(c.dataset.f))));
  $("#n-listing").textContent = "";
  $("#n-request").textContent = "";
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
  renderBanner();
  updateFilterBadge();
  if (!S.map) return;

  // Pins: add what's new, drop what's gone, keep the rest as they are.
  const want = new Map((S.mapMode === "pins" ? visiblePosts() : []).map((p) => [p.id, p]));
  const drop = [], add = [];
  for (const [id, m] of S.markers) {
    const p = want.get(id);
    if (!p || m.sig !== pinSig(p)) { drop.push(m.marker); S.markers.delete(id); S.pinEls.delete(id); }
  }
  for (const p of want.values()) {
    if (S.markers.has(p.id)) continue;
    const m = makePin(p);
    S.markers.set(p.id, m); S.pinEls.set(p.id, m.el); add.push(m.marker);
  }
  if (window.markerClusterer) {
    if (!S.clusterer) {
      S.clusterer = new markerClusterer.MarkerClusterer({
        map: S.map,
        markers: [],
        renderer: {
          render: ({ count, position }) => {
            const d = document.createElement("div");
            const size = count < 10 ? 40 : count < 50 ? 48 : 56;
            d.className = "cluster" + (S.tab === "request" ? " req" : "");
            d.style.width = d.style.height = size + "px";
            d.textContent = count;
            return new S.Marker({ position, content: d, zIndex: 1000 + count });
          }
        }
      });
    }
    if (drop.length) S.clusterer.removeMarkers(drop, true);
    if (add.length) S.clusterer.addMarkers(add, true);
    if (drop.length || add.length) S.clusterer.render();
  } else {
    drop.forEach((m) => (m.map = null));
    add.forEach((m) => (m.map = S.map));
  }
  // Counts per area when zoomed out.
  S.areaMarks.forEach((m) => (m.map = null));
  S.areaMarks = S.mapMode === "clusters" ? S.clusters.map(makeAreaMark) : [];
  updateListCount();
}

(() => {

  let x0 = null, y0 = 0, dx = 0;
  const reset = () => { b.classList.remove("drag"); b.style.transform = ""; x0 = null; dx = 0; };
  b.addEventListener("touchstart", (e) => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; b.classList.add("drag"); }, { passive: true });
  b.addEventListener("touchmove", (e) => {
    if (x0 === null) return;

    dx = Math.min(0, t.clientX - x0);

    b.style.transform = `translate(${Math.max(dx, -44)}px, -50%)`;

  b.addEventListener("touchend", (e) => {
    const swiped = x0 !== null && dx < -24;
    reset();

})();

function contactHead(p) {

async function reachOut(p, how, btn) {
  // Open the WhatsApp window straight away (inside the tap), so phones don't block it as a pop-up.
  // (Not in the app: there the WhatsApp link opens WhatsApp itself, and there is no pop-up blocker.)
  const win = how === "wa" && !IN_APP ? window.open("", "_blank") : null;
  btn.disabled = true;
  try {
    const r = await api(`/posts/${p.id}/contact`, { method: "POST" });
    S.contacts[p.id] = r.contact;
    const msg = `Hi ${r.contact.name || ""}, I'm interested in your ${titleOf(p).toLowerCase()} in ${placeOf(p)}, which I saw on Property Stalkers.`;
    const href = how === "wa" ? waHref(r.contact.phone, msg) : telHref(r.contact.phone);
    if (win) win.location.href = href; else location.href = href;
    openDetails(p.id); // now shows who you're connected with
  } catch (e) {
    if (win) win.close();
    btn.disabled = false;
    toast(e.message || "Couldn't get the contact. Please try again.");
  }
}

/* Phones: pull a bottom sheet down to close it. Pulling only starts when its content is scrolled to the top,
   so scrolling up through a long listing never closes it by accident. */
function pullToClose(el, close) {
  let y0 = null, x0 = 0, dy = 0, pulling = false;
  const scrolledDown = (t) => { for (let n = t; n && n.nodeType === 1; n = n.parentNode) { if (n.scrollTop > 0) return true; if (n === el) break; } return false; };
  el.addEventListener("touchstart", (e) => {
    y0 = null;
    if (isDesktop() || e.touches.length !== 1 || e.target.closest("input, textarea, select, #pk-map")) return;
    if (scrolledDown(e.target)) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; pulling = false;
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (y0 === null) return;
    const t = e.touches[0], my = t.clientY - y0, mx = t.clientX - x0;
    if (!pulling) {
      if (Math.abs(my) < 8 && Math.abs(mx) < 8) return;
      if (my <= 0 || Math.abs(mx) > Math.abs(my)) { y0 = null; return; }
      pulling = true; el.classList.add("pulling");
    }
    dy = Math.max(0, my);
    el.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (!pulling) return;

/* ---------------- list of properties in view ---------------- */
function shown(u) {
  const real = S.cfg && S.cfg.supabaseUrl;
  return real && S.sbBase && typeof u === "string" && u.startsWith(real + "/storage/") ? S.sbBase + u.slice(real.length) : u;
}
/* Photo sizes. Each upload is saved as the full photo (up to 1600px), a card size (_m, 800px) and a thumbnail (_s, 240px).
   Older photos only have the full size, so a missing smaller one falls back to it (see the image error handler). */
const sized = (u, k) => (typeof u === "string" && /\/storage\/v1\/object\/public\/photos\/[^?#]+\.jpg$/.test(u) ? u.replace(/\.jpg$/, `_${k}.webp`) : u);
const cardPhoto = (u) => shown(sized(u, "m"));
const thumbPhoto = (u) => shown(sized(u, "s"));
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img && img.tagName === "IMG" && /_[ms]\.webp$/.test(img.currentSrc || img.src) && !img.dataset.fellBack) {
    img.dataset.fellBack = "1";
    img.src = (img.currentSrc || img.src).replace(/_[ms]\.webp$/, ".jpg");
  }
}, true);
function thumbOf(p) { const u = p.photo || (p.photos && p.photos[0]); return u ? thumbPhoto(u) : placeholder(p.id); }
function cardOf(p) { const u = p.photo || (p.photos && p.photos[0]); return u ? cardPhoto(u) : placeholder(p.id); }

/* ---------------- full-screen photos ----------------
   Swipe sideways between photos, pinch or double-tap to zoom, drag to look around when zoomed, pull down or ✕ to close. */
function openViewer(urls, start = 0, quick = []) {
  closeViewer();
  const n = urls.length;
  const box = document.createElement("div");
  box.className = "pv"; box.id = "pv";
  box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Photos");
  // The quick copy shows at once (it's already loaded); the full photo replaces it when it arrives.
  box.innerHTML = `<div class="pv-track">${urls.map((u, i) => `<div class="pv-slide"><img alt="Photo ${i + 1}" draggable="false" data-full="${esc(u)}" ${Math.abs(i - start) <= 1 ? `src="${esc(quick[i] || u)}"` : ""}></div>`).join("")}</div>
    <div class="pv-top">${n > 1 ? `<span class="pv-count" id="pv-count">${start + 1} / ${n}</span>` : "<span></span>"}<button class="pv-x" id="pv-x" aria-label="Close photos">✕</button></div>
    ${n > 1 ? `<button class="pv-nav prev" id="pv-prev" aria-label="Previous photo">&#8249;</button><button class="pv-nav next" id="pv-next" aria-label="Next photo">&#8250;</button>` : ""}`;
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";
  const track = box.querySelector(".pv-track"), imgs = [...box.querySelectorAll(".pv-slide img")];
  let idx = start, z = { s: 1, x: 0, y: 0 };
  const load = (i) => {
    const im = imgs[i]; if (!im) return;
    if (!im.getAttribute("src")) im.src = quick[i] || im.dataset.full;
    if (im.dataset.full && im.src !== new URL(im.dataset.full, location.href).href) {
      const big = new Image(); big.decoding = "async";
      big.onload = () => { if (im.isConnected) im.src = big.src; };
      big.src = im.dataset.full;
    }
  };
  const W = () => box.clientWidth || 1;
  const apply = (anim) => {
    const im = imgs[idx];
    im.style.transition = anim ? "transform .2s ease" : "none";
    im.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.s})`;
  };
  const clampZ = () => {
    const im = imgs[idx], w = im.offsetWidth, h = im.offsetHeight;
    // The picture's top-left sits at (x, y) and is w*s by h*s: keep the screen covered by it where it is bigger.
    const fit = (pos, size, view) => Math.min(0, Math.max(view - size, pos));
    const vw = im.parentElement.clientWidth, vh = im.parentElement.clientHeight;
    const ox = (vw - w) / 2, oy = (vh - h) / 2; // where the picture sits unzoomed

    z.x = sw <= vw ? (vw - sw) / 2 - ox : fit(z.x + ox, sw, vw) - ox;
    z.y = sh <= vh ? (vh - sh) / 2 - oy : fit(z.y + oy, sh, vh) - oy;
  };

  const go = (i, anim = true) => {
    if (z.s !== 1) unzoom(false);
    idx = Math.max(0, Math.min(n - 1, i));
    track.style.transition = anim ? "transform .25s ease" : "none";
    track.style.transform = `translateX(${-idx * 100}%)`;
    const c = $("#pv-count"); if (c) c.textContent = `${idx + 1} / ${n}`;
    load(idx); load(idx + 1); load(idx - 1);
  };
  go(start, false);
  const zoomAt = (cx, cy, s) => {
    // Keep the point under the finger(s) still while the scale changes.
    const r = imgs[idx].parentElement.getBoundingClientRect(), im = imgs[idx];
    const ox = (r.width - im.offsetWidth) / 2, oy = (r.height - im.offsetHeight) / 2;
    const px = cx - r.left - ox, py = cy - r.top - oy;
    const k = s / z.s;
    z.x = px - (px - z.x) * k; z.y = py - (py - z.y) * k; z.s = s;
  };

  /* touch: one finger swipes (or pans when zoomed, or pulls down to close); two fingers pinch */
  let t0 = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  box.addEventListener("touchstart", (e) => {
    if (e.target.closest("button")) return;
    const ts = e.touches;
    if (ts.length === 2) {
      t0 = { pinch: true, d: dist(ts[0], ts[1]), s: z.s, x: z.x, y: z.y, cx: (ts[0].clientX + ts[1].clientX) / 2, cy: (ts[0].clientY + ts[1].clientY) / 2 };
    } else if (ts.length === 1) {
      t0 = { x0: ts[0].clientX, y0: ts[0].clientY, zx: z.x, zy: z.y, mode: null, time: Date.now() };

    const ts = e.touches;
    if (t0.pinch && ts.length === 2) {
      const s = Math.max(1, Math.min(4, t0.s * dist(ts[0], ts[1]) / t0.d));
      const cx = (ts[0].clientX + ts[1].clientX) / 2, cy = (ts[0].clientY + ts[1].clientY) / 2;
      z.s = t0.s; z.x = t0.x; z.y = t0.y;
      zoomAt(t0.cx, t0.cy, s);
      z.x += cx - t0.cx; z.y += cy - t0.cy;

    }
    if (t0.pinch || ts.length !== 1) return;

    if (z.s > 1) { z.x = t0.zx + dx; z.y = t0.zy + dy; clampZ(); apply(false); return; }
    if (!t0.mode && Math.hypot(dx, dy) > 8) t0.mode = Math.abs(dx) > Math.abs(dy) ? "swipe" : "pull";
    if (t0.mode === "swipe") {
      const edge = (idx === 0 && dx > 0) || (idx === n - 1 && dx < 0) ? 0.3 : 1;
      track.style.transition = "none";
      track.style.transform = `translateX(calc(${-idx * 100}% + ${dx * edge}px))`;
    } else if (t0.mode === "pull" && dy > 0) {
      imgs[idx].style.transition = "none";
      imgs[idx].style.transform = `translateY(${dy}px) scale(${1 - Math.min(dy, 400) / 1600})`;
      box.style.background = `rgba(0, 0, 0, ${1 - Math.min(dy, 400) / 500})`;
    }
  }, { passive: false });
  box.addEventListener("touchend", (e) => {
    if (!t0) return;

      if (e.touches.length === 0) { if (z.s < 1.05) unzoom(true); else { clampZ(); apply(true); } t0 = null; }

    const quickTap = !t0.mode && Date.now() - t0.time < 300 && Math.hypot(dx, dy) < 10;
    if (t0.mode === "swipe") go(Math.abs(dx) > W() * 0.18 ? idx + (dx < 0 ? 1 : -1) : idx);
    else if (t0.mode === "pull") {
      if (dy > 110) { t0 = null; return closeViewer(); }
      box.style.background = ""; unzoom(true);
    } else if (quickTap) {
      const now = Date.now();
      if (now - lastTap < 300) {

        if (z.s > 1) unzoom(true); else { zoomAt(ch.clientX, ch.clientY, 2.5); clampZ(); apply(true); }

    }

  });

  box.addEventListener("dblclick", (e) => { if (e.target.closest("button")) return; if (z.s > 1) unzoom(true); else { zoomAt(e.clientX, e.clientY, 2.5); clampZ(); apply(true); } });

  }, { passive: false });

  box.addEventListener("mousedown", (e) => { if (z.s > 1 && !e.target.closest("button")) { drag = { x: e.clientX - z.x, y: e.clientY - z.y }; e.preventDefault(); } });
  box.addEventListener("mousemove", (e) => { if (drag) { z.x = e.clientX - drag.x; z.y = e.clientY - drag.y; clampZ(); apply(false); } });
  box.addEventListener("mouseup", () => { drag = null; });
  box._key = (e) => { if (e.key === "ArrowLeft") go(idx - 1); else if (e.key === "ArrowRight") go(idx + 1); };
  document.addEventListener("keydown", box._key);
  $("#pv-x").addEventListener("click", closeViewer);
  if (n > 1) { $("#pv-prev").addEventListener("click", () => go(idx - 1)); $("#pv-next").addEventListener("click", () => go(idx + 1)); }
  box._go = go;
}
function closeViewer() {
  const box = $("#pv");
  if (!box) return;
  document.removeEventListener("keydown", box._key);
  box.remove();
  document.body.style.overflow = "";
}

/* ---------------- the list: three big-photo cards a screen ----------------
   On a card: a short sideways swipe flips photos, a long swipe (past 40%) shortlists (right) or hides (left).
   Tap anywhere else on the card to open it. */
const shortTitle = (p) => titleOf(p).replace(/ for (sale|rent)$/i, "");
const shortPlace = (p) => [isDev(p) ? p.building : null, p.locality, p.city].filter(Boolean).join(", ");
function photoCount(p) { return Math.max(p.nphotos || 0, (p.photos || []).length); }
function listCard(p) {
  const n = photoCount(p);
  const can = canSave(p);
  const first = cardOf(p);
  const links = (p.photos || []).map(cardPhoto);
  const slots = n > 1 ? [first, ...Array.from({ length: n - 1 }, (_, i) => links[i + 1] || "")] : [first];
  const tag = isDev(p) ? "New project" : commonWith(p).length ? `♥ ${commonWith(p).length} in common` : p.good_deal ? "Good deal" : p.price_cut_pct ? `Price cut ${p.price_cut_pct}%` : "";
  return `<div class="lcard" data-id="${esc(p.id)}">
    ${can ? `<div class="lc-under" aria-hidden="true"><span class="lc-yes">♥ Shortlist</span><span class="lc-no">Hide ✕</span></div>` : ""}
    <div class="lc-front">
      <div class="lc-photos"><div class="lc-track">${slots.map((src, i) => `<img ${src ? (i ? `data-src="${esc(src)}"` : `src="${esc(src)}"`) : ""} data-k="${i}" alt="" ${i ? "" : `loading="lazy" `}decoding="async" draggable="false">`).join("")}</div></div>
      ${n > 1 ? `<span class="lc-count">1 / ${n}</span>` : ""}
      ${tag ? `<span class="lc-tag">${esc(tag)}</span>` : ""}
      ${can ? `<button type="button" class="lc-x" aria-label="Hide this listing">✕</button>
      <button type="button" class="lc-heart" aria-pressed="${!!p.watched}" aria-label="${p.watched ? "Remove from shortlist" : "Add to shortlist"}">${p.watched ? "♥" : "♡"}</button>` : ""}
      <div class="litem lc-info" data-id="${esc(p.id)}"><span class="lp">${esc(priceOf(p))}</span><span class="lc-what">${esc(shortTitle(p))}${shortPlace(p) ? " · " + esc(shortPlace(p)) : ""}</span></div>
    </div>
  </div>`;
}

async function openList(mode) {
  if (mode) S.listMode = mode;
  const short = S.listMode === "short";
  const seq = (S.listSeq = (S.listSeq || 0) + 1);
  let items, note = "", total;
  if (short) {
    items = await shortlistPins();
  } else if (S.mapMode === "clusters") {

    const q = screenQuery(chipQuery());
    q.set("mode", "list"); q.set("lim", "30");

  } else {
    items = visiblePosts().filter(inView);
  }

  if (total === undefined) total = items.length;
  const ranked = !short && S.chips.has("share") && myInterests().length;

  const nHidden = savedCount("hidden");
  $("#panel-content").innerHTML = `
    <div class="list-head">

        <button type="button" role="tab" data-lm="short" aria-pressed="${short}">♥ Shortlisted (${savedCount("shortlist")})</button>
      </div>
      <p class="lh-line">${short ? (S.signedIn ? "We'll tell you if any of these drop in price." : "Kept on this device. Sign in to keep them and get price-drop alerts.")
        : note || (ranked ? "Best co-living matches first." : "Move the map to see more.")}
        ${nHidden ? ` <button type="button" class="linkish lh-hidden" id="manage-hidden">${nHidden} hidden</button>` : ""}</p>
      ${items.some(canSave) && !store.get("ps_swiped") ? `<p class="swipe-hint">Swipe a card right to shortlist ♥, left to hide. A short swipe on the photo flips through pictures.</p>` : ""}
    </div>
    ${items.map(listCard).join("") || `<p class="hint" style="padding:0 18px">${short ? "Nothing shortlisted yet. Swipe a listing right, or tap ♡." : "Nothing here yet. Try another area or more options above."}</p>`}`;
  bindListCards();
  document.querySelectorAll("[data-lm]").forEach((b) => b.addEventListener("click", () => { panel.scrollTop = 0; openList(b.dataset.lm); }));
  const mh = $("#manage-hidden"); if (mh) mh.addEventListener("click", () => openHiddenManager());
  if (S.panelMode !== "list") panel.scrollTop = 0;

  panel.classList.add("list-mode");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");

}
async function shortlistPins() {
  try {
    if (S.signedIn) return (await api("/shortlist")).pins.map(cachePut).filter((p) => !p.hidden);
    const ids = LOCAL.get("ps_short");
    if (!ids.length) return [];
    const { pins } = await api("/posts/batch", { method: "POST", body: JSON.stringify({ ids }) });
    return pins.map((p) => { const v = cachePut(p); v.watched = true; return v; });
  } catch (e) { toast(e.message); return []; }
}

function bindListCards() {
  document.querySelectorAll("#panel-content .lcard").forEach((card) => {
    const p = getPost(card.dataset.id);
    if (!p) return;
    const front = card.querySelector(".lc-front");
    front.addEventListener("click", (e) => {
      if (e.target.closest("button") || card.dataset.swiped) return;
      openDetails(p.id, { pan: true });
    });
    const heart = card.querySelector(".lc-heart");
    if (heart) heart.addEventListener("click", async (e) => {
      e.stopPropagation();
      try { await setShortlist(p, !p.watched); } catch (err) { return toast(err.message); }
      refreshCard(card, p);
      toast(p.watched ? "Added to your shortlist ♥" : "Removed from your shortlist.");
      if (S.listMode === "short" && !p.watched) openList();
    });
    const x = card.querySelector(".lc-x");
    if (x) x.addEventListener("click", (e) => { e.stopPropagation(); swipeHide(card, p); });
    bindCardGestures(card, p);
  });
}
function refreshCard(card, p) {
  const h = card.querySelector(".lc-heart");
  if (h) { h.textContent = p.watched ? "♥" : "♡"; h.setAttribute("aria-pressed", String(!!p.watched)); h.setAttribute("aria-label", p.watched ? "Remove from shortlist" : "Add to shortlist"); }
  const tab = document.querySelector('[data-lm="short"]');
  if (tab) tab.textContent = `♥ Shortlisted (${savedCount("shortlist")})`;
}
/** Start downloading photo i of a card (if it isn't already). */
function warmPhoto(card, i) {
  const img = card.querySelectorAll(".lc-track img")[i];
  if (img && !img.getAttribute("src") && img.dataset.src) img.src = img.dataset.src;
}
/* When a card scrolls into view, its second photo starts loading, so the first swipe is instant. */
const warmObs = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  warmPhoto(e.target, 1);
  warmObs.unobserve(e.target);
}), { rootMargin: "200px 0px" }) : null;
/** Older saved pins have no photo links: fetch the details the first time someone flips through. */
async function fillPhotos(card, p) {
  if (card.querySelector(".lc-track img[data-src]")) return;
  if (card.dataset.filled) return;
  card.dataset.filled = "1";
  const full = await loadFull(p.id);
  if (!full || !full.photos) return;
  card.querySelectorAll(".lc-track img").forEach((img, i) => { if (full.photos[i] && !img.getAttribute("src")) img.src = cardPhoto(full.photos[i]); });
}
function bindCardGestures(card, p) {
  const front = card.querySelector(".lc-front"), track = card.querySelector(".lc-track"), count = card.querySelector(".lc-count");
  const n = track.children.length, can = canSave(p);
  let idx = 0, x0 = 0, y0 = 0, dx = 0, pid = null, active = false, decided = false, onPhoto = false;
  const W = () => card.clientWidth || 1;
  const showIdx = (i) => {
    idx = Math.max(0, Math.min(n - 1, i));
    track.style.transition = ""; track.style.transform = `translateX(${-idx * 100}%)`;
    if (count) count.textContent = `${idx + 1} / ${n}`;
    warmPhoto(card, idx); warmPhoto(card, idx + 1); warmPhoto(card, idx + 2);
  };
  if (n > 1 && warmObs) warmObs.observe(card); else if (n > 1) warmPhoto(card, 1);
  const reset = () => { front.style.transform = ""; card.classList.remove("dragging", "go-yes", "go-no", "armed"); track.style.transition = ""; track.style.transform = `translateX(${-idx * 100}%)`; };
  front.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || e.target.closest("button")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; active = true; decided = false;
    onPhoto = !!e.target.closest(".lc-photos");
  });
  front.addEventListener("pointermove", (e) => {
    if (!active || e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      if (Math.abs(my) > Math.abs(mx)) { active = false; return; }   // scrolling the list
      try { front.setPointerCapture(pid); } catch (err) {}
      if (onPhoto && n > 1) { warmPhoto(card, idx + 1); warmPhoto(card, idx + 2); fillPhotos(card, p); }
    }
    dx = mx;
    const far = Math.abs(dx) > W() * 0.4;
    if (can && (far || !(onPhoto && n > 1))) {
      // Moving the whole card: shortlist or hide on release.
      card.classList.add("dragging");
      track.style.transition = ""; track.style.transform = `translateX(${-idx * 100}%)`;
      front.style.transform = `translateX(${dx}px) rotate(${dx / 45}deg)`;
      card.classList.toggle("go-yes", dx > 0);
      card.classList.toggle("go-no", dx < 0);
      card.classList.toggle("armed", far);
    } else if (onPhoto && n > 1) {
      // Flipping through photos: the photo follows the finger.
      card.classList.remove("dragging", "go-yes", "go-no", "armed");
      front.style.transform = "";
      track.style.transition = "none";
      track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`;
    }
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (decided) { card.dataset.swiped = "1"; setTimeout(() => { delete card.dataset.swiped; }, 350); }
    const far = decided && Math.abs(dx) > W() * 0.4;
    if (far && can && dx > 0) { reset(); swipeShortlist(card, p); }
    else if (far && can && dx < 0) { card.classList.remove("dragging"); swipeHide(card, p); }
    else if (decided && onPhoto && n > 1 && Math.abs(dx) > 40) { reset(); showIdx(idx + (dx < 0 ? 1 : -1)); }
    else reset();
    dx = 0;
  };
  front.addEventListener("pointerup", end);
  front.addEventListener("pointercancel", () => { active = false; reset(); });
}
async function swipeShortlist(card, p) {
  store.set("ps_swiped", "1");
  const was = !!p.watched;
  if (!was) { try { await setShortlist(p, true); } catch (e) { return toast(e.message); } }
  refreshCard(card, p);
  card.classList.add("pulse"); setTimeout(() => card.classList.remove("pulse"), 600);
  if (was) return toast("Already on your shortlist ♥");
  undoToast(S.signedIn ? "Added to your shortlist ♥" : "Added to your shortlist ♥ (on this device)", async () => {
    try { await setShortlist(p, false); refreshCard(card, p); if (S.listMode === "short") openList(); } catch (e) { toast(e.message); }
  });
}
async function swipeHide(card, p) {
  store.set("ps_swiped", "1");
  const front = card.querySelector(".lc-front");
  card.classList.add("leaving", "go-no");
  front.style.transform = "translateX(-115%)";
  try { await setHiddenId(p.id, true); }
  catch (e) { front.style.transform = ""; card.classList.remove("leaving", "go-no"); return toast(e.message); }
  setTimeout(() => {
    card.style.height = card.offsetHeight + "px";
    requestAnimationFrame(() => { card.classList.add("collapse"); card.style.height = "0px"; });
    setTimeout(() => { renderMarkers(); openList(); }, 280);
  }, 200);
  undoToast("Hidden from your map and list.", async () => {
    try { await setHiddenId(p.id, false); renderMarkers(); refreshMap(true); openList(); } catch (e) { toast(e.message); }
  });
}

/* Hidden listings: see them all, unhide one, or clear the lot (My profile, or "Manage" in the list). */
async function openHiddenManager() {
  openSheet("hidden", "Hidden listings");
  const body = $("#sheet-body");
  body.innerHTML = `<p class="muted">Loading…</p>`;
  let items = [];
  try {
    if (S.signedIn) items = (await api("/hidden")).hidden;
    else {
      const ids = LOCAL.get("ps_hidden");
      items = ids.length ? (await api("/posts/batch", { method: "POST", body: JSON.stringify({ ids }) })).pins : [];
      // Listings that were removed since don't come back from the server; still list them so they can be cleared.
      ids.filter((id) => !items.some((x) => x.id === id)).forEach((id) => items.push({ id, kind: "listing", status: "removed" }));
    }
  } catch (e) { body.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  const draw = () => {
    body.innerHTML = items.length ? `
      <p class="muted">These are off your map and list. Other people still see them.</p>
      <button class="btn" style="width:100%;margin:0 0 14px" id="clear-hidden">Show them all again (${items.length})</button>
      ${items.map((p) => `<div class="my-post">
        <div><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))}${p.price ? " · " + esc(priceOf(p)) : ""}${p.status && p.status !== "active" ? " · no longer listed" : ""}</small></div>
        <button class="btn" data-unhide="${esc(p.id)}">Unhide</button></div>`).join("")}`
      : `<p class="muted">You haven't hidden anything. Swipe a listing left in the list to hide it from your map.</p>`;
    body.querySelectorAll("[data-unhide]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      try { await setHiddenId(b.dataset.unhide, false); items = items.filter((x) => x.id !== b.dataset.unhide); refreshMap(true); draw(); }
      catch (e) { b.disabled = false; toast(e.message); }
    }));
    const c = $("#clear-hidden");
    if (c) c.addEventListener("click", async () => {
      c.disabled = true;
      try {
        if (S.signedIn) await api("/hidden", { method: "DELETE" }); else store.del("ps_hidden");
        S.cache.forEach((p) => { p.hidden = false; });
        if (S.me && S.me.counts) S.me.counts.hidden = 0;
        items = []; refreshMap(true); draw(); toast("Everything is back on your map.");
      } catch (e) { c.disabled = false; toast(e.message); }
    });
  };
  draw();
}

/* ---------------- search ---------------- */
const qEl = $("#q"), resultsEl = $("#results");
let searchTimer, searchSel = -1;

function searchText(p) {
  return [p.building, p.locality, p.city, p.country, p.address, p.company].filter(Boolean).join(" ").toLowerCase();
}
function matchPosts(q) {
  const words = q.toLowerCase().split(/[\s,]+/).filter(Boolean);
  if (!words.length) return [];
  return [...S.cache.values()].filter((p) => p.kind === S.tab && !p.hidden && words.every((w) => searchText(p).includes(w)));
}
let searchServerTimer, searchServerSeq = 0;
/** Ask the server too: it knows listings outside the area loaded so far. */
function searchServer(q) {
  clearTimeout(searchServerTimer);
  searchServerTimer = setTimeout(async () => {
    const seq = ++searchServerSeq;
    try {
      const r = await api(`/search?kind=${S.tab}&q=${encodeURIComponent(q)}`);
      r.pins.forEach(cachePut);
      if (seq === searchServerSeq && qEl.value.trim() === q && document.activeElement === qEl) renderResults(true);
    } catch (e) {}
  }, 250);
}

function renderResults(fromServer) {
  const q = qEl.value.trim();
  $("#q-clear").hidden = !q;
  if (q.length < 2) { resultsEl.hidden = true; return; }
  if (fromServer !== true) searchServer(q);
  const hits = matchPosts(q);
  searchSel = -1;
  resultsEl.innerHTML = hits.slice(0, 6).map((p) => `
      <button class="result" role="option" data-id="${esc(p.id)}">
        <img src="${esc(thumbOf(p))}" alt="">
        <span class="r-main"><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))}</small></span>
        <span class="r-price">${esc(p.price ? amount(p) : "")}</span>
      </button>`).join("")
    + (hits.length > 6 ? `<button class="result go" data-all="1">Show all ${hits.length} matches on the map</button>` : "")
    + `<button class="result go" data-go="1">Show “${esc(q)}” on the map</button>`
    + (hits.length ? "" : `<div class="result empty">No listed properties match yet. You can still move the map there.</div>`);
  resultsEl.hidden = false;
  const act = (b, fn) => {
    b.addEventListener("pointerdown", (e) => e.preventDefault());
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", fn);
  };
  resultsEl.querySelectorAll("[data-id]").forEach((b) => act(b, () => pickPost(b.dataset.id)));
  resultsEl.querySelectorAll("[data-all]").forEach((b) => act(b, () => showMatches(hits)));
  resultsEl.querySelectorAll("[data-go]").forEach((b) => act(b, () => goToPlace(q)));
}

function closeResults() { resultsEl.hidden = true; }

function pickPost(id) {
  closeResults();
  qEl.blur();
  openDetails(id, { zoom: 15 });
}

function showMatches(hits) {
  closeResults();
  qEl.blur();
  hits.forEach((p) => { if (p.kind === "listing" && !passChips(p)) S.chips.add(p.deal); });
  saveChips();
  renderMarkers();
  const b = new google.maps.LatLngBounds();
  hits.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
  S.map.fitBounds(b, 80);
  google.maps.event.addListenerOnce(S.map, "idle", () => { if (S.map.getZoom() > 15) S.map.setZoom(15); openList(); });
}

async function goToPlace(q) {
  closeResults();
  qEl.blur();
  try {
    const { place } = await api("/geocode?q=" + encodeURIComponent(q));
    if (!place) return toast(`Couldn't find “${q}”. Try adding the city.`);
    closeDetails();
    if (place.viewport) S.map.fitBounds({ north: place.viewport.north, south: place.viewport.south, east: place.viewport.east, west: place.viewport.west }, 40);
    else { S.map.setCenter({ lat: place.lat, lng: place.lng }); S.map.setZoom(13); }
    google.maps.event.addListenerOnce(S.map, "idle", async () => {
      await refreshMap();
      if (viewCount()) openList("view");
      else toast(`No properties listed around ${place.address || q} yet${S.chips.size < DEAL_CHIPS.length ? " for the options you've picked" : ""}.`);
    });
  } catch (e) {
    toast(e.message);
  }
}

qEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderResults, 120); });
qEl.addEventListener("focus", renderResults);
qEl.addEventListener("blur", () => setTimeout(closeResults, 300));
qEl.addEventListener("keydown", (e) => {
  const opts = [...resultsEl.querySelectorAll("button.result")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!opts.length) return;
    searchSel = (searchSel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("sel", i === searchSel));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const q = qEl.value.trim();
    if (!q) return;
    if (searchSel >= 0 && opts[searchSel]) { opts[searchSel].click(); return; }
    const hits = matchPosts(q);
    if (hits.length === 1) pickPost(hits[0].id);
    else if (hits.length > 1) showMatches(hits);
    else goToPlace(q);
  } else if (e.key === "Escape") {
    closeResults();
    qEl.blur();
  }
});
$("#q-clear").addEventListener("click", () => { qEl.value = ""; $("#q-clear").hidden = true; closeResults(); qEl.focus(); });

if (IN_APP) {

}

    pill.hidden = false;
  } else pill.hidden = true;

/** One entry point: sign in -> contact details -> role -> the right posting screen. */
function profileComplete() {
  const p = S.me && S.me.profile;
  return !!(p && p.name && p.phone && p.email);
}

function startPosting() {
  if (!S.session) { store.set("ps_resume", "1"); return renderSignIn("Sign in to list a property, a project or what you're looking for."); }
  const p = S.me && S.me.profile;
  if (!profileComplete()) return renderProfileStep();
  if (!p.role) return renderRolePicker(false);
  if (roleKey(p.role) === "developer") return openDevForm();
  return openComposer();
}

function renderRolePicker(switching) {
  openSheet("role", switching ? "Switch role" : "How will you use Property Stalkers?");
  const prof = (S.me && S.me.profile) || {};
  let chosen = roleKey(prof.role) || null;
  $("#sheet-body").innerHTML = `
    <p class="muted">${switching ? "Choose who you're posting as now. You can switch back any time." : "Pick one to get started. You can switch any time."}</p>
    <div class="roles">
      ${Object.entries(ROLES).map(([id, r]) => `

    </div>
    <div class="role-extra" id="extra-developer" hidden>
      <label class="field"><span>Company name</span><input id="r-company" value="${esc(prof.company)}" placeholder="e.g. Skyline Developers" autocomplete="organization"></label>
    </div>
    <button class="btn primary" style="width:100%;margin-top:16px" id="role-save">Continue</button>
    <p class="error" id="role-err" hidden></p>`;
  const showExtra = () => {
    $("#extra-broker").hidden = chosen !== "broker";
    $("#extra-developer").hidden = chosen !== "developer";
  };
  showExtra();
  document.querySelectorAll(".role-card").forEach((c) => c.addEventListener("click", () => {
    chosen = c.dataset.role;
    $("#role-err").hidden = true;
    document.querySelectorAll(".role-card").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
    showExtra();
  }));
  $("#role-save").addEventListener("click", async () => {
    const err = $("#role-err");
    if (!chosen) { err.hidden = false; err.textContent = "Please choose one option."; return; }
    const btn = $("#role-save"); btn.disabled = true; btn.textContent = "Saving…";

      const changed = chosen !== roleKey(prof.role);
      const r = await api("/me/role", { method: "POST", body: JSON.stringify({ role: chosen, licence: $("#r-licence").value, company: $("#r-company").value }) });
      if (changed) { S.chat = []; S.draft = null; S.devForm = null; }
      if (S.me && r.profile) { S.me.profile = r.profile; if (r.access) S.me.access = r.access; renderAccountButton(); }
      else await refreshMe();
      loadFeed();
      toast(`You're now posting as ${ROLES[chosen].label}.`);
      if (switching) closeSheet(); else startPosting();
    } catch (e) {
      btn.disabled = false; btn.textContent = "Continue";
      err.hidden = false; err.textContent = e.message;
    }
  });
}

const CURRENCIES = ["INR", "AED", "USD", "GBP", "EUR", "SAR", "QAR", "OMR", "KWD", "BHD", "SGD", "CAD", "AUD"];
const CONFIGS = [["0", "Studio"], ["1", "1 BHK"], ["2", "2 BHK"], ["3", "3 BHK"], ["4", "4 BHK"], ["5", "5+ BHK"]];

function configsText(sel) {
  const nums = sel.map(Number).sort((a, b) => a - b);
  const parts = nums.map((n) => (n === 0 ? "Studio" : n === 5 ? "5+" : String(n)));
  const hasBhk = nums.some((n) => n > 0);
  if (!parts.length) return "";
  const list = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " & " + parts[parts.length - 1];
  return hasBhk ? list + " BHK" : list;
}
function monthText(v) {
  if (!/^\d{4}-\d{2}$/.test(v || "")) return "";
  const [y, m] = v.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
}

const GOOGLE_G = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

function renderSignIn(reason, mode) {
  openSheet("signin", "Sign in");
  mode = mode || "email";
  $("#sheet-body").innerHTML = `
    <p class="muted">${esc(reason || "Sign in to list a property, a project or what you're looking for.")} You'll stay signed in on this device.</p>
    <div id="oauth" class="oauth"></div>
    <div class="tabs2" id="auth-tabs">
      <button type="button" class="segb" data-m="email" aria-pressed="${mode === "email"}">Email</button>
      <button type="button" class="segb" data-m="phone" aria-pressed="${mode === "phone"}">Mobile number</button>
    </div>
    <form id="signin-form" novalidate>
      ${mode === "phone"
        ? `<label class="field"><span>Mobile number with country code</span><input type="tel" id="ident" inputmode="tel" autocomplete="tel" placeholder="+971 50 123 4567"></label>`
        : `<label class="field"><span>Email</span><input type="email" id="ident" autocomplete="email" placeholder="you@example.com"></label>`}
      <button class="btn accent" style="width:100%" id="signin-btn">Send me a code</button>
      <p class="error" id="signin-err" hidden></p>
    </form>`;
  authProviders().then((pv) => {
    const box = $("#oauth");
    if (box && pv.google && !IN_APP) { // Google doesn't allow its sign-in inside apps' web views
      box.innerHTML = `<button class="btn oauth-btn" id="google-btn" type="button">${GOOGLE_G}<span>Continue with Google</span></button><div class="or"><span>or</span></div>`;
      $("#google-btn").addEventListener("click", async () => {
        const { error } = await S.sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
        if (error) { const err = $("#signin-err"); err.hidden = false; err.textContent = "Google sign-in isn't available right now. Please use your email."; }
      });
    }
    S.phoneSignIn = !!pv.phone;
    if (mode === "phone" && !pv.phone) showPhoneSoon();
  });
  document.querySelectorAll("#auth-tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.m !== mode) renderSignIn(reason, b.dataset.m);
  }));
  function showPhoneSoon() {
    const err = $("#signin-err");
    err.hidden = false;
    err.textContent = "Sign-in with a mobile number is being set up and isn't available yet. Please use your email for now. You can add your mobile number in My profile.";
    $("#signin-btn").textContent = "Use email instead";
  }
  $("#signin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (mode === "phone" && S.providers && !S.providers.phone) { renderSignIn(reason, "email"); return; }
    const raw = $("#ident").value.trim();
    const err = $("#signin-err");
    let ident;
    if (mode === "phone") {
      const digits = raw.replace(/[^0-9]/g, "");
      if (digits.length < 8) { err.hidden = false; err.textContent = "Please enter your mobile number with country code, e.g. +971 50 123 4567."; return; }
      ident = { phone: "+" + digits };
    } else {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw)) { err.hidden = false; err.textContent = "Please enter a valid email address."; return; }
      ident = { email: raw };
    }
    const btn = $("#signin-btn");
    btn.disabled = true; btn.textContent = "Sending…";
    let error;
    try {
      if (!S.sb) throw new Error("not ready");
      ({ error } = await withTimeout(S.sb.auth.signInWithOtp({ ...ident, options: mode === "email" ? { emailRedirectTo: location.origin + location.pathname } : {} }), 20000));
    } catch (ex) { error = { message: ex.message === "timeout" ? "timeout" : "network" }; }
    if (error) {
      btn.disabled = false; btn.textContent = "Send me a code";
      err.hidden = false;
      err.textContent = /rate|seconds/i.test(error.message) ? "Please wait a minute before asking for another code."
        : /timeout|network/.test(error.message) ? "Couldn't reach the sign-in service. Please check your connection and try again."
        : mode === "phone" ? "Couldn't send a text to that number. Please check it, or sign in with email." : "Couldn't send the email. Please check the address and try again.";
      return;
    }
    renderCodeEntry(ident, mode, reason);
  });
}

function renderCodeEntry(ident, mode, reason) {
  const where = ident.email || ident.phone;
  $("#sheet-body").innerHTML = `
    <h3 style="margin:4px 0 8px">Enter your code</h3>
    <p class="muted">We sent a code to <b>${esc(where)}</b>.${mode === "email" ? " The email also has a sign-in link you can tap instead. Can't see it? Check your spam folder." : ""}</p>
    <form id="code-form" novalidate>
      <label class="field"><span>Code</span><input id="otp" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
      <button class="btn primary" style="width:100%" id="code-btn">Sign in</button>
      <p class="error" id="code-err" hidden></p>
    </form>
    <button class="link-btn" style="color:var(--brand)" id="code-back">Use a different ${mode === "phone" ? "number" : "email"} or send again</button>`;
  const otp = $("#otp");
  otp.focus();
  otp.addEventListener("input", () => {
    otp.value = otp.value.replace(/\D/g, "");
    $("#code-err").hidden = true;
    if (otp.value.length >= 6 && otp.value.length === Number(otp.dataset.len || 6)) $("#code-form").requestSubmit();
  });
  $("#code-back").addEventListener("click", () => renderSignIn(reason, mode));
  $("#code-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = otp.value.trim();
    const err = $("#code-err");
    if (token.length < 6) { err.hidden = false; err.textContent = "Please enter the code from the " + (mode === "phone" ? "text message." : "email."); return; }
    const btn = $("#code-btn"); btn.disabled = true; btn.textContent = "Checking…";
    let error;
    try { ({ error } = await withTimeout(S.sb.auth.verifyOtp({ ...ident, token, type: mode === "phone" ? "sms" : "email" }), 20000)); }
    catch (ex) { error = { message: "network" }; }
    if (error) {
      btn.disabled = false; btn.textContent = "Sign in";
      err.hidden = false; err.textContent = /expired|invalid/i.test(error.message) ? "That code isn't right or has expired. Check the latest email, or tap below to get a new code."
        : error.message === "network" ? "Couldn't reach the sign-in service. Please check your connection and try again." : "That code isn't right. Please check it and try again.";
      return;
    }
    closeSheet();
    toast("You're signed in.");
  });
}

function bindProfileForm(onSaved) {
  let avatar; // undefined = unchanged, "" = remove, url = new picture
  const showErr = (m) => { const el = $("#pf-err"); el.hidden = false; el.textContent = m; };
  $("#profile-form").addEventListener("input", () => { $("#pf-err").hidden = true; });
  bindInterestPicker("pf-interests");
  $("#pf-pic-add").addEventListener("click", () => $("#pf-pic-file").click());
  $("#pf-pic-file").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const btn = $("#pf-pic-add"), save = $("#pf-save");
    btn.disabled = true; save.disabled = true; btn.textContent = "Uploading…";
    try {
      const url = await uploadPhoto(file, { square: 400 });
      avatar = url;
      $("#pf-pic").innerHTML = `<img src="${esc(shown(url))}" alt="Your profile picture">`;
      $("#pf-pic-remove").hidden = false;
    } catch (err) { showErr(err.message || "The photo couldn't be uploaded. Please try again."); }
    btn.disabled = false; save.disabled = false; btn.textContent = "Change photo";
  });
  $("#pf-pic-remove").addEventListener("click", () => {
    avatar = "";
    $("#pf-pic").textContent = initials($("#pf-name").value.trim() || "Me");
    $("#pf-pic-remove").hidden = true;
    $("#pf-pic-add").textContent = "Add profile photo";
  });
  $("#profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#pf-save"), label = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const v = (id) => $(id).value.trim();
      if (v("#pf-name").length < 2) throw new Error("Please enter your name.");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("#pf-email"))) throw new Error("Please enter a valid email address.");
      if (v("#pf-phone").replace(/\D/g, "").length < 8) throw new Error("Please enter your mobile number with country code.");
      await api("/me", { method: "POST", body: JSON.stringify({ name: v("#pf-name"), email: v("#pf-email"), phone: v("#pf-phone"), rera: v("#pf-rera"), notify_email: $("#pf-notify") ? $("#pf-notify").checked : undefined, interests: $("#pf-interests") ? pickedInterests("pf-interests") : undefined, ...(avatar !== undefined ? { avatar } : {}) }) });
      await refreshMe();
      onSaved();
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      const el = $("#pf-err"); el.hidden = false; el.textContent = err.message;
    }
  });
}

    <form class="composer" id="composer">

      </div>
    </form>`;
  S.ghost = { base: START, hint: ghostText() };
  document.querySelectorAll("#ideas .idea").forEach((b) => b.addEventListener("click", () => {
    const idea = IDEAS[role][+b.dataset.i];
    document.querySelectorAll("#ideas .idea").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    S.ghost = { base: START + idea.start, hint: idea.hint };
    const t = $("#msg"); t.value = S.ghost.base; ghostUpdate(); autoGrow();

  const log = $("#log");
  if (!S.chat.length) {
    const intro = document.createElement("div");
