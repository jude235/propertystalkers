<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Property Stalkers | Properties and requests on the map</title>
<meta name="description" content="Search properties and new projects for sale and rent on one map, anywhere in the world. Post your own listing in plain words.">
<meta name="theme-color" content="#0f3b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<style>
  /* Emerald heritage theme: Marcellus for headings and prices, Jost for everything else. */
  :root {
    --brand: #0f3b2e;        /* emerald */
    --brand-ink: #f3ebdd;    /* cream text on emerald */
    --brass: #b8894a;        /* decorative accent */
    --brass-ink: #8a6327;    /* brass dark enough for text */
    --req: #7a5a27;          /* request pins and headers */
    --ink: #1d2a24;
    --muted: #6d6656;
    --line: #e4dac6;
    --bg: #fbf7ef;           /* cards */
    --soft: #f3ebdd;         /* page, fields */
    --wa: #1f7a4d;
    --warn-bg: #f6e7c8;
    --warn-ink: #5e4210;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(15, 59, 46, .18);
    --serif: Marcellus, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--soft); color: var(--ink);
    font-family: Jost, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  #map-wrap { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; background: #e9e2d3; }

  /* ---------- header ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; }
  .header { pointer-events: auto; background: var(--brand); color: var(--brand-ink);
    padding: calc(12px + env(safe-area-inset-top)) 16px 14px; border-bottom: 2px solid var(--brass);
    box-shadow: 0 6px 20px rgba(15, 59, 46, .25); }
  .header-in { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand-mark { width: 30px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; }
  .brand-name { font-family: var(--sans, 'Jost', sans-serif); font-weight: 500; font-size: clamp(18px, 5.2vw, 22px); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
  .brand-name span { color: #d6ad6e; }
  .account { border: 1px solid rgba(243, 235, 221, .5); cursor: pointer; background: transparent; color: var(--brand-ink);
    height: 38px; min-width: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; flex: 0 0 auto; }
  .banner-inline { background: #fff3e6; border: 1px solid #f0c48a; color: #7a4a10; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  .account.profile-btn { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; position: relative; }
  .pav { width: 30px; height: 30px; border-radius: 50%; background: var(--brass); color: var(--brand); display: grid; place-items: center; font-size: 13px; font-weight: 500; overflow: hidden; }
  .pav img, .avatar img, .pf-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pf-pic-row { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
  .pf-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--brand); color: var(--brass); border: 2px solid var(--brass);
    font-family: var(--serif); font-size: 24px; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
  .pf-pic-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pdot { position: absolute; top: 2px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #e0583c; border: 2px solid var(--brand); }
  .plabel-s { display: none; }
  @media (max-width: 400px) { .plabel { display: none; } .plabel-s { display: inline; } .account.profile-btn { padding: 0 10px 0 4px; gap: 6px; } .brand-name { font-size: 18px; } }
  @media (max-width: 340px) { .plabel-s { display: none; } .account.profile-btn { padding: 0 4px; } }
  .account.avatar-btn { padding: 0; width: 38px; background: var(--brass); border-color: var(--brass); color: var(--brand); font-weight: 500; }

  /* Properties / Requests switch */
  .tabs { display: flex; width: 100%; max-width: 380px; padding: 4px; border-radius: 999px;
    background: rgba(243, 235, 221, .10); border: 1px solid rgba(243, 235, 221, .28); }
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; background: none;
    padding: 9px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; color: rgba(243, 235, 221, .88);
    transition: background .2s, color .2s; }
  .tab:hover { color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--brand-ink); color: var(--brand); box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
  .tab .n { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; line-height: 20px; text-align: center;
    background: rgba(243, 235, 221, .18); color: inherit; }
  .tab .n:empty { display: none; }
  .tab[aria-selected="true"] .n { background: var(--brand); color: var(--brand-ink); }
  .tabs[hidden] { display: none; }

  /* Search */
  .search { position: relative; flex: 1; min-width: 0; }
  .search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid rgba(243, 235, 221, .35);
    background: rgba(243, 235, 221, .12); color: var(--brand-ink); padding: 0 40px 0 42px; font-size: 15px; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: rgba(243, 235, 221, .75); }
  .search input:focus { outline: none; background: var(--brand-ink); color: var(--ink); border-color: var(--brass); }
  .search input:focus::placeholder { color: var(--muted); }
  .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--brass); display: flex; }
  .s-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .s-clear[hidden] { display: none; }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg); color: var(--ink); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 25; border: 1px solid var(--line); }
  .results[hidden] { display: none; }
  .result { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px;
    cursor: pointer; border-bottom: 1px solid var(--line); color: var(--ink); }
  .result:last-child { border-bottom: 0; }
  .result:hover, .result.sel { background: var(--soft); }
  .result img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  .result .r-main { min-width: 0; flex: 1; }
  .result b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .r-price { font-family: var(--serif); color: var(--brand); white-space: nowrap; font-size: 15px; }
  .result.go { color: var(--brass-ink); font-weight: 500; font-size: 14px; }
  .result.empty { cursor: default; color: var(--muted); font-size: 13px; }

  /* Filters */
  .filters { pointer-events: auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters[hidden] { display: none; }
  .fchip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(15, 59, 46, .14); display: inline-flex; align-items: center; gap: 6px; }
  .fchip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .fchip.list { border-color: var(--brass); color: var(--brass-ink); }
  .fchip .n { font-size: 12px; opacity: .8; }

  /* List of properties in view */
  .list-head { padding: 22px 18px 8px; }
  .list-head h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--brand); margin: 0 0 4px; }
  .list-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .litem { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 18px; cursor: pointer; color: var(--ink); }
  .litem:hover { background: var(--soft); }
  .litem img { width: 84px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  .litem div { min-width: 0; }
  .litem b { display: block; font-weight: 500; font-size: 15px; }
  .litem small { display: block; color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .litem .lp { font-family: var(--serif); color: var(--brand); font-size: 16px; }
  .tag.dev { color: var(--brand); background: none; }
  .banner-row { padding: 12px 16px 0; }
  .banner { pointer-events: auto; max-width: 420px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brass);
    border-radius: 0 12px 12px 0; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); box-shadow: 0 4px 14px rgba(15, 59, 46, .12); }
  .banner b { color: var(--ink); font-weight: 500; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--brass); cursor: pointer; background: var(--brand); color: var(--brand-ink); font-weight: 500; font-size: 15px;
    letter-spacing: .03em; padding: 14px 24px; border-radius: 999px; box-shadow: 0 10px 24px rgba(15, 59, 46, .35);
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fab svg { color: var(--brass); }
  .role-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(15, 59, 46, .18); cursor: pointer; white-space: nowrap; }
  .role-pill b { font-weight: 500; color: var(--brand); }
  .role-pill span { color: var(--brass-ink); font-weight: 500; margin-left: 6px; }
  .role-pill[hidden] { display: none; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  /* Set the pin: full-screen map with a fixed pin in the middle. */
  .picker { position: fixed; inset: 0; z-index: 60; background: #000; }
  .picker[hidden] { display: none; }
  #pk-map { position: absolute; inset: 0; }
  .pk-top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
  .pk-search { flex: 1; position: relative; }
  .pk-search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line); padding: 0 14px; font-size: 16px; background: var(--bg); box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
  .pk-top .icon-btn { width: 42px; height: 42px; flex: 0 0 auto; }
  .pk-sug { position: absolute; top: 46px; left: 0; right: 0; background: var(--bg); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); overflow: hidden; }
  .pk-sug button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; font-size: 14px; cursor: pointer; }
  .pk-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 2; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45)); }
  .pk-pin::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 8px; height: 4px; margin-left: -4px; border-radius: 50%; background: rgba(0, 0, 0, .45); }
  .pk-hint { position: absolute; left: 50%; top: calc(50% + 14px); transform: translateX(-50%); z-index: 2; background: rgba(15, 59, 46, .88); color: var(--brand-ink); font-size: 13px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
  .pk-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; z-index: 2; }
  .pk-bottom .btn { height: 48px; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
  .pk-bottom .btn:not(.accent) { background: var(--bg); }
  .pin-btn { margin-top: 10px; width: 100%; }
  .bell { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(243, 235, 221, .35); background: transparent; color: var(--brand-ink); display: grid; place-items: center; cursor: pointer; }
  .bell[hidden] { display: none; }
  .bell-n { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #c0392b; color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .ask-fab { position: fixed; right: 12px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 19; border: 1px solid var(--brass); background: var(--brand); color: var(--brand-ink);
    font-size: 14px; font-weight: 500; letter-spacing: .02em; padding: 6px 14px 6px 8px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(15, 59, 46, .35); }
  /* The robot's white eyes glow and blink. */
  .robot .r-eyes { transform-origin: 16px 16.5px; filter: drop-shadow(0 0 2.5px #fff) drop-shadow(0 0 5px rgba(255, 255, 255, .8)); animation: r-blink 3.6s infinite; }
  .robot .r-tip { filter: drop-shadow(0 0 3px #fff); animation: r-glow 1.8s ease-in-out infinite; }
  @keyframes r-blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } 88% { opacity: 1; } 91% { opacity: .35; } 94% { opacity: 1; } }
  @keyframes r-glow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .robot .r-eyes, .robot .r-tip { animation: none; } }
  /* Phones: a round Stalker button and a slimmer post button, so they never touch. */
  @media (max-width: 600px) {
    .ask-fab { padding: 0; width: 52px; height: 52px; justify-content: center; right: 10px; bottom: calc(24px + env(safe-area-inset-bottom)); }
    .ask-fab span { display: none; }
    .ask-fab .robot { width: 32px; height: 32px; }
    .fab { padding: 12px 18px; font-size: 14px; gap: 6px; max-width: calc(100vw - 150px); }
    .fab #fab-label { overflow: hidden; text-overflow: ellipsis; }
  }
  .ask-card { align-self: stretch; border: 1px solid var(--line); border-radius: 14px; background: #fffdf8; padding: 10px 12px; }
  .ask-card .litem { width: 100%; }
  .ac-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--brass-ink); margin: 2px 0 8px; }
  .ac-text { font-size: 15px; line-height: 1.5; margin: 6px 0 10px; white-space: pre-wrap; }
  .ac-row { display: flex; gap: 8px; font-size: 14px; line-height: 1.5; }
  .ask-card .actions, .ni-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ni-actions .btn, .ask-card .actions .btn { padding: 9px 14px; font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--brand); margin: 6px 6px 0 0; }
  .badge.good { background: #e3f1e6; color: #1d5b33; }
  .badge.cut { background: #fbe9d6; color: #8a4b12; }
  .warn-box { background: #fdecea; border: 1px solid #f2b8b0; color: #7a2316; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin: 12px 0 0; }
  .warn-box b { display: block; margin-bottom: 2px; }
  .confirm-banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 12px 0 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 0; }
  .act-row .btn { font-size: 13px; padding: 10px 8px; }
  .note-item { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .note-item.unread .ni-title::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c0392b; margin-right: 6px; vertical-align: middle; }
  .ni-title { font-weight: 500; font-size: 15px; }
  .ni-body { font-size: 14px; color: var(--ink); margin-top: 4px; line-height: 1.45; }
  .ni-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ni-actions { margin-top: 8px; }
  .cam { flex: 0 0 auto; display: grid; place-items: center; width: 44px; border: 1px solid var(--line); border-radius: 14px; background: #fffdf8; cursor: pointer; font-size: 18px; }
  .chip-check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 10px 0 0; }
  .maptype { position: fixed; left: 12px; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 19; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25); display: flex; align-items: center; gap: 6px; }
  @media (max-width: 759px) { .account:not(.avatar-btn) { height: 34px; padding: 0 12px; font-size: 13px; } .brand { gap: 8px; } }
  @media (max-width: 759px) { .maptype { bottom: calc(150px + env(safe-area-inset-bottom)); } }

  /* Role picker */
  .roles { display: grid; gap: 10px; margin-top: 4px; }
  .oauth-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0 4px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .role-card { text-align: left; border: 1px solid var(--line); background: #fffdf8; border-radius: 14px; padding: 13px 14px; cursor: pointer; color: var(--ink); }
  .role-card b { display: block; font-family: var(--serif); font-weight: 400; font-size: 17px; color: var(--brand); }
  .role-card small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .role-card[aria-pressed="true"] { border: 2px solid var(--brass); padding: 12px 13px; background: #fff8ea; }
  .role-extra { margin-top: 12px; }
  .role-extra[hidden] { display: none; }

  /* Developer form */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #fffdf8; }
  .field textarea { resize: vertical; min-height: 84px; }
  .field select:focus, .field textarea:focus { outline: 2px solid var(--brass); outline-offset: -1px; }
  .field .opt { color: var(--muted); font-weight: 400; }
  .cfgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .cfg { border: 1px solid var(--line); background: #fffdf8; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .cfg[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .price-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .form-section { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--brass-ink); margin: 18px 0 10px; }

  /* ---------- pins ---------- */
  .pin { --pin: var(--brand); position: relative; border: 0; cursor: pointer; white-space: nowrap; background: var(--pin); color: var(--brand-ink);
    font-family: Jost, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .02em; line-height: 1; padding: 7px 11px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25); margin-bottom: 7px; transition: transform .15s ease; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--pin); }
  .pin.req { --pin: var(--req); }
  .pin.dev { --pin: var(--brass); color: var(--brand); }
  .pin.share { --pin: #2f6f8f; color: #fff; }
  .fchip.share[aria-pressed="false"] { border-color: #2f6f8f; color: #24576f; }
  .pin:hover { transform: scale(1.06); }
  .pin.active { --pin: #1d2a24; color: var(--brand-ink); transform: scale(1.12); }
  .cluster { background: var(--brand); color: var(--brand-ink); border-radius: 50%; display: grid; place-items: center; font-weight: 500; font-size: 14px;
    box-shadow: 0 0 0 4px rgba(184, 137, 74, .55); cursor: pointer; }
  .cluster.req { background: var(--req); }

function money(n) {
  if (n == null) return "";
  const trim = (x) => x.toFixed(2).replace(/\.?0+$/, "");
  if (n >= 1e7) return trim(n / 1e7) + " Cr";
  if (n >= 1e5) return trim(n / 1e5) + " L";
  if (n >= 1e3) return trim(n / 1e3) + "K";
  return String(n);
}
const TYPE = { apartment: "apartment", villa: "villa", independent_house: "independent house", plot: "plot", office: "office", shop: "shop", warehouse: "warehouse", other: "" };
const COMMERCIAL = ["office", "shop", "warehouse"];

const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

function what(p) {

}
function titleOf(p) {

  }
  if (p.kind === "listing") return cap(`${what(p)} for ${p.deal === "rent" ? "rent" : "sale"}`);
  const w = what(p);
  return `Looking to ${p.deal === "rent" ? "rent" : "buy"} ${/^[aeiou]/i.test(w) ? "an" : "a"} ${w}`;
}
const placeOf = (p) => [isDev(p) ? null : p.building, p.locality, p.city].filter(Boolean).join(", ");
const SYMBOL = { INR: "₹", USD: "$", GBP: "£", EUR: "€" };
function amount(p) {
  if (p.price == null) return "";
  const cur = p.currency || "INR";
  if (cur === "INR") return "₹" + money(p.price);
  const n = p.price, trim = (x) => x.toFixed(2).replace(/\.?0+$/, "");
  const short = n >= 1e9 ? trim(n / 1e9) + "B" : n >= 1e6 ? trim(n / 1e6) + "M" : n >= 1e3 ? trim(n / 1e3) + "K" : String(n);
  return SYMBOL[cur] ? SYMBOL[cur] + short : cur + " " + short;
}
function priceOf(p) {
  if (p.deal === "share") {
    const bills = p.bills_included === true ? ", bills included" : p.bills_included === false ? ", plus bills" : "";
    if (p.kind === "listing") return p.price ? `${amount(p)}/month per person${bills}` : "Rent on request";
    return p.price ? `Budget ${amount(p)}/month` : "Budget not given";

  if (isDev(p)) return p.price ? `From ${amount(p)}` : "Price on request";
  if (p.kind === "listing") return p.price ? `${amount(p)}${per}` : "Price on request";
  return p.price ? `Budget ${amount(p)}${per}` : "Budget not given";
}
function pinLabel(p) {

  const head = p.deal === "rent" ? "Rent" : "Buy";
  return `${head} · ${p.price ? amount(p) : p.bedrooms ? p.bedrooms + " BHK" : "request"}`;
}
function posterLine(p) {

  if (isDev(p)) return `Developer${p.company ? " · " + p.company : ""}`;

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 3600) return "just now";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  const d = Math.floor(s / 86400);
  return d < 30 ? d + (d === 1 ? " day ago" : " days ago") : new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
const initials = (n) => (n || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const telHref = (d) => "tel:+" + String(d || "").replace(/\D/g, "");
const waHref = (d, text) => `https://wa.me/${String(d || "").replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;

function placeholder(id) {
  let seed = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const h = [158, 165, 38, 32][Math.floor(rnd() * 4)]; // emerald and brass tones
  let towers = "", x = 30;
  while (x < 780) {
    const w = 60 + rnd() * 70, top = 140 + rnd() * 230;
    towers += `<rect x="${x}" y="${top}" width="${w}" height="${600 - top}" fill="hsl(${h},30%,${22 + rnd() * 14}%)"/>`;
    for (let wy = top + 16; wy < 560; wy += 26)
      for (let wx = x + 10; wx < x + w - 12; wx += 18)
        if (rnd() > .35) towers += `<rect x="${wx}" y="${wy}" width="8" height="12" fill="hsla(45,90%,80%,${.35 + rnd() * .5})"/>`;
    x += w + 8 + rnd() * 16;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h},70%,78%)"/><stop offset="1" stop-color="hsl(${(h + 40) % 360},65%,90%)"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="640" cy="120" r="54" fill="hsla(40,100%,96%,.85)"/>${towers}<rect y="560" width="800" height="40" fill="hsl(${h},25%,18%)"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

async function freshToken(force) {
  if (!S.sb || !S.session) return null;
  try {
    if (force) { const { data } = await S.sb.auth.refreshSession(); if (data && data.session) S.session = data.session; }
    else { const { data } = await S.sb.auth.getSession(); if (data && data.session) S.session = data.session; }
  } catch (e) {}
  return S.session ? S.session.access_token : null;
}

async function api(path, opts = {}, retried) {
  const headers = { "content-type": "application/json" };
  const token = await freshToken(false);
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch("/api" + path, { ...opts, headers });
  if (res.status === 401 && token && !retried && await freshToken(true)) return api(path, opts, true);
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(body.error && body.error.includes(" ") ? body.error : "Something went wrong. Please try again.");
    err.code = body.error; err.status = res.status;
    throw err;
  }
  return body;
}

/* ---------------- start up ---------------- */
async function boot() {
  try {
    S.cfg = await api("/config");
  } catch (e) {
    return notice("Almost ready", "The site's server isn't connected yet. Follow the setup guide to add your Supabase, Google Maps and AI keys, then reload this page.");
  }
  if (!window.supabase) return notice("Couldn't load", "Please check your internet connection and reload the page.");

  // Talk to Supabase through our own domain (/sb), so sign-in and photos work even where
  // *.supabase.co is blocked. Keep the original storage key so people stay signed in.
  S.sbBase = location.origin + "/sb";
  const ref = new URL(S.cfg.supabaseUrl).hostname.split(".")[0];
  S.sb = window.supabase.createClient(S.sbBase, S.cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: `sb-${ref}-auth-token` }
  });
  try {
    const { data } = await withTimeout(S.sb.auth.getSession(), 8000);
    S.session = data.session;
  } catch (e) { S.session = null; }
  S.userId = S.session ? S.session.user.id : null;
  S.sb.auth.onAuthStateChange((_event, session) => {
    S.session = session;
    const id = session ? session.user.id : null;
    if (id === S.userId) return;
    S.userId = id;
    setTimeout(afterAuthChange, 0);
  });

  try {
    await loadGoogleMaps();
  } catch (e) {
    return notice("The map couldn't load", "Please check your internet connection and reload. If this keeps happening, the Google Maps key may need fixing (see the setup guide).");
  }
  await initMap();
  await refreshMe();
  await loadFeed();
  openFromHash();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); }
}

async function afterAuthChange() {
  await refreshMe();
  await loadFeed();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); return; }
  if (S.me && !profileComplete()) renderProfileStepThen(() => { closeSheet(); toast("Profile saved."); });
}

function passFilter(p) {
  if (p.kind !== "listing" || S.filter === "all") return true;
  if (S.filter === "project") return isDev(p);
  if (S.filter === "commercial") return COMMERCIAL.includes(p.property_type);
  if (S.filter === "land") return p.property_type === "plot";
  return p.deal === S.filter;
}
const visiblePosts = () => S.posts.filter((p) => p.kind === S.tab && passFilter(p));

function inView(p) {
  const b = S.map && S.map.getBounds && S.map.getBounds();
  return !b || b.contains({ lat: p.lat, lng: p.lng });
}
function updateListCount() {
  const n = visiblePosts().filter(inView).length;
  $("#list-n").textContent = n ? `(${n})` : "";
}

function renderMarkers() {
  const canSeeRequests = !!(S.access && S.access.requests) || S.posts.some((p) => p.kind === "request");
  $(".tabs").hidden = !canSeeRequests;
  if (!canSeeRequests && S.tab === "request") S.tab = "listing";
  $("#filters").hidden = S.tab !== "listing";
  document.querySelectorAll(".fchip[data-f]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.f === S.filter)));
  const counts = { listing: 0, request: 0 };
  S.posts.forEach((p) => counts[p.kind]++);
  $("#n-listing").textContent = counts.listing ? String(counts.listing) : "";
  $("#n-request").textContent = counts.request ? String(counts.request) : "";
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
  renderBanner();
  if (!S.map) return;

  if (S.clusterer) S.clusterer.clearMarkers();
  S.plain.forEach((m) => (m.map = null));
  S.plain = [];
  S.pinEls.clear();

  const shown = visiblePosts();
  const markers = shown.map((p) => {
    const el = document.createElement("button");
    el.className = "pin" + (p.kind === "request" ? " req" : "") + (isDev(p) ? " dev" : "") + (p.deal === "share" && p.kind === "listing" ? " share" : "") + (p.id === S.activeId ? " active" : "");
    el.textContent = pinLabel(p);
    el.setAttribute("aria-label", `${titleOf(p)}, ${placeOf(p)}`);
    el.addEventListener("click", (e) => { e.stopPropagation(); openDetails(p.id, { pan: true }); });
    S.pinEls.set(p.id, el);
    return new S.Marker({ position: { lat: p.lat, lng: p.lng }, content: el, title: titleOf(p) });
  });

  if (window.markerClusterer) {
    if (!S.clusterer) {
      S.clusterer = new markerClusterer.MarkerClusterer({
        map: S.map,
        markers: [],
        renderer: {
          render: ({ count, position }) => {
            const d = document.createElement("div");
            const size = count < 10 ? 40 : count < 50 ? 48 : 56;
            d.className = "cluster" + (S.tab === "request" ? " req" : "");
            d.style.width = d.style.height = size + "px";
            d.textContent = count;
            return new S.Marker({ position, content: d, zIndex: 1000 + count });
          }
        }
      });
    }
    S.clusterer.addMarkers(markers);
  } else {
    markers.forEach((m) => (m.map = S.map));
    S.plain = markers;
  }

  if (!S.fitted && shown.length) {
    S.fitted = true;
    const b = new google.maps.LatLngBounds();
    shown.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
    S.map.fitBounds(b, 80);
    google.maps.event.addListenerOnce(S.map, "idle", () => { if (S.map.getZoom() > 13) S.map.setZoom(13); });
  }
  updateListCount();
}

        <div class="fact"><b>Move in</b><span>${esc(p.move_in || "—")}</span></div>
      </div>` : `<div class="facts">

        <div class="fact"><b>Bedrooms</b><span>${p.bedrooms ? esc(p.bedrooms + " BHK") : "—"}</span></div>

      </div>

      </div>` : ""}
      ${!p.mine && p.kind === "request" && S.access && S.access.requests ? `<div class="act-row"><button class="btn" id="pitch-btn" style="grid-column:1/-1">Send them one of my listings</button></div>` : ""}
      ${p.precision === "area" ? `<p class="hint">The pin shows the sector or area, not the exact building.${p.mine ? " Add a Google Maps link in Edit for an exact pin." : ""}</p>` : ""}
      ${p.source === "dld" && !p.mine ? `<div class="claim"><p class="hint">Listed from Dubai Land Department project records.</p>
        <a class="btn claim-btn" id="claim-post" href="${esc(waHref(p.contact_phone, `Hi, I represent ${p.company || "the developer"} and would like to claim the project "${p.building}" on Property Stalkers: ${location.origin}/#p=${p.id}`))}" target="_blank" rel="noopener">Developer? Claim this project</a></div>` : ""}
      ${p.mine ? `<button class="btn edit-btn" id="edit-post"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit my post</button>` : ""}

  const slides = $("#slides"), counter = $("#counter");
  const showCount = () => { if (counter) counter.textContent = `${Math.min(photos.length, Math.round(slides.scrollLeft / slides.clientWidth) + 1)} / ${photos.length}`; };
  if (slides && counter) {
    slides.addEventListener("scroll", showCount, { passive: true });
    slides.addEventListener("scrollend", showCount);
    const go = (d) => {
      const i = Math.round(slides.scrollLeft / slides.clientWidth);
      const n = (i + d + photos.length) % photos.length;
      slides.scrollTo({ left: n * slides.clientWidth, behavior: "smooth" });
      counter.textContent = `${n + 1} / ${photos.length}`;
    };
    $("#g-prev").addEventListener("click", () => go(-1));
    $("#g-next").addEventListener("click", () => go(1));

  $("#share-post").addEventListener("click", async () => {
    const link = location.origin + "/#p=" + encodeURIComponent(p.id);
    const text = `${titleOf(p)} in ${placeOf(p)}${p.price ? " · " + priceOf(p) : ""} on Property Stalkers`;
    try {
      if (navigator.share) { await navigator.share({ title: titleOf(p), text, url: link }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(link); toast("Link copied."); }
    catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + link), "_blank", "noopener"); }
  });
  document.querySelectorAll("[data-reach]").forEach((b) => b.addEventListener("click", () => reachOut(p, b.dataset.reach, b)));
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("#watch-btn", (e) => toggleWatch(p, e.currentTarget));
  on("#ask-about", () => openAssistant({ post_id: p.id }));
  on("#viewing-btn", () => openViewingForm(p, "viewing"));
  on("#cobroke-btn", () => openViewingForm(p, "cobroke"));
  on("#check-btn", () => { openAssistant({ post_id: p.id }); setTimeout(() => { const m = $("#msg"); if (m) { m.value = "Is the price fair? What should I offer?"; askSend(); } }, 50); });
  on("#pitch-btn", () => openPitchPicker(p));
  on("#still-here", async (e) => { e.currentTarget.disabled = true; try { await api(`/posts/${p.id}/confirm`, { method: "POST" }); toast("Thanks! It stays on the map."); await loadFeed(); openDetails(p.id); } catch (err) { toast(err.message); } });
  const rm = $("#remove-post");
  if (rm) rm.addEventListener("click", () => removePost(p.id));
  const ed = $("#edit-post");
  if (ed) ed.addEventListener("click", () => openEditForm(p.id));

  panel.scrollTop = 0;
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  setActive(p.id);
  try { history.replaceState(null, "", "#p=" + encodeURIComponent(p.id)); } catch (e) {}
  if (opts.pan || opts.zoom) focusOn(p, opts.zoom);
  return true;
}

/* Unit listings: the contact is handed out when someone taps, so leads can take turns between listers. */
function contactOf(p) {
  const c = S.contacts[p.id];
  return c || { name: p.contact_name, phone: p.contact_phone, avatar: p.contact_avatar };
}
function contactHead(p) {
  const c = contactOf(p);
  return `<div class="contact-head">
          <div class="avatar">${c.avatar ? `<img src="${esc(shown(c.avatar))}" alt="">` : esc(initials(c.name))}</div>
          <div><div class="contact-name">${esc(c.name)}</div><div class="contact-sub">${esc(posterLine(p))}${S.contacts[p.id] && c.phone ? " · +" + esc(c.phone) : ""}</div></div>
        </div>`;
}
async function reachOut(p, how, btn) {
  // Open the WhatsApp window straight away (inside the tap), so phones don't block it as a pop-up.
  const win = how === "wa" ? window.open("", "_blank") : null;
  btn.disabled = true;
  try {
    const r = await api(`/posts/${p.id}/contact`, { method: "POST" });
    S.contacts[p.id] = r.contact;
    const msg = `Hi ${r.contact.name || ""}, I'm interested in your ${titleOf(p).toLowerCase()} in ${placeOf(p)}, which I saw on Property Stalkers.`;
    const href = how === "wa" ? waHref(r.contact.phone, msg) : telHref(r.contact.phone);
    if (win) win.location.href = href; else location.href = href;
    openDetails(p.id); // now shows who you're connected with
  } catch (e) {
    if (win) win.close();
    btn.disabled = false;
    toast(e.message || "Couldn't get the contact. Please try again.");
  }
}

function closeDetails() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  setActive(null);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
$("#panel-close").addEventListener("click", closeDetails);

window.addEventListener("hashchange", () => { if (S.map && /(^#p=|[#&]p=|repair=|^#inbox$)/.test(location.hash)) openFromHash(); });
function openFromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("repair")) return openRepairForm(h.get("repair"));
  if (location.hash === "#inbox") return openInbox();
  const id = h.get("p");
  if (id && !openDetails(id, { zoom: 15 })) toast("That post is no longer available, or only visible to some members.");
}

async function removePost(id) {
  if (!confirm("Remove this post from the map?")) return;
  try {
    await api("/posts/" + id, { method: "DELETE" });
    closeDetails();
    toast("Post removed.");
    await loadFeed();
    if ($("#sheet").classList.contains("open") && $("#sheet").dataset.view === "account") renderAccount();
  } catch (e) { toast(e.message); }
}

      </div>
      ${!isReq && !dev ? `<div class="grid2">

        <label class="field"><span>Size (sq ft)</span><input id="e-size" inputmode="numeric" value="${esc(p.size_sqft ? Number(p.size_sqft).toLocaleString("en-US") : "")}" placeholder="e.g. 1450"></label>

      <div class="field"><span>${isReq ? "Budget" : dev ? "Starting price" : p.deal === "rent" ? "Rent per month" : "Price"}</span>

        <label class="field"><span>Project RERA</span><input id="e-rera" value="${esc(p.rera_number)}"></label></div>` : ""}

      </button>`).join("") || `<p class="hint" style="padding:0 18px">Nothing here yet. Try another area or filter.</p>`}`;
  document.querySelectorAll(".litem").forEach((b) => b.addEventListener("click", () => openDetails(b.dataset.id, { pan: true })));
  panel.scrollTop = 0;
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  setActive(null);
}

/* ---------------- search ---------------- */
const qEl = $("#q"), resultsEl = $("#results");
let searchTimer, searchSel = -1;

function searchText(p) {
  return [p.building, p.locality, p.city, p.country, p.address, p.company].filter(Boolean).join(" ").toLowerCase();
}
function matchPosts(q) {
  const words = q.toLowerCase().split(/[\s,]+/).filter(Boolean);
  if (!words.length) return [];
  return S.posts.filter((p) => p.kind === S.tab && words.every((w) => searchText(p).includes(w)));
}

function renderResults() {
  const q = qEl.value.trim();
  $("#q-clear").hidden = !q;
  if (q.length < 2) { resultsEl.hidden = true; return; }
  const hits = matchPosts(q);
  searchSel = -1;
  resultsEl.innerHTML = hits.slice(0, 6).map((p) => `
      <button class="result" role="option" data-id="${esc(p.id)}">
        <img src="${esc(thumbOf(p))}" alt="">
        <span class="r-main"><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))}</small></span>
        <span class="r-price">${esc(p.price ? amount(p) : "")}</span>
      </button>`).join("")
    + (hits.length > 6 ? `<button class="result go" data-all="1">Show all ${hits.length} matches on the map</button>` : "")
    + `<button class="result go" data-go="1">Show “${esc(q)}” on the map</button>`
    + (hits.length ? "" : `<div class="result empty">No listed properties match yet. You can still move the map there.</div>`);
  resultsEl.hidden = false;
  const act = (b, fn) => {
    b.addEventListener("pointerdown", (e) => e.preventDefault());
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", fn);
  };
  resultsEl.querySelectorAll("[data-id]").forEach((b) => act(b, () => pickPost(b.dataset.id)));
  resultsEl.querySelectorAll("[data-all]").forEach((b) => act(b, () => showMatches(hits)));
  resultsEl.querySelectorAll("[data-go]").forEach((b) => act(b, () => goToPlace(q)));
}

function closeResults() { resultsEl.hidden = true; }

function pickPost(id) {
  closeResults();
  qEl.blur();
  openDetails(id, { zoom: 15 });
}

function showMatches(hits) {
  closeResults();
  qEl.blur();
  S.filter = "all";
  renderMarkers();
  const b = new google.maps.LatLngBounds();
  hits.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
  S.map.fitBounds(b, 80);
  google.maps.event.addListenerOnce(S.map, "idle", () => { if (S.map.getZoom() > 15) S.map.setZoom(15); openList(); });
}

async function goToPlace(q) {
  closeResults();
  qEl.blur();
  try {
    const { place } = await api("/geocode?q=" + encodeURIComponent(q));
    if (!place) return toast(`Couldn't find “${q}”. Try adding the city.`);
    closeDetails();
    if (place.viewport) S.map.fitBounds({ north: place.viewport.north, south: place.viewport.south, east: place.viewport.east, west: place.viewport.west }, 40);
    else { S.map.setCenter({ lat: place.lat, lng: place.lng }); S.map.setZoom(13); }
    google.maps.event.addListenerOnce(S.map, "idle", () => {
      const n = visiblePosts().filter(inView).length;
      if (n) openList();
      else toast(`No properties listed around ${place.address || q} yet.`);
    });
  } catch (e) {
    toast(e.message);
  }
}

qEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderResults, 120); });
qEl.addEventListener("focus", renderResults);
qEl.addEventListener("blur", () => setTimeout(closeResults, 300));
qEl.addEventListener("keydown", (e) => {
  const opts = [...resultsEl.querySelectorAll("button.result")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!opts.length) return;
    searchSel = (searchSel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("sel", i === searchSel));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const q = qEl.value.trim();
    if (!q) return;
    if (searchSel >= 0 && opts[searchSel]) { opts[searchSel].click(); return; }
    const hits = matchPosts(q);
    if (hits.length === 1) pickPost(hits[0].id);
    else if (hits.length > 1) showMatches(hits);
    else goToPlace(q);
  } else if (e.key === "Escape") {
    closeResults();
    qEl.blur();
  }
});
$("#q-clear").addEventListener("click", () => { qEl.value = ""; $("#q-clear").hidden = true; closeResults(); qEl.focus(); });

const CONFIGS = [["0", "Studio"], ["1", "1 BHK"], ["2", "2 BHK"], ["3", "3 BHK"], ["4", "4 BHK"], ["5", "5+ BHK"]];

function configsText(sel) {
  const nums = sel.map(Number).sort((a, b) => a - b);
  const parts = nums.map((n) => (n === 0 ? "Studio" : n === 5 ? "5+" : String(n)));
  const hasBhk = nums.some((n) => n > 0);
  if (!parts.length) return "";
  const list = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " & " + parts[parts.length - 1];
  return hasBhk ? list + " BHK" : list;
}
function monthText(v) {
  if (!/^\d{4}-\d{2}$/.test(v || "")) return "";
  const [y, m] = v.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

function renderSignIn(reason, mode) {
  openSheet("signin", "Sign in");
  mode = mode || "email";
  $("#sheet-body").innerHTML = `
    <p class="muted">${esc(reason || "Sign in to list a property, a project or what you're looking for.")} You'll stay signed in on this device.</p>
    <div id="oauth" class="oauth"></div>
    <div class="tabs2" id="auth-tabs">
      <button type="button" class="segb" data-m="email" aria-pressed="${mode === "email"}">Email</button>
      <button type="button" class="segb" data-m="phone" aria-pressed="${mode === "phone"}">Mobile number</button>
    </div>
    <form id="signin-form" novalidate>
      ${mode === "phone"
        ? `<label class="field"><span>Mobile number with country code</span><input type="tel" id="ident" inputmode="tel" autocomplete="tel" placeholder="+971 50 123 4567"></label>`
        : `<label class="field"><span>Email</span><input type="email" id="ident" autocomplete="email" placeholder="you@example.com"></label>`}
      <button class="btn accent" style="width:100%" id="signin-btn">Send me a code</button>
      <p class="error" id="signin-err" hidden></p>
    </form>`;
  authProviders().then((pv) => {
    const box = $("#oauth");
    if (box && pv.google) {
      box.innerHTML = `<button class="btn oauth-btn" id="google-btn" type="button">${GOOGLE_G}<span>Continue with Google</span></button><div class="or"><span>or</span></div>`;
      $("#google-btn").addEventListener("click", async () => {
        const { error } = await S.sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
        if (error) { const err = $("#signin-err"); err.hidden = false; err.textContent = "Google sign-in isn't available right now. Please use your email."; }
      });
    }
    S.phoneSignIn = !!pv.phone;
    if (mode === "phone" && !pv.phone) showPhoneSoon();
  });
  document.querySelectorAll("#auth-tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.m !== mode) renderSignIn(reason, b.dataset.m);
  }));
  function showPhoneSoon() {
    const err = $("#signin-err");
    err.hidden = false;
    err.textContent = "Sign-in with a mobile number is being set up and isn't available yet. Please use your email for now. You can add your mobile number in My profile.";
    $("#signin-btn").textContent = "Use email instead";
  }
  $("#signin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (mode === "phone" && S.providers && !S.providers.phone) { renderSignIn(reason, "email"); return; }
    const raw = $("#ident").value.trim();
    const err = $("#signin-err");
    let ident;
    if (mode === "phone") {
      const digits = raw.replace(/[^0-9]/g, "");
      if (digits.length < 8) { err.hidden = false; err.textContent = "Please enter your mobile number with country code, e.g. +971 50 123 4567."; return; }
      ident = { phone: "+" + digits };
    } else {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw)) { err.hidden = false; err.textContent = "Please enter a valid email address."; return; }
      ident = { email: raw };
    }
    const btn = $("#signin-btn");
    btn.disabled = true; btn.textContent = "Sending…";
    let error;
    try {
      if (!S.sb) throw new Error("not ready");
      ({ error } = await withTimeout(S.sb.auth.signInWithOtp({ ...ident, options: mode === "email" ? { emailRedirectTo: location.origin + location.pathname } : {} }), 20000));
    } catch (ex) { error = { message: ex.message === "timeout" ? "timeout" : "network" }; }
    if (error) {
      btn.disabled = false; btn.textContent = "Send me a code";
      err.hidden = false;
      err.textContent = /rate|seconds/i.test(error.message) ? "Please wait a minute before asking for another code."
        : /timeout|network/.test(error.message) ? "Couldn't reach the sign-in service. Please check your connection and try again."
        : mode === "phone" ? "Couldn't send a text to that number. Please check it, or sign in with email." : "Couldn't send the email. Please check the address and try again.";
      return;
    }
    renderCodeEntry(ident, mode, reason);
  });
}

function renderCodeEntry(ident, mode, reason) {
  const where = ident.email || ident.phone;
  $("#sheet-body").innerHTML = `
    <h3 style="margin:4px 0 8px">Enter your code</h3>
    <p class="muted">We sent a code to <b>${esc(where)}</b>.${mode === "email" ? " The email also has a sign-in link you can tap instead. Can't see it? Check your spam folder." : ""}</p>
    <form id="code-form" novalidate>
      <label class="field"><span>Code</span><input id="otp" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
      <button class="btn primary" style="width:100%" id="code-btn">Sign in</button>
      <p class="error" id="code-err" hidden></p>
    </form>
    <button class="link-btn" style="color:var(--brand)" id="code-back">Use a different ${mode === "phone" ? "number" : "email"} or send again</button>`;
  const otp = $("#otp");
  otp.focus();
  otp.addEventListener("input", () => {
    otp.value = otp.value.replace(/\D/g, "");
    $("#code-err").hidden = true;
    if (otp.value.length >= 6 && otp.value.length === Number(otp.dataset.len || 6)) $("#code-form").requestSubmit();
  });
  $("#code-back").addEventListener("click", () => renderSignIn(reason, mode));
  $("#code-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = otp.value.trim();
    const err = $("#code-err");
    if (token.length < 6) { err.hidden = false; err.textContent = "Please enter the code from the " + (mode === "phone" ? "text message." : "email."); return; }
    const btn = $("#code-btn"); btn.disabled = true; btn.textContent = "Checking…";
    let error;
    try { ({ error } = await withTimeout(S.sb.auth.verifyOtp({ ...ident, token, type: mode === "phone" ? "sms" : "email" }), 20000)); }
    catch (ex) { error = { message: "network" }; }
    if (error) {

}

const START = "I want to ";
const GHOST = "sell / rent out / share my apartment, villa, office, shop, plot, land or a room, unit no. …, in [building, area, city] for [price], size … sq ft";
/* Faded suggestion that follows "I want to " until the person starts typing their own words. */
function ghostUpdate() {
  const t = $("#msg"), g = $("#ghost");
  if (!t || !g) return;
  const on = /^\s*i want to\s*$/i.test(t.value);
  g.hidden = !on;
  if (!on) return;
  const cs = getComputedStyle(t);
  for (const k of ["fontFamily", "fontSize", "lineHeight", "letterSpacing", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderLeftWidth", "borderRightWidth", "borderBottomWidth"]) g.style[k] = cs[k];
  g.innerHTML = `<span class="gt">${esc(t.value.endsWith(" ") ? t.value : t.value + " ")}</span><span class="gh">${esc(GHOST)}</span>`;
}
function autoGrow() {
  const t = $("#msg"), g = $("#ghost");
  t.style.height = "auto";
  const need = Math.max(t.scrollHeight, g && !g.hidden ? g.scrollHeight : 0);
  t.style.height = Math.min(need, 140) + "px";
}
function scrollLog() { const b = $("#sheet-body"); b.scrollTop = b.scrollHeight; }

function useExample(text) {
  const t = $("#msg");
  t.value = text;
  autoGrow();
  t.focus();
  const i = text.indexOf("["), j = text.indexOf("]", i);
  if (i >= 0 && j > i) t.setSelectionRange(i, j + 1);
}

function bubble(kind, text) {
  const log = $("#log");
  if (!log) return null;
  const d = document.createElement("div");
  d.className = "bubble " + kind;
  d.textContent = text;
  log.appendChild(d);
  scrollLog();
  return d;
}

async function send() {
  const t = $("#msg");
  const text = t.value.trim();
  if ((!text && !S.pendingPics.length) || S.busy) return;
  if (/^i want to$/i.test(text) && !S.pendingPics.length) { toast("Please finish the sentence: what, where, unit number, size and price."); t.focus(); return; }
  if (/\[[^\]]*\]/.test(text)) {
    toast("Please replace the [brackets] with your details first.");
    const i = text.indexOf("["); t.focus(); t.setSelectionRange(i, text.indexOf("]", i) + 1);
    return;
  }
  t.value = ""; autoGrow();
  const images = S.pendingPics.splice(0);
  S.chatPics.push(...images);
  S.chat.push(images.length ? { role: "user", content: text || "Here are photos of the property.", images } : { role: "user", content: text });
  if (text) bubble("me", text);
  await askAI();
}

async function askAI() {
  S.busy = true;
  $("#send").disabled = true;
  const typing = bubble("ai", "");
  typing.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  try {
    const r = await api("/chat", { method: "POST", body: JSON.stringify({ messages: S.chat.map(({ role, content, images }) => (images ? { role, content, images } : { role, content })) }) });
    typing.remove();
    if (r.type === "draft") {
      if (r.text) bubble("ai", r.text);
      S.chat.push({ role: "assistant", content: (r.text ? r.text + "\n" : "") + "[Draft shown to the user for confirmation: " + draftSummary(r.draft) + "]", display: r.text || "Here's your post. Please check it." , hidden: !r.text });
      S.draft = r.draft;
      S.draftPhotos = [];
      renderDraft(r.draft);
    } else {
      S.chat.push({ role: "assistant", content: r.text });
      bubble("ai", r.text);
    }
  } catch (e) {
    typing.remove();
    if (e.code === "profile_required") return renderProfileStep();
    if (e.code === "role_required") return renderRolePicker(false);
    if (e.status === 401) { store.set("ps_resume", "1"); return renderSignIn("Your session expired. Please sign in again."); }
    bubble("err", e.message);
  } finally {
    S.busy = false;
    const b = $("#send"); if (b) b.disabled = false;
  }
}

async function shrink(file, square) {
  try {
    const bmp = await createImageBitmap(file);
    const c = document.createElement("canvas");
    if (square) {
      // Centre-crop to a square for profile pictures.
      const side = Math.min(bmp.width, bmp.height), out = Math.min(square, side);
      c.width = c.height = out;
      c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);
      return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.85));
    }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.82));
  } catch (e) {
    return file;
  }
}

async function uploadPhoto(file, opts = {}) {
  if (file.type && !/^image\//.test(file.type)) throw new Error("Please choose a photo.");
  const blob = await shrink(file, opts.square);
  if (blob.size > 5 * 1024 * 1024) throw new Error("One photo is too large. Please use photos under 5 MB.");
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random()).replace(".", "");
  const path = `${S.session.user.id}/${id}.jpg`;
  const { error } = await S.sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw new Error("A photo couldn't be uploaded. Please try again.");
  return S.sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}

/* =====================================================================
   Ask Stalker (assistant), notifications, alerts, enquiries, viewings,
   pitches, co-broking, tenancies and repair links.
   ===================================================================== */
const when = (iso) => iso ? new Date(iso).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const needSignIn = (why) => { store.set("ps_resume_ask", "1"); renderSignIn(why); };
const ready = (why) => {
  if (!S.session) { renderSignIn(why); return false; }
  if (!profileComplete()) { renderProfileStepThen(() => { closeSheet(); toast("Profile saved."); }); return false; }
  return true;
};

/* ---------------- Ask Stalker ---------------- */
const ASK_STARTERS = {
  any: ["Find me a 2 bedroom to rent in Dubai Marina under AED 120k", "Stalk a building: show me everything in Skyview, Gurugram", "Can I afford a AED 1.5M apartment on AED 30k a month?", "Rent or buy: AED 1.2M flat vs AED 7k a month rent", "Show me deals and price cuts in Business Bay", "Off-plan projects handing over in 2027", "Alert me when a 3 bed villa under AED 4M is listed in Dubai Hills"],
  landlord: ["Score my listing out of 10", "Rewrite my listing description", "Translate my listing into Arabic", "Roast my listing", "Who's looking for a place like mine?", "What's the rental yield on my property?"],
  broker: ["Find listings open to co-broking in Dubai Marina", "Buyer requests that match my listings", "Score my listings", "Rewrite my listing in plain words"],
  developer: ["Rewrite my project description", "Translate my project into Hindi", "What are similar projects priced at?"],
  buyer: ["Is this area's price fair?", "What can I afford?", "Post my request so brokers can find me", "Alert me when something matches"],
  tenant: ["Find a room to share under AED 4,000 in Dubai Marina", "Find me a rental under my budget", "Rent vs buy for me", "Post my rental request", "Alert me when something matches"]
};

function openAssistant(context = null) {
  if (!S.session) return needSignIn("Sign in to chat with Stalker.");
  if (!profileComplete()) return renderProfileStep();
  const ctxId = context && context.post_id;
  if (!S.ask || S.ask.ctx !== ctxId) S.ask = { ctx: ctxId || null, messages: [] };
  const here = ctxId && S.posts.find((p) => p.id === ctxId);
  openSheet("ask", here ? "Ask Stalker about this property" : "Stalker");
  $("#sheet-body").innerHTML = `<div class="log" id="log"></div>`;
  $("#sheet-foot").innerHTML = `
    <form class="composer" id="composer">
      <div class="msg-wrap"><textarea id="msg" rows="1" placeholder="${here ? "Ask anything about this property…" : "Ask about properties, prices, areas…"}" aria-label="Message"></textarea></div>
      <button class="btn accent" id="send" aria-label="Send">Send</button>
    </form>`;
  if (!S.ask.messages.length) {
    const intro = document.createElement("div");
    intro.className = "bubble ai";
    intro.innerHTML = here
      ? `Ask me anything about this <b>${esc(titleOf(here).toLowerCase())}</b>: the price, the area, what's included. If I don't know, I'll pass your question to the lister. I can also set up a viewing.`
      : `Hi${S.me && S.me.profile && S.me.profile.name ? " " + esc(S.me.profile.name.split(" ")[0]) : ""}, I'm Stalker. I can find properties, check if a price is fair, do the maths on buying or renting, stalk a building, write or score your listing, and alert you when something new matches.`;
    $("#log").appendChild(intro);
    const ex = document.createElement("div");
    ex.className = "examples";
    const starters = here ? ["Is the price fair?", "Any red flags?", "What would the monthly mortgage be?", "I'd like to see it"] : [...(ASK_STARTERS[roleOf()] || []), ...ASK_STARTERS.any].slice(0, 7);
    ex.innerHTML = starters.map((t) => `<button type="button" class="example"><span>${esc(t)}</span></button>`).join("");
    $("#log").appendChild(ex);
    ex.querySelectorAll(".example").forEach((b) => b.addEventListener("click", () => { $("#msg").value = b.textContent; askSend(); }));
  } else {
    for (const m of S.ask.messages) {
      if (m.role === "user") bubble("me", m.content);
      else { if (m.content) aiBubble(m.content); (m.cards || []).forEach(renderAskCard); }
    }
  }
  const msg = $("#msg");
  msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
  msg.addEventListener("input", autoGrow);
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); askSend(); });
  if (isDesktop()) msg.focus();
  scrollLog();
}

async function askSend() {
  const t = $("#msg");
  const text = t.value.trim();
  if (!text || S.busy) return;
  t.value = ""; autoGrow();
  document.querySelectorAll("#log .examples").forEach((x) => x.remove());
  S.ask.messages.push({ role: "user", content: text });
  bubble("me", text);
  S.busy = true; $("#send").disabled = true;
  const typing = bubble("ai", "");
  typing.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  try {
    const history = S.ask.messages.map((m) => ({ role: m.role, content: m.role === "assistant" ? (m.content || "") + (m.note ? "\n" + m.note : "") : m.content }));
    const r = await api("/assistant", { method: "POST", body: JSON.stringify({ messages: history, context: S.ask.ctx ? { post_id: S.ask.ctx } : undefined }) });
    typing.remove();
    const note = (r.cards || []).map((c) => c.type === "listings" ? `[Showed listings: ${c.ids.join(", ")}]` : c.type === "draft" ? `[Showed a request draft to confirm]` : c.type === "enquiry" ? `[Showed an enquiry card for ${c.post_id}]` : `[Showed a ${c.type} card]`).join(" ");
    S.ask.messages.push({ role: "assistant", content: r.text, cards: r.cards || [], note });
    aiBubble(r.text);
    (r.cards || []).forEach(renderAskCard);
  } catch (e) {
    typing.remove();
    S.ask.messages.pop();
    bubble("err", e.code === "profile_required" ? "Please complete your profile first." : e.message);
  } finally {
    S.busy = false; const s = $("#send"); if (s) s.disabled = false;
  }
}

/** The assistant writes light markdown: **bold** and "- " bullets. */
function aiBubble(text) {
  const d = bubble("ai", "");
  if (d) d.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*•] /gm, "• ").replace(/^#{1,4} /gm, "");
  return d;
}

function badgeHtml(p) {
  const out = [];
  if (p.below_market_pct >= 10) out.push(`<span class="badge good">${p.below_market_pct}% below area price</span>`);
  if (p.price_cut_pct >= 3) out.push(`<span class="badge cut">Price cut ${p.price_cut_pct}%</span>`);
  if (p.cobroke) out.push(`<span class="badge">Open to co-broking</span>`);
  return out.join("");
}

function renderAskCard(c) {
  const log = $("#log");
  if (!log) return;
  const box = document.createElement("div");
  box.className = "ask-card";
  if (c.type === "listings") {
    const items = c.ids.map((id) => S.posts.find((p) => p.id === id)).filter(Boolean);
    if (!items.length) return;
    box.innerHTML = `${c.title ? `<div class="ac-title">${esc(c.title)}</div>` : ""}${items.map((p) => `
      <button class="litem" data-id="${esc(p.id)}">
        <img src="${esc(thumbOf(p))}" alt="" loading="lazy">
        <div><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))}</small>
          <span class="lp">${esc(priceOf(p))}${sizeOf(p) ? ` <small class="lsz">· ${esc(sizeOf(p))}</small>` : ""}</span>${badgeHtml(p)}</div>
      </button>`).join("")}`;
    box.querySelectorAll(".litem").forEach((b) => b.addEventListener("click", () => { closeSheet(); openDetails(b.dataset.id, { zoom: 15 }); }));
  } else if (c.type === "description") {
    box.innerHTML = `<div class="ac-title">${esc(c.label)} · ${esc(c.title)}</div><p class="ac-text">${esc(c.text)}</p>
      <div class="actions"><button class="btn" data-a="copy">Copy</button><button class="btn accent" data-a="use">Use this description</button></div>`;
    box.querySelector('[data-a="copy"]').addEventListener("click", async () => { try { await navigator.clipboard.writeText(c.text); toast("Copied."); } catch (e) { toast("Couldn't copy."); } });
    box.querySelector('[data-a="use"]').addEventListener("click", async (e) => {
      e.currentTarget.disabled = true;
      try { await api("/posts/" + c.post_id, { method: "PATCH", body: JSON.stringify({ description: c.text }) }); toast("Description updated."); await loadFeed(); e.currentTarget.textContent = "Applied ✓"; }
      catch (err) { e.currentTarget.disabled = false; toast(err.message); }
    });
  } else if (c.type === "alert") {
    box.innerHTML = `<div class="ac-row">🔔 <span>Alert saved: <b>${esc(c.label)}</b>. I'll tell you in the bell and by email when something new matches.</span></div>`;
  } else if (c.type === "watch") {
    box.innerHTML = `<div class="ac-row">☆ <span>Watching the price of <b>${esc(c.title)}</b>. You'll hear if it drops.</span></div>`;
    loadFeed();
  } else if (c.type === "draft") {
    const d = c.draft;
    box.innerHTML = `<div class="ac-title">Your request</div><b>${esc(titleOf(d))}</b><div class="muted">${esc(placeOf(d))} · ${esc(priceOf(d))}</div>
      ${d.description ? `<p class="ac-text">${esc(d.description)}</p>` : ""}
      <p class="muted" style="font-size:13px">Brokers with a licence will see it, and owners whose listing fits can send it to you. Your number is shared only with people who reach out.</p>
      <div class="actions"><button class="btn accent" data-a="post">Post my request</button></div>`;
    box.querySelector('[data-a="post"]').addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Posting…";
      try { const r = await api("/posts", { method: "POST", body: JSON.stringify({ draftId: d.id }) }); b.textContent = "Posted ✓"; toast("Your request is on the map."); await loadFeed(); }
      catch (err) { b.disabled = false; b.textContent = "Post my request"; toast(err.message); }
    });
  } else if (c.type === "enquiry") {
    const viewing = c.kind === "viewing";
    box.innerHTML = `<div class="ac-title">${viewing ? "Viewing request" : "Question for the lister"} · ${esc(c.title)}</div>
      ${viewing ? `<label class="field"><span>When?</span><input type="datetime-local" class="e-slot" value="${esc(toLocalInput(c.slot))}"></label>` : ""}
      <label class="field"><span>Message</span><textarea class="e-msg" maxlength="800">${esc(c.message || "")}</textarea></label>
      ${c.summary ? `<p class="muted" style="font-size:13px">Shared with them: ${esc(c.summary)}</p>` : ""}
      <p class="muted" style="font-size:13px">They'll get your name and mobile number so they can reply.</p>
      <div class="actions"><button class="btn accent" data-a="send">Send</button></div>`;
    box.querySelector('[data-a="send"]').addEventListener("click", async (e) => {
      const b = e.currentTarget;
      const slotEl = box.querySelector(".e-slot");
      const slot = slotEl && slotEl.value ? new Date(slotEl.value).toISOString() : null;
      if (viewing && !slot) return toast("Please pick a date and time.");
      b.disabled = true; b.textContent = "Sending…";
      try { await api(`/posts/${c.post_id}/enquire`, { method: "POST", body: JSON.stringify({ kind: c.kind, slot, message: box.querySelector(".e-msg").value, summary: c.summary }) }); b.textContent = "Sent ✓"; toast(viewing ? "Viewing request sent. You'll be told when they reply." : "Sent. They'll get back to you."); }
      catch (err) { b.disabled = false; b.textContent = "Send"; toast(err.message); }
    });
  } else if (c.type === "pitches") {
    box.innerHTML = `<div class="ac-title">People looking for a place like yours</div>${c.items.map((it, i) => `
      <div class="my-post"><div><b>${esc(it.request)}</b><small>Fits your ${esc(it.listing)}${it.budget ? ` · budget ${esc((it.currency || "") + " " + Number(it.budget).toLocaleString("en-US"))}` : ""}</small></div>
      <button class="btn" data-i="${i}">Send my listing</button></div>`).join("")}`;
    box.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => pitchListing(c.items[+b.dataset.i].request_id, c.items[+b.dataset.i].post_id, b)));
  } else return;
  log.appendChild(box);
  scrollLog();
}

function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 16);
}

async function pitchListing(requestId, postId, btn) {
  if (btn) btn.disabled = true;
  try { await api(`/requests/${requestId}/pitch`, { method: "POST", body: JSON.stringify({ post_id: postId }) }); if (btn) btn.textContent = "Sent ✓"; toast("Sent. They'll see your listing and your number."); }
  catch (e) { if (btn) btn.disabled = false; toast(e.message); }
}

/* ---------------- notifications (the bell) ---------------- */
async function refreshBell() {
  const bell = $("#bell");
  if (!S.session || !S.me) { bell.hidden = true; return; }
  bell.hidden = false;
  try {
    const r = await api("/notifications");
    S.inbox = r.items;
    const n = $("#bell-n");
    n.textContent = r.unread > 9 ? "9+" : String(r.unread);
    n.hidden = !r.unread;
  } catch (e) {}
}
setInterval(() => { if (document.visibilityState === "visible" && S.session) refreshBell(); }, 90000);
$("#bell").addEventListener("click", () => openInbox());

async function openInbox() {
  if (!S.session) return renderSignIn("Sign in to see your notifications.");
  openSheet("inbox", "Notifications");
  $("#sheet-body").innerHTML = `<p class="muted">Loading…</p>`;
  await refreshBell();
  const items = S.inbox || [];
  $("#sheet-body").innerHTML = items.length ? items.map(inboxItem).join("") : `<p class="muted">Nothing yet. Alerts, price drops, enquiries and viewing requests will show up here.</p>
    <button class="btn" id="ib-ask" style="width:100%;margin-top:12px">Set up an alert with Stalker</button>`;
  const ask = $("#ib-ask"); if (ask) ask.addEventListener("click", () => openAssistant());
  document.querySelectorAll("#sheet-body [data-act]").forEach((b) => b.addEventListener("click", () => inboxAction(b)));
  if (items.some((x) => !x.read)) { try { await api("/notifications/read", { method: "POST", body: "{}" }); $("#bell-n").hidden = true; } catch (e) {} }
}

function contactButtons(person, text) {
  if (!person || !person.phone) return "";
  return `<a class="btn primary" href="${esc(telHref(person.phone))}">Call ${esc(person.name.split(" ")[0])}</a><a class="btn wa" href="${esc(waHref(person.phone, text || "Hi, it's about Property Stalkers."))}" target="_blank" rel="noopener">WhatsApp</a>`;
}

function inboxItem(n) {
  const e = n.enquiry;
  const btns = [];
  if (e && e.incoming && e.kind === "viewing" && e.status === "new") btns.push(`<button class="btn accent" data-act="accept" data-id="${e.id}">Accept</button><button class="btn" data-act="decline" data-id="${e.id}">Decline</button>`);
  if (e && e.incoming) btns.push(contactButtons(e.from, `Hi ${e.from.name.split(" ")[0]}, it's about your enquiry on Property Stalkers.`));
  if (e && !e.incoming && e.to && e.to.phone) btns.push(contactButtons(e.to, "Hi, it's about the viewing on Property Stalkers."));
  if (n.kind === "pitch_invite" && n.ref_id && n.post_id) btns.push(`<button class="btn accent" data-act="pitch" data-req="${n.ref_id}" data-post="${n.post_id}">Send my listing</button>`);
  if ((n.kind === "stale" || n.kind === "expired") && n.post_id) btns.push(`<button class="btn accent" data-act="confirm" data-post="${n.post_id}">Still available</button><button class="btn" data-act="remove" data-post="${n.post_id}">Remove it</button>`);
  if (n.post_id && !["stale", "expired"].includes(n.kind)) btns.push(`<button class="btn" data-act="view" data-post="${n.post_id}">View</button>`);
  const extra = e ? [e.slot ? `🗓 ${when(e.slot)} (your time)` : "", e.status !== "new" && e.kind === "viewing" ? (e.status === "accepted" ? "✓ Accepted" : "Declined") : "", e.summary && e.incoming ? e.summary : "", e.from && e.from.licence && e.kind === "cobroke" ? `Licence ${e.from.licence}` : ""].filter(Boolean).join(" · ") : "";
  return `<div class="note-item${n.read ? "" : " unread"}">
    <div class="ni-title">${esc(n.title)}</div>
    ${n.body ? `<div class="ni-body">${esc(n.body)}</div>` : ""}
    ${extra ? `<div class="ni-meta">${esc(extra)}</div>` : ""}
    <div class="ni-meta">${esc(ago(n.created_at))}</div>
    ${btns.length ? `<div class="ni-actions">${btns.join("")}</div>` : ""}
  </div>`;
}

async function inboxAction(b) {
  const a = b.dataset.act;
  try {
    if (a === "view") { closeSheet(); if (!openDetails(b.dataset.post, { zoom: 15 })) toast("That listing isn't on the map any more."); return; }
    b.disabled = true;
    if (a === "accept" || a === "decline") { await api("/enquiries/" + b.dataset.id, { method: "POST", body: JSON.stringify({ status: a === "accept" ? "accepted" : "declined" }) }); toast(a === "accept" ? "Viewing confirmed. They've been told." : "Declined. They've been told."); }
    if (a === "pitch") { await pitchListing(b.dataset.req, b.dataset.post, b); return; }
    if (a === "confirm") { await api(`/posts/${b.dataset.post}/confirm`, { method: "POST" }); toast("Thanks! It stays on the map."); await loadFeed(); }
    if (a === "remove") { await api("/posts/" + b.dataset.post, { method: "DELETE" }); toast("Removed."); await loadFeed(); }
    openInbox();
  } catch (e) { b.disabled = false; toast(e.message); }
}
