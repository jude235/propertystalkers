<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Property Stalkers | Properties and requests on the map</title>
<meta name="description" content="Search properties and new projects for sale and rent on one map, anywhere in the world. Post your own listing in plain words.">
<meta name="theme-color" content="#0f3b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<style>
  /* Emerald heritage theme: Marcellus for headings and prices, Jost for everything else. */
  :root {
    --brand: #0f3b2e;        /* emerald */
    --brand-ink: #f3ebdd;    /* cream text on emerald */
    --brass: #b8894a;        /* decorative accent */
    --brass-ink: #8a6327;    /* brass dark enough for text */
    --req: #7a5a27;          /* request pins and headers */
    --ink: #1d2a24;
    --muted: #6d6656;
    --line: #e4dac6;
    --bg: #fbf7ef;           /* cards */
    --soft: #f3ebdd;         /* page, fields */
    --wa: #1f7a4d;
    --warn-bg: #f6e7c8;
    --warn-ink: #5e4210;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(15, 59, 46, .18);
    --serif: Marcellus, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--soft); color: var(--ink);
    font-family: Jost, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  #map-wrap { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; background: #e9e2d3; }

  /* ---------- header ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; }
  .header { pointer-events: auto; background: var(--brand); color: var(--brand-ink);
    padding: calc(12px + env(safe-area-inset-top)) 16px 14px; border-bottom: 2px solid var(--brass);
    box-shadow: 0 6px 20px rgba(15, 59, 46, .25); }
  .header-in { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand-mark { width: 30px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; }
  .brand-name { font-family: var(--sans, 'Jost', sans-serif); font-weight: 500; font-size: clamp(18px, 5.2vw, 22px); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
  .brand-name span { color: #d6ad6e; }
  .account { border: 1px solid rgba(243, 235, 221, .5); cursor: pointer; background: transparent; color: var(--brand-ink);
    height: 38px; min-width: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; flex: 0 0 auto; }
  .banner-inline { background: #fff3e6; border: 1px solid #f0c48a; color: #7a4a10; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  .account.profile-btn { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; position: relative; }
  .pav { width: 30px; height: 30px; border-radius: 50%; background: var(--brass); color: var(--brand); display: grid; place-items: center; font-size: 13px; font-weight: 500; overflow: hidden; }
  .pav img, .avatar img, .pf-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pf-pic-row { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
  .pf-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--brand); color: var(--brass); border: 2px solid var(--brass);
    font-family: var(--serif); font-size: 24px; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
  .pf-pic-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pdot { position: absolute; top: 2px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #e0583c; border: 2px solid var(--brand); }
  .plabel-s { display: none; }
  @media (max-width: 400px) { .plabel { display: none; } .plabel-s { display: inline; } .account.profile-btn { padding: 0 10px 0 4px; gap: 6px; } .brand-name { font-size: 18px; } }
  @media (max-width: 340px) { .plabel-s { display: none; } .account.profile-btn { padding: 0 4px; } }
  .account.avatar-btn { padding: 0; width: 38px; background: var(--brass); border-color: var(--brass); color: var(--brand); font-weight: 500; }

  /* Properties / Requests switch */
  .tabs { display: flex; width: 100%; max-width: 380px; padding: 4px; border-radius: 999px;
    background: rgba(243, 235, 221, .10); border: 1px solid rgba(243, 235, 221, .28); }
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; background: none;
    padding: 9px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .02em; color: rgba(243, 235, 221, .88);
    transition: background .2s, color .2s; }
  .tab:hover { color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--brand-ink); color: var(--brand); box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
  .tab .n { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; line-height: 20px; text-align: center;
    background: rgba(243, 235, 221, .18); color: inherit; }
  .tab .n:empty { display: none; }
  .tab[aria-selected="true"] .n { background: var(--brand); color: var(--brand-ink); }
  .tabs[hidden] { display: none; }

  /* Search */
  .search { position: relative; flex: 1; min-width: 0; }
  .search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid rgba(243, 235, 221, .35);
    background: rgba(243, 235, 221, .12); color: var(--brand-ink); padding: 0 40px 0 42px; font-size: 15px; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: rgba(243, 235, 221, .75); }
  .search input:focus { outline: none; background: var(--brand-ink); color: var(--ink); border-color: var(--brass); }
  .search input:focus::placeholder { color: var(--muted); }
  .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--brass); display: flex; }
  .s-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .s-clear[hidden] { display: none; }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg); color: var(--ink); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 25; border: 1px solid var(--line); }
  .results[hidden] { display: none; }
  .result { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px;
    cursor: pointer; border-bottom: 1px solid var(--line); color: var(--ink); }
  .result:last-child { border-bottom: 0; }
  .result:hover, .result.sel { background: var(--soft); }
  .result img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  .result .r-main { min-width: 0; flex: 1; }
  .result b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .r-price { font-family: var(--serif); color: var(--brand); white-space: nowrap; font-size: 15px; }
  .result.go { color: var(--brass-ink); font-weight: 500; font-size: 14px; }
  .result.empty { cursor: default; color: var(--muted); font-size: 13px; }

  /* Filters */
  .filters { pointer-events: auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters[hidden] { display: none; }
  .fchip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(15, 59, 46, .14); display: inline-flex; align-items: center; gap: 6px; }
  .fchip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .fchip.list { border-color: var(--brass); color: var(--brass-ink); }
  .fchip .n { font-size: 12px; opacity: .8; }

  /* List of properties in view */
  .list-head { padding: 22px 18px 8px; }
  .list-head h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--brand); margin: 0 0 4px; }
  .list-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .litem { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 18px; cursor: pointer; color: var(--ink); }
  .litem:hover { background: var(--soft); }
  .litem img { width: 84px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  .litem div { min-width: 0; }
  .litem b { display: block; font-weight: 500; font-size: 15px; }
  .litem small { display: block; color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .litem .lp { font-family: var(--serif); color: var(--brand); font-size: 16px; }
  .tag.dev { color: var(--brand); background: none; }
  .banner-row { padding: 12px 16px 0; }
  .banner { pointer-events: auto; max-width: 420px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brass);
    border-radius: 0 12px 12px 0; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--muted); box-shadow: 0 4px 14px rgba(15, 59, 46, .12); }
  .banner b { color: var(--ink); font-weight: 500; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--brass); cursor: pointer; background: var(--brand); color: var(--brand-ink); font-weight: 500; font-size: 15px;
    letter-spacing: .03em; padding: 14px 24px; border-radius: 999px; box-shadow: 0 10px 24px rgba(15, 59, 46, .35);
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fab svg { color: var(--brass); }
  .role-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(15, 59, 46, .18); cursor: pointer; white-space: nowrap; }
  .role-pill b { font-weight: 500; color: var(--brand); }
  .role-pill span { color: var(--brass-ink); font-weight: 500; margin-left: 6px; }
  .role-pill[hidden] { display: none; }
  .maptype { position: fixed; left: 12px; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 19; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25); display: flex; align-items: center; gap: 6px; }
  @media (max-width: 759px) { .account:not(.avatar-btn) { height: 34px; padding: 0 12px; font-size: 13px; } .brand { gap: 8px; } }
  @media (max-width: 759px) { .maptype { bottom: calc(150px + env(safe-area-inset-bottom)); } }

  /* Role picker */
  .roles { display: grid; gap: 10px; margin-top: 4px; }
  .oauth-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0 4px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .role-card { text-align: left; border: 1px solid var(--line); background: #fffdf8; border-radius: 14px; padding: 13px 14px; cursor: pointer; color: var(--ink); }
  .role-card b { display: block; font-family: var(--serif); font-weight: 400; font-size: 17px; color: var(--brand); }
  .role-card small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .role-card[aria-pressed="true"] { border: 2px solid var(--brass); padding: 12px 13px; background: #fff8ea; }
  .role-extra { margin-top: 12px; }
  .role-extra[hidden] { display: none; }

  /* Developer form */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #fffdf8; }
  .field textarea { resize: vertical; min-height: 84px; }
  .field select:focus, .field textarea:focus { outline: 2px solid var(--brass); outline-offset: -1px; }
  .field .opt { color: var(--muted); font-weight: 400; }
  .cfgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .cfg { border: 1px solid var(--line); background: #fffdf8; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .cfg[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .price-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .form-section { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--brass-ink); margin: 18px 0 10px; }

  /* ---------- pins ---------- */
  .pin { --pin: var(--brand); position: relative; border: 0; cursor: pointer; white-space: nowrap; background: var(--pin); color: var(--brand-ink);
    font-family: Jost, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .02em; line-height: 1; padding: 7px 11px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25); margin-bottom: 7px; transition: transform .15s ease; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--pin); }
  .pin.req { --pin: var(--req); }
  .pin.dev { --pin: var(--brass); color: var(--brand); }
  .pin:hover { transform: scale(1.06); }
  .pin.active { --pin: #1d2a24; color: var(--brand-ink); transform: scale(1.12); }
  .cluster { background: var(--brand); color: var(--brand-ink); border-radius: 50%; display: grid; place-items: center; font-weight: 500; font-size: 14px;
    box-shadow: 0 0 0 4px rgba(184, 137, 74, .55); cursor: pointer; }
  .cluster.req { background: var(--req); }

  /* ---------- details panel ---------- */
  .panel { position: fixed; z-index: 30; background: var(--bg); box-shadow: var(--shadow); overflow-y: auto; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  @media (min-width: 760px) {
    .panel { top: 12px; right: 12px; bottom: 12px; width: 400px; border-radius: var(--radius); transform: translateX(calc(100% + 24px)); }
    .grab { display: none; }
  }
  @media (max-width: 759px) {
    .panel { left: 0; right: 0; bottom: 0; max-height: 86vh; border-radius: 20px 20px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom); }
  }
  .panel.open { transform: none; }
  .panel:not(.open) { pointer-events: none; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(251, 247, 239, .94);
    box-shadow: 0 2px 8px rgba(0,0,0,.2); display: grid; place-items: center; flex: 0 0 auto; }
  .panel > .icon-btn { position: absolute; top: 12px; right: 12px; z-index: 2; }
  .gallery { position: relative; }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 3; background: var(--soft); }
  .slides::-webkit-scrollbar { display: none; }
  .slides img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; display: block; }
  .g-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(251, 247, 239, .92); color: var(--brand); font-size: 24px; line-height: 34px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .g-nav.prev { left: 10px; } .g-nav.next { right: 10px; }
  .title-row { display: flex; align-items: flex-start; gap: 10px; }
  .title-row .title { flex: 1; }
  .share-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fffdf8; color: var(--brand); font-size: 13px; font-weight: 500; cursor: pointer; }
  .counter { position: absolute; left: 12px; bottom: 12px; background: rgba(15, 59, 46, .8); color: var(--brand-ink); font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .req-head { background: var(--req); color: var(--brand-ink); padding: 56px 18px 20px; border-bottom: 2px solid var(--brass); }
  .req-head .big { font-family: var(--serif); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  .body { padding: 18px 18px 24px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-ink); margin-right: 10px; }
  .tag.req { color: var(--req); }
  .tag.mine { color: var(--brand); }
  h1.title { font-family: var(--serif); font-weight: 400; font-size: 25px; line-height: 1.2; margin: 8px 0 4px; color: var(--brand); }
  .loc { color: var(--muted); font-size: 14px; margin: 0; }
  .price { font-family: var(--serif); font-weight: 400; font-size: 23px; margin: 14px 0 0; color: var(--brand); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
  .fact { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
  .fact b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 3px; }
  .fact span { font-size: 14px; font-weight: 500; }
  .desc { font-size: 15px; line-height: 1.6; color: #3c4640; margin: 0 0 16px; white-space: pre-line; }
  .hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .contact { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: #fffdf8; }
  .contact-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--brass); border: 1px solid var(--brass);
    font-family: var(--serif); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden; }
  .contact-name { font-weight: 500; font-size: 15px; }
  .contact-sub { font-size: 13px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 500; font-size: 14px; letter-spacing: .02em;
    padding: 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; background: transparent; color: var(--ink); }
  .btn.primary, .btn.accent { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .link-btn { border: 0; background: none; color: #9b2c1f; font-weight: 500; font-size: 13px; cursor: pointer; padding: 14px 0 0; }

  /* ---------- post / account sheet ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(15, 59, 46, .45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 41; background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  @media (min-width: 760px) {
    .sheet { left: 50%; top: 50%; width: 480px; height: min(720px, 88vh); border-radius: 20px; transform: translate(-50%, -46%); opacity: 0; pointer-events: none; overflow: hidden; }
    .sheet.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 759px) {
    .sheet { left: 0; right: 0; bottom: 0; height: 92vh; height: 92dvh; border-radius: 20px 20px 0 0; transform: translateY(105%); overflow: hidden; }
    .sheet.open { transform: none; }
    .sheet:not(.open) { pointer-events: none; }
  }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px 18px; background: var(--brand); color: var(--brand-ink); border-bottom: 2px solid var(--brass); }
  .sheet-head h2 { font-family: var(--serif); font-weight: 400; font-size: 19px; letter-spacing: .02em; margin: 0; flex: 1; }
  .sheet-head .icon-btn { background: rgba(243, 235, 221, .14); box-shadow: none; }
  .sheet-head .icon-btn svg { stroke: var(--brand-ink); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 18px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #fffdf8; }

<script>
/* =====================================================================
   Property Stalkers front end. Settings come from /api/config (Netlify
   environment variables), so there is nothing to edit in this file.
   ===================================================================== */

const EXAMPLES = [
  { role: "landlord", label: "Selling", text: "I want to sell my 3 bedroom apartment in [building name], [area], [city] for [price]" },
  { role: "landlord", label: "Renting out", text: "I want to rent out my 2 bedroom apartment in [building name], [area], [city] for [rent] a month" },
  { role: "broker", label: "Listing for sale", text: "Selling a 4 bedroom villa in [building or community], [area], [city] for [price]" },
  { role: "broker", label: "Listing for rent", text: "Renting out a 2 bedroom apartment in [building name], [area], [city] for [rent] a month" },
  { role: "buyer", label: "Looking to buy", text: "I'm looking to buy a 3 bedroom apartment in [building or area], [city], budget [price]" },
  { role: "tenant", label: "Looking to rent", text: "I'm looking to rent a 2 bedroom apartment in [building or area], [city], budget [rent] a month" }
];

const ROLES = {
  landlord: { label: "Owner / Landlord", desc: "Sell or rent out your own property", cta: "List my property" },
  broker: { label: "Broker / Agent", desc: "List properties and see what buyers and tenants are looking for", cta: "List a property" },
  developer: { label: "Developer", desc: "List new projects and launches", cta: "List a project" },
  buyer: { label: "Buyer", desc: "Tell brokers what you want to buy", cta: "Post what I'm looking for" },
  tenant: { label: "Tenant", desc: "Tell brokers what you want to rent", cta: "Post a rental request" }
};
const roleOf = () => (S.me && S.me.profile && S.me.profile.role) || null;

const S = {
  cfg: null, sb: null, session: null, me: null,
  posts: [], access: null, signedIn: false,
  tab: "listing", filter: "all", map: null, Marker: null, clusterer: null, plain: [], pinEls: new Map(),
  activeId: null, chat: [], draft: null, draftPhotos: [], busy: false, fitted: false, userId: null
};

/* ---------------- helpers ---------------- */
const $ = (s, root = document) => root.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDesktop = () => window.innerWidth >= 760;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function money(n) {
  if (n == null) return "";
  const trim = (x) => x.toFixed(2).replace(/\.?0+$/, "");
  if (n >= 1e7) return trim(n / 1e7) + " Cr";
  if (n >= 1e5) return trim(n / 1e5) + " L";
  if (n >= 1e3) return trim(n / 1e3) + "K";
  return String(n);
}
const TYPE = { apartment: "apartment", villa: "villa", independent_house: "independent house", plot: "plot", office: "office", shop: "shop", other: "" };
const POSTER = { landlord: "Landlord", broker: "Broker", developer: "Developer", buyer: "Buyer", tenant: "Tenant" };
const isDev = (p) => p.poster_type === "developer";
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

function what(p) {
  const t = TYPE[p.property_type] || "";
  if (p.bedrooms) return `${p.bedrooms} BHK${t ? " " + t : ""}`;
  return t || "property";
}
function titleOf(p) {
  if (isDev(p)) return p.building || "New project";
  if (p.kind === "listing") return cap(`${what(p)} for ${p.deal === "rent" ? "rent" : "sale"}`);
  const w = what(p);
  return `Looking to ${p.deal === "rent" ? "rent" : "buy"} ${/^[aeiou]/i.test(w) ? "an" : "a"} ${w}`;
}
const placeOf = (p) => [isDev(p) ? null : p.building, p.locality, p.city].filter(Boolean).join(", ");
const SYMBOL = { INR: "₹", USD: "$", GBP: "£", EUR: "€" };
function amount(p) {
  if (p.price == null) return "";
  const cur = p.currency || "INR";
  if (cur === "INR") return "₹" + money(p.price);
  const n = p.price, trim = (x) => x.toFixed(2).replace(/\.?0+$/, "");
  const short = n >= 1e9 ? trim(n / 1e9) + "B" : n >= 1e6 ? trim(n / 1e6) + "M" : n >= 1e3 ? trim(n / 1e3) + "K" : String(n);
  return SYMBOL[cur] ? SYMBOL[cur] + short : cur + " " + short;
}
function priceOf(p) {
  const per = p.deal === "rent" ? "/month" : "";
  if (isDev(p)) return p.price ? `From ${amount(p)}` : "Price on request";
  if (p.kind === "listing") return p.price ? `${amount(p)}${per}` : "Price on request";
  return p.price ? `Budget ${amount(p)}${per}` : "Budget not given";
}
function pinLabel(p) {
  if (isDev(p)) return p.price ? `New · ${amount(p)}+` : "New project";
  if (p.kind === "listing") return p.price ? `${amount(p)}${p.deal === "rent" ? "/mo" : ""}` : (p.bedrooms ? `${p.bedrooms} BHK` : "View");
  const head = p.deal === "rent" ? "Rent" : "Buy";
  return `${head} · ${p.price ? amount(p) : p.bedrooms ? p.bedrooms + " BHK" : "request"}`;
}
function posterLine(p) {
  if (p.poster_type === "broker" && p.rera_number) return `Broker · Licence ${p.rera_number}`;
  if (isDev(p)) return `Developer${p.company ? " · " + p.company : ""}`;
  return POSTER[p.poster_type] || "";
}
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 3600) return "just now";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  const d = Math.floor(s / 86400);
  return d < 30 ? d + (d === 1 ? " day ago" : " days ago") : new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
const initials = (n) => (n || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const telHref = (d) => "tel:+" + String(d || "").replace(/\D/g, "");
const waHref = (d, text) => `https://wa.me/${String(d || "").replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;

function placeholder(id) {
  let seed = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const h = [158, 165, 38, 32][Math.floor(rnd() * 4)]; // emerald and brass tones
  let towers = "", x = 30;
  while (x < 780) {
    const w = 60 + rnd() * 70, top = 140 + rnd() * 230;
    towers += `<rect x="${x}" y="${top}" width="${w}" height="${600 - top}" fill="hsl(${h},30%,${22 + rnd() * 14}%)"/>`;
    for (let wy = top + 16; wy < 560; wy += 26)
      for (let wx = x + 10; wx < x + w - 12; wx += 18)
        if (rnd() > .35) towers += `<rect x="${wx}" y="${wy}" width="8" height="12" fill="hsla(45,90%,80%,${.35 + rnd() * .5})"/>`;
    x += w + 8 + rnd() * 16;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h},70%,78%)"/><stop offset="1" stop-color="hsl(${(h + 40) % 360},65%,90%)"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="640" cy="120" r="54" fill="hsla(40,100%,96%,.85)"/>${towers}<rect y="560" width="800" height="40" fill="hsl(${h},25%,18%)"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
function notice(title, text) {
  const n = document.createElement("div");
  n.className = "notice";
  n.innerHTML = `<div><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
  document.body.appendChild(n);
}

async function freshToken(force) {
  if (!S.sb || !S.session) return null;
  try {
    if (force) { const { data } = await S.sb.auth.refreshSession(); if (data && data.session) S.session = data.session; }
    else { const { data } = await S.sb.auth.getSession(); if (data && data.session) S.session = data.session; }
  } catch (e) {}
  return S.session ? S.session.access_token : null;
}

async function api(path, opts = {}, retried) {
  const headers = { "content-type": "application/json" };
  const token = await freshToken(false);
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch("/api" + path, { ...opts, headers });
  if (res.status === 401 && token && !retried && await freshToken(true)) return api(path, opts, true);
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(body.error && body.error.includes(" ") ? body.error : "Something went wrong. Please try again.");
    err.code = body.error; err.status = res.status;
    throw err;
  }
  return body;
}

/* ---------------- start up ---------------- */
async function boot() {
  try {
    S.cfg = await api("/config");
  } catch (e) {
    return notice("Almost ready", "The site's server isn't connected yet. Follow the setup guide to add your Supabase, Google Maps and AI keys, then reload this page.");
  }
  if (!window.supabase) return notice("Couldn't load", "Please check your internet connection and reload the page.");

  // Talk to Supabase through our own domain (/sb), so sign-in and photos work even where
  // *.supabase.co is blocked. Keep the original storage key so people stay signed in.
  S.sbBase = location.origin + "/sb";
  const ref = new URL(S.cfg.supabaseUrl).hostname.split(".")[0];
  S.sb = window.supabase.createClient(S.sbBase, S.cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: `sb-${ref}-auth-token` }
  });
  try {
    const { data } = await withTimeout(S.sb.auth.getSession(), 8000);
    S.session = data.session;
  } catch (e) { S.session = null; }
  S.userId = S.session ? S.session.user.id : null;
  S.sb.auth.onAuthStateChange((_event, session) => {
    S.session = session;
    const id = session ? session.user.id : null;
    if (id === S.userId) return;
    S.userId = id;
    setTimeout(afterAuthChange, 0);
  });

  try {
    await loadGoogleMaps();
  } catch (e) {
    return notice("The map couldn't load", "Please check your internet connection and reload. If this keeps happening, the Google Maps key may need fixing (see the setup guide).");
  }
  await initMap();
  await refreshMe();
  await loadFeed();
  openFromHash();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); }
}

async function afterAuthChange() {
  await refreshMe();
  await loadFeed();
  if (S.session && store.get("ps_resume")) { store.del("ps_resume"); startPosting(); return; }
  if (S.me && !profileComplete()) renderProfileStepThen(() => { closeSheet(); toast("Profile saved."); });
}

window.gm_authFailure = () => notice("Google Maps key problem", "The Google Maps key was rejected. Check that the Maps JavaScript API is enabled and the key allows this website (see the setup guide).");

function loadGoogleMaps() {
  return new Promise((resolve, reject) => {
    window.__psMapsReady = resolve;
    const s = document.createElement("script");
    const q = new URLSearchParams({ key: S.cfg.mapsKey, v: "weekly", libraries: "marker", loading: "async", callback: "__psMapsReady", region: "IN", language: "en" });
    s.src = "https://maps.googleapis.com/maps/api/js?" + q;
    s.async = true;
    s.onerror = () => reject(new Error("maps"));
    document.head.appendChild(s);
  });
}

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
  S.Marker = AdvancedMarkerElement;
  S.map = new Map($("#map"), {
    center: { lat: 22, lng: 79 }, zoom: 5, mapId: S.cfg.mapId, mapTypeId: store.get("ps_maptype") || "hybrid",
    disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy", clickableIcons: false
  });
  S.map.addListener("idle", updateListCount);
  updateMapTypeButton();
}

function updateMapTypeButton() {
  const sat = S.map && S.map.getMapTypeId && S.map.getMapTypeId() !== "roadmap";
  $("#maptype-label").textContent = sat ? "Map" : "Satellite";
}
$("#maptype").addEventListener("click", () => {
  if (!S.map) return;
  const next = S.map.getMapTypeId() === "roadmap" ? "hybrid" : "roadmap";
  S.map.setMapTypeId(next);
  store.set("ps_maptype", next);
  updateMapTypeButton();
});

/* ---------------- account ---------------- */
async function refreshMe() {
  if (S.session) {
    try { S.me = await api("/me"); }
    catch (e) { if (e.status === 401) { const { data } = await S.sb.auth.getSession(); if (!data.session) { S.session = null; S.me = null; } } }
  } else S.me = null;
  renderAccountButton();
}

function renderAccountButton() {
  updateFab();
  const b = $("#account");
  if (S.me) {
    b.className = "account profile-btn";
    const pic = S.me.profile && S.me.profile.avatar_url;
    b.innerHTML = `<span class="pav">${pic ? `<img src="${esc(shown(pic))}" alt="">` : esc(initials((S.me.profile && S.me.profile.name) || S.me.email || "Me"))}</span><span class="plabel">My profile</span><span class="plabel-s">Profile</span>${profileComplete() ? "" : `<span class="pdot" aria-label="Profile incomplete"></span>`}`;

/* ---------------- feed and markers ---------------- */
async function loadFeed() {
  try {
    const f = await api("/feed");
    S.posts = f.posts;
    S.access = f.access;
    S.signedIn = f.signedIn;
  } catch (e) {
    toast("Couldn't load the map posts. Please reload.");
    return;
  }
  renderMarkers();
}

function passFilter(p) {
  if (p.kind !== "listing" || S.filter === "all") return true;
  if (S.filter === "project") return isDev(p);
  return p.deal === S.filter;
}
const visiblePosts = () => S.posts.filter((p) => p.kind === S.tab && passFilter(p));

function inView(p) {
  const b = S.map && S.map.getBounds && S.map.getBounds();
  return !b || b.contains({ lat: p.lat, lng: p.lng });
}
function updateListCount() {
  const n = visiblePosts().filter(inView).length;
  $("#list-n").textContent = n ? `(${n})` : "";
}

function renderMarkers() {
  const canSeeRequests = !!(S.access && S.access.requests) || S.posts.some((p) => p.kind === "request");
  $(".tabs").hidden = !canSeeRequests;
  if (!canSeeRequests && S.tab === "request") S.tab = "listing";
  $("#filters").hidden = S.tab !== "listing";
  document.querySelectorAll(".fchip[data-f]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.f === S.filter)));
  const counts = { listing: 0, request: 0 };
  S.posts.forEach((p) => counts[p.kind]++);
  $("#n-listing").textContent = counts.listing ? String(counts.listing) : "";
  $("#n-request").textContent = counts.request ? String(counts.request) : "";
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
  renderBanner();
  if (!S.map) return;

  if (S.clusterer) S.clusterer.clearMarkers();
  S.plain.forEach((m) => (m.map = null));
  S.plain = [];
  S.pinEls.clear();

  const shown = visiblePosts();
  const markers = shown.map((p) => {
    const el = document.createElement("button");
    el.className = "pin" + (p.kind === "request" ? " req" : "") + (isDev(p) ? " dev" : "") + (p.id === S.activeId ? " active" : "");
    el.textContent = pinLabel(p);
    el.setAttribute("aria-label", `${titleOf(p)}, ${placeOf(p)}`);
    el.addEventListener("click", (e) => { e.stopPropagation(); openDetails(p.id, { pan: true }); });
    S.pinEls.set(p.id, el);
    return new S.Marker({ position: { lat: p.lat, lng: p.lng }, content: el, title: titleOf(p) });
  });

  if (window.markerClusterer) {
    if (!S.clusterer) {
      S.clusterer = new markerClusterer.MarkerClusterer({
        map: S.map,
        markers: [],
        renderer: {
          render: ({ count, position }) => {
            const d = document.createElement("div");
            const size = count < 10 ? 40 : count < 50 ? 48 : 56;
            d.className = "cluster" + (S.tab === "request" ? " req" : "");
            d.style.width = d.style.height = size + "px";
            d.textContent = count;
            return new S.Marker({ position, content: d, zIndex: 1000 + count });
          }
        }
      });
    }
    S.clusterer.addMarkers(markers);
  } else {
    markers.forEach((m) => (m.map = S.map));
    S.plain = markers;
  }

  if (!S.fitted && shown.length) {
    S.fitted = true;
    const b = new google.maps.LatLngBounds();
    shown.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
    S.map.fitBounds(b, 80);
    google.maps.event.addListenerOnce(S.map, "idle", () => { if (S.map.getZoom() > 13) S.map.setZoom(13); });
  }
  updateListCount();
}

function renderBanner() {
  const el = $("#banner");
  let html = "";
  if (S.tab === "request") {
    html = S.access && S.access.requests
      ? "You can see all buyer and tenant requests."
      : "You can see your own requests. Buyer and tenant requests are visible only to <b>brokers with a licence / RERA number</b>.";
  } else if (!S.posts.some((p) => p.kind === "listing")) {
    html = "<b>No properties listed yet.</b> Be the first: sign in and list yours.";
  } else if (!visiblePosts().length) {
    html = S.filter === "project"
      ? "<b>No new projects listed yet.</b> Developers can sign in, choose <b>Developer</b> and tap <b>List a project</b>."
      : "No properties match this filter yet.";
  }
  el.innerHTML = html;
  el.hidden = !html;
}

document.querySelectorAll(".fchip[data-f]").forEach((c) => c.addEventListener("click", () => {
  S.filter = c.dataset.f;
  closeDetails();
  renderMarkers();
}));
$("#show-list").addEventListener("click", () => openList());

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  if (S.tab === t.dataset.tab) return;
  S.tab = t.dataset.tab;
  closeDetails();
  renderMarkers();
}));

/* ---------------- details panel ---------------- */
const panel = $("#panel");

function setActive(id) {
  if (S.activeId && S.pinEls.get(S.activeId)) S.pinEls.get(S.activeId).classList.remove("active");
  S.activeId = id;
  if (id && S.pinEls.get(id)) S.pinEls.get(id).classList.add("active");
}

function focusOn(p, zoom) {
  if (!S.map) return;
  if (zoom) S.map.setZoom(zoom);
  S.map.panTo({ lat: p.lat, lng: p.lng });
  google.maps.event.addListenerOnce(S.map, "idle", () => {
    S.map.panBy(isDesktop() ? 210 : 0, isDesktop() ? 0 : Math.round(window.innerHeight * 0.28));
  });
}

function openDetails(id, opts = {}) {
  const p = S.posts.find((x) => x.id === id);
  if (!p) return false;
  if (p.kind !== S.tab || !passFilter(p)) { S.tab = p.kind; S.filter = "all"; renderMarkers(); }
  const isReq = p.kind === "request";
  const photos = p.photos && p.photos.length ? p.photos.map(shown) : (isReq ? [] : [placeholder(p.id)]);
  const msg = isReq
    ? `Hi ${p.contact_name || ""}, I saw your request on Property Stalkers (${titleOf(p).toLowerCase()} in ${placeOf(p)}). I may have something for you.`
    : isDev(p)
    ? `Hi, I'm interested in ${titleOf(p)}${p.company ? " by " + p.company : ""} in ${placeOf(p)}, which I saw on Property Stalkers.`
    : `Hi ${p.contact_name || ""}, I'm interested in your ${titleOf(p).toLowerCase()} in ${placeOf(p)}, which I saw on Property Stalkers.`;

  $("#panel-content").innerHTML = `
    ${isReq ? `<div class="req-head"><div class="big">${esc(POSTER[p.poster_type])} request</div></div>` : `
    <div class="gallery">
      <div class="slides" id="slides">${photos.map((src, i) => `<img src="${esc(src)}" alt="Photo ${i + 1}" loading="${i ? "lazy" : "eager"}">`).join("")}</div>
      ${photos.length > 1 ? `<span class="counter" id="counter">1 / ${photos.length}</span>
        <button class="g-nav prev" id="g-prev" aria-label="Previous photo">&#8249;</button>
        <button class="g-nav next" id="g-next" aria-label="Next photo">&#8250;</button>` : ""}
    </div>`}
    <div class="body">
      <span class="tag${isReq ? " req" : ""}">${isReq ? (p.deal === "rent" ? "Wants to rent" : "Wants to buy") : isDev(p) ? "New project" : (p.deal === "rent" ? "For rent" : "For sale")}</span>${p.mine ? `<span class="tag mine">Your post</span>` : ""}
      <div class="title-row"><h1 class="title">${esc(titleOf(p))}</h1><button class="share-btn" id="share-post" aria-label="Share this post"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button></div>
      <p class="loc">${esc(placeOf(p))}</p>
      <p class="price">${esc(priceOf(p))}</p>
      ${isDev(p) ? `<div class="facts">
        <div class="fact"><b>Developer</b><span>${esc(p.company || "—")}</span></div>
        <div class="fact"><b>Possession</b><span>${esc(p.possession || "—")}</span></div>
        <div class="fact"><b>Configuration</b><span>${esc(p.configs || (p.bedrooms ? p.bedrooms + " BHK onwards" : cap(TYPE[p.property_type] || "—")))}</span></div>
        <div class="fact"><b>Project RERA</b><span>${esc(p.rera_number || "—")}</span></div>
      </div>` : `<div class="facts">
        <div class="fact"><b>Type</b><span>${esc(cap(TYPE[p.property_type] || "Any"))}</span></div>
        <div class="fact"><b>Bedrooms</b><span>${p.bedrooms ? esc(p.bedrooms + " BHK") : "—"}</span></div>
        <div class="fact"><b>Posted by</b><span>${esc(POSTER[p.poster_type])}</span></div>
        <div class="fact"><b>Posted</b><span>${esc(ago(p.created_at))}</span></div>
      </div>`}
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      <div class="contact">
        <div class="contact-head">
          <div class="avatar">${p.contact_avatar ? `<img src="${esc(shown(p.contact_avatar))}" alt="">` : esc(initials(p.contact_name))}</div>
          <div><div class="contact-name">${esc(p.contact_name)}</div><div class="contact-sub">${esc(posterLine(p))}</div></div>
        </div>
        ${p.mine ? "" : `<div class="actions">
          <a class="btn primary" href="${esc(telHref(p.contact_phone))}">Call</a>
          <a class="btn wa" href="${esc(waHref(p.contact_phone, msg))}" target="_blank" rel="noopener">WhatsApp</a>
        </div>`}
      </div>
      ${p.precision === "area" ? `<p class="hint">The pin shows the sector or area, not the exact building.</p>` : ""}
      ${p.source === "dld" && !p.mine ? `<div class="claim"><p class="hint">Listed from Dubai Land Department project records.</p>
        <a class="btn claim-btn" id="claim-post" href="${esc(waHref(p.contact_phone, `Hi, I represent ${p.company || "the developer"} and would like to claim the project "${p.building}" on Property Stalkers: ${location.origin}/#p=${p.id}`))}" target="_blank" rel="noopener">Developer? Claim this project</a></div>` : ""}
      ${p.mine ? `<button class="btn edit-btn" id="edit-post"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit my post</button>` : ""}
      ${p.removable ? `<button class="link-btn" id="remove-post">${p.mine ? "Remove my post" : "Remove post (admin)"}</button>` : ""}
    </div>`;

  const slides = $("#slides"), counter = $("#counter");
  const showCount = () => { if (counter) counter.textContent = `${Math.min(photos.length, Math.round(slides.scrollLeft / slides.clientWidth) + 1)} / ${photos.length}`; };
  if (slides && counter) {
    slides.addEventListener("scroll", showCount, { passive: true });
    slides.addEventListener("scrollend", showCount);
    const go = (d) => {
      const i = Math.round(slides.scrollLeft / slides.clientWidth);
      const n = (i + d + photos.length) % photos.length;
      slides.scrollTo({ left: n * slides.clientWidth, behavior: "smooth" });
      counter.textContent = `${n + 1} / ${photos.length}`;
    };
    $("#g-prev").addEventListener("click", () => go(-1));
    $("#g-next").addEventListener("click", () => go(1));
  }
  $("#share-post").addEventListener("click", async () => {
    const link = location.origin + "/#p=" + encodeURIComponent(p.id);
    const text = `${titleOf(p)} in ${placeOf(p)}${p.price ? " · " + priceOf(p) : ""} on Property Stalkers`;
    try {
      if (navigator.share) { await navigator.share({ title: titleOf(p), text, url: link }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(link); toast("Link copied."); }
    catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + link), "_blank", "noopener"); }
  });
  const rm = $("#remove-post");
  if (rm) rm.addEventListener("click", () => removePost(p.id));
  const ed = $("#edit-post");
  if (ed) ed.addEventListener("click", () => openEditForm(p.id));

  panel.scrollTop = 0;
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  setActive(p.id);
  try { history.replaceState(null, "", "#p=" + encodeURIComponent(p.id)); } catch (e) {}
  if (opts.pan || opts.zoom) focusOn(p, opts.zoom);
  return true;
}

function closeDetails() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  setActive(null);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
$("#panel-close").addEventListener("click", closeDetails);

window.addEventListener("hashchange", () => { if (S.map && /p=/.test(location.hash)) openFromHash(); });
function openFromHash() {
  const id = new URLSearchParams(location.hash.slice(1)).get("p");
  if (id && !openDetails(id, { zoom: 15 })) toast("That post is no longer available, or only visible to some members.");
}

async function removePost(id) {
  if (!confirm("Remove this post from the map?")) return;
  try {
    await api("/posts/" + id, { method: "DELETE" });
    closeDetails();
    toast("Post removed.");
    await loadFeed();
    if ($("#sheet").classList.contains("open") && $("#sheet").dataset.view === "account") renderAccount();
  } catch (e) { toast(e.message); }
}

/* ---------------- edit your own post ---------------- */
const TYPE_OPTS = [["apartment", "Apartment"], ["villa", "Villa / townhouse"], ["independent_house", "Independent house"], ["plot", "Plot"], ["office", "Office"], ["shop", "Shop / retail"], ["other", "Other"]];

function openEditForm(id) {
  const p = S.posts.find((x) => x.id === id);
  if (!p) return;
  const isReq = p.kind === "request", dev = isDev(p);
  const E = { photos: [...(p.photos || [])], files: [] };
  openSheet("edit", "Edit your post");
  $("#sheet-body").innerHTML = `
    <form id="edit-form" novalidate>
      <p class="muted">Change anything below and save. Your post updates on the map straight away.</p>
      ${!isReq && !dev ? `<div class="field"><span>Listing for</span><div class="seg">
        <button type="button" class="segb" data-deal="sale" aria-pressed="${p.deal !== "rent"}">Sale</button>
        <button type="button" class="segb" data-deal="rent" aria-pressed="${p.deal === "rent"}">Rent</button></div></div>` : ""}
      ${dev ? `<label class="field"><span>Project name</span><input id="e-building" value="${esc(p.building)}"></label>
        <label class="field"><span>Developer company</span><input id="e-company" value="${esc(p.company)}"></label>` : ""}
      <div class="grid2">
        <label class="field"><span>Property type</span><select id="e-type">${TYPE_OPTS.map(([v, l]) => `<option value="${v}"${p.property_type === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        ${dev ? `<label class="field"><span>Configurations</span><input id="e-configs" value="${esc(p.configs)}" placeholder="e.g. 2, 3 & 4 BHK"></label>`
              : `<label class="field"><span>Bedrooms</span><input id="e-bedrooms" inputmode="numeric" value="${esc(p.bedrooms ?? "")}" placeholder="e.g. 3"></label>`}
      </div>
      <div class="field"><span>${isReq ? "Budget" : dev ? "Starting price" : p.deal === "rent" ? "Rent per month" : "Price"}</span>
        <div class="price-row">
          <input id="e-price" inputmode="numeric" value="${esc(p.price ? Number(p.price).toLocaleString("en-US") : "")}">
          <select id="e-currency">${CURRENCIES.map((c) => `<option${(p.currency || "INR") === c ? " selected" : ""}>${c}</option>`).join("")}</select>
        </div>
      </div>
      ${dev ? `<div class="grid2"><label class="field"><span>Possession</span><input id="e-possession" value="${esc(p.possession)}" placeholder="e.g. Dec 2027"></label>
        <label class="field"><span>Project RERA</span><input id="e-rera" value="${esc(p.rera_number)}"></label></div>` : ""}
      ${p.poster_type === "broker" ? `<label class="field"><span>Your licence / RERA number</span><input id="e-rera" value="${esc(p.rera_number)}"></label>` : ""}
      <div class="form-section">Location</div>
      ${dev ? "" : `<label class="field"><span>Building or project <span class="opt">(optional)</span></span><input id="e-building" value="${esc(p.building)}"></label>`}
      <label class="field"><span>Area, sector or community</span><input id="e-locality" value="${esc(p.locality)}"></label>
      <div class="grid2">
        <label class="field"><span>City</span><input id="e-city" value="${esc(p.city)}"></label>
        <label class="field"><span>Country <span class="opt">(optional)</span></span><input id="e-country" value="${esc(p.country)}"></label>
      </div>
      <label class="field"><span>Description <span class="opt">(optional)</span></span><textarea id="e-desc" maxlength="400">${esc(p.description)}</textarea></label>
      ${isReq ? "" : `<div class="form-section">Photos</div>
        <div class="edit-thumbs" id="e-thumbs"></div>
        <label class="photo-pick">Add photos (up to 8 in total)<input type="file" id="e-files" accept="image/jpeg,image/png,image/webp" multiple></label>`}
      <button class="btn primary" style="width:100%" id="e-save">Save changes</button>
      <p class="error" id="e-err" hidden></p>
    </form>`;
  let deal = p.deal;
  document.querySelectorAll(".segb").forEach((b) => b.addEventListener("click", () => {
    deal = b.dataset.deal;
    document.querySelectorAll(".segb").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
  const drawThumbs = () => {
    const box = $("#e-thumbs"); if (!box) return;
    box.innerHTML = [...E.photos.map((u, i) => ({ src: shown(u), kind: "old", i })), ...E.files.map((f, i) => ({ src: URL.createObjectURL(f), kind: "new", i }))]
      .map((t) => `<div class="et"><img src="${esc(t.src)}" alt=""><button type="button" aria-label="Remove photo" data-k="${t.kind}" data-i="${t.i}">&times;</button></div>`).join("")
      || `<p class="muted" style="margin:0 0 10px">No photos yet.</p>`;
    box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      (b.dataset.k === "old" ? E.photos : E.files).splice(Number(b.dataset.i), 1); drawThumbs();
    }));
  };
  drawThumbs();
  const fi = $("#e-files");
  if (fi) fi.addEventListener("change", () => {

  });

  $("#edit-form").addEventListener("submit", async (e) => {

    try {
      const urls = [...E.photos];
      for (let i = 0; i < E.files.length; i++) {
        btn.textContent = `Uploading photo ${i + 1} of ${E.files.length}…`;
        urls.push(await uploadPhoto(E.files[i]));
      }
      btn.textContent = "Saving…";
      const body = {
        deal, property_type: val("#e-type"), price: price ? Math.round(price) : null, currency: val("#e-currency"),
        building: val("#e-building"), locality: val("#e-locality"), city: val("#e-city"), country: val("#e-country"),
        description: val("#e-desc")
      };
      if ($("#e-bedrooms")) body.bedrooms = val("#e-bedrooms") ? Number(val("#e-bedrooms").replace(/\D/g, "")) : null;
      if ($("#e-configs")) body.configs = val("#e-configs");
      if ($("#e-company")) body.company = val("#e-company");
      if ($("#e-possession")) body.possession = val("#e-possession");
      if ($("#e-rera")) body.rera_number = val("#e-rera");
      if (!isReq) body.photos = urls;
      await api("/posts/" + p.id, { method: "PATCH", body: JSON.stringify(body) });
      closeSheet();
      toast("Changes saved.");
      await loadFeed();
      openDetails(p.id, { pan: true });
    } catch (ex) {

function openList() {

/* ---------------- search ---------------- */
const qEl = $("#q"), resultsEl = $("#results");
let searchTimer, searchSel = -1;

function searchText(p) {
  return [p.building, p.locality, p.city, p.country, p.address, p.company].filter(Boolean).join(" ").toLowerCase();
}
function matchPosts(q) {
  const words = q.toLowerCase().split(/[\s,]+/).filter(Boolean);
  if (!words.length) return [];
  return S.posts.filter((p) => p.kind === S.tab && words.every((w) => searchText(p).includes(w)));
}

function renderResults() {
  const q = qEl.value.trim();
  $("#q-clear").hidden = !q;
  if (q.length < 2) { resultsEl.hidden = true; return; }
  const hits = matchPosts(q);
  searchSel = -1;
  resultsEl.innerHTML = hits.slice(0, 6).map((p) => `
      <button class="result" role="option" data-id="${esc(p.id)}">
        <img src="${esc(thumbOf(p))}" alt="">
        <span class="r-main"><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))}</small></span>
        <span class="r-price">${esc(p.price ? amount(p) : "")}</span>
      </button>`).join("")
    + (hits.length > 6 ? `<button class="result go" data-all="1">Show all ${hits.length} matches on the map</button>` : "")
    + `<button class="result go" data-go="1">Show “${esc(q)}” on the map</button>`
    + (hits.length ? "" : `<div class="result empty">No listed properties match yet. You can still move the map there.</div>`);
  resultsEl.hidden = false;
  const act = (b, fn) => {
    b.addEventListener("pointerdown", (e) => e.preventDefault());
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", fn);
  };
  resultsEl.querySelectorAll("[data-id]").forEach((b) => act(b, () => pickPost(b.dataset.id)));
  resultsEl.querySelectorAll("[data-all]").forEach((b) => act(b, () => showMatches(hits)));
  resultsEl.querySelectorAll("[data-go]").forEach((b) => act(b, () => goToPlace(q)));
}

function closeResults() { resultsEl.hidden = true; }

function pickPost(id) {
  closeResults();
  qEl.blur();
  openDetails(id, { zoom: 15 });
}

function showMatches(hits) {
  closeResults();
  qEl.blur();
  S.filter = "all";
  renderMarkers();
  const b = new google.maps.LatLngBounds();
  hits.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
  S.map.fitBounds(b, 80);
  google.maps.event.addListenerOnce(S.map, "idle", () => { if (S.map.getZoom() > 15) S.map.setZoom(15); openList(); });
}

async function goToPlace(q) {
  closeResults();
  qEl.blur();
  try {
    const { place } = await api("/geocode?q=" + encodeURIComponent(q));
    if (!place) return toast(`Couldn't find “${q}”. Try adding the city.`);
    closeDetails();
    if (place.viewport) S.map.fitBounds({ north: place.viewport.north, south: place.viewport.south, east: place.viewport.east, west: place.viewport.west }, 40);
    else { S.map.setCenter({ lat: place.lat, lng: place.lng }); S.map.setZoom(13); }
    google.maps.event.addListenerOnce(S.map, "idle", () => {
      const n = visiblePosts().filter(inView).length;
      if (n) openList();
      else toast(`No properties listed around ${place.address || q} yet.`);
    });
  } catch (e) {
    toast(e.message);
  }
}

qEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderResults, 120); });
qEl.addEventListener("focus", renderResults);
qEl.addEventListener("blur", () => setTimeout(closeResults, 300));
qEl.addEventListener("keydown", (e) => {
  const opts = [...resultsEl.querySelectorAll("button.result")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!opts.length) return;
    searchSel = (searchSel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("sel", i === searchSel));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const q = qEl.value.trim();
    if (!q) return;
    if (searchSel >= 0 && opts[searchSel]) { opts[searchSel].click(); return; }
    const hits = matchPosts(q);
    if (hits.length === 1) pickPost(hits[0].id);
    else if (hits.length > 1) showMatches(hits);
    else goToPlace(q);
  } else if (e.key === "Escape") {
    closeResults();
    qEl.blur();
  }
});
$("#q-clear").addEventListener("click", () => { qEl.value = ""; $("#q-clear").hidden = true; closeResults(); qEl.focus(); });

const CURRENCIES = ["INR", "AED", "USD", "GBP", "EUR", "SAR", "QAR", "OMR", "KWD", "BHD", "SGD", "CAD", "AUD"];
const CONFIGS = [["0", "Studio"], ["1", "1 BHK"], ["2", "2 BHK"], ["3", "3 BHK"], ["4", "4 BHK"], ["5", "5+ BHK"]];

function configsText(sel) {
  const nums = sel.map(Number).sort((a, b) => a - b);
  const parts = nums.map((n) => (n === 0 ? "Studio" : n === 5 ? "5+" : String(n)));
  const hasBhk = nums.some((n) => n > 0);
  if (!parts.length) return "";
  const list = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " & " + parts[parts.length - 1];
  return hasBhk ? list + " BHK" : list;
}
function monthText(v) {
  if (!/^\d{4}-\d{2}$/.test(v || "")) return "";
  const [y, m] = v.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
}

const GOOGLE_G = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

function renderSignIn(reason, mode) {
  openSheet("signin", "Sign in");
  mode = mode || "email";
  $("#sheet-body").innerHTML = `
    <p class="muted">${esc(reason || "Sign in to list a property, a project or what you're looking for.")} You'll stay signed in on this device.</p>
    <div id="oauth" class="oauth"></div>
    <div class="tabs2" id="auth-tabs">
      <button type="button" class="segb" data-m="email" aria-pressed="${mode === "email"}">Email</button>
      <button type="button" class="segb" data-m="phone" aria-pressed="${mode === "phone"}">Mobile number</button>
    </div>
    <form id="signin-form" novalidate>
      ${mode === "phone"
        ? `<label class="field"><span>Mobile number with country code</span><input type="tel" id="ident" inputmode="tel" autocomplete="tel" placeholder="+971 50 123 4567"></label>`
        : `<label class="field"><span>Email</span><input type="email" id="ident" autocomplete="email" placeholder="you@example.com"></label>`}
      <button class="btn accent" style="width:100%" id="signin-btn">Send me a code</button>
      <p class="error" id="signin-err" hidden></p>
    </form>`;
  authProviders().then((pv) => {
    const box = $("#oauth");
    if (box && pv.google) {
      box.innerHTML = `<button class="btn oauth-btn" id="google-btn" type="button">${GOOGLE_G}<span>Continue with Google</span></button><div class="or"><span>or</span></div>`;
      $("#google-btn").addEventListener("click", async () => {
        const { error } = await S.sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
        if (error) { const err = $("#signin-err"); err.hidden = false; err.textContent = "Google sign-in isn't available right now. Please use your email."; }
      });
    }
    S.phoneSignIn = !!pv.phone;
    if (mode === "phone" && !pv.phone) showPhoneSoon();
  });
  document.querySelectorAll("#auth-tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.m !== mode) renderSignIn(reason, b.dataset.m);
  }));
  function showPhoneSoon() {
    const err = $("#signin-err");
    err.hidden = false;
    err.textContent = "Sign-in with a mobile number is being set up and isn't available yet. Please use your email for now. You can add your mobile number in My profile.";
    $("#signin-btn").textContent = "Use email instead";
  }
  $("#signin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (mode === "phone" && S.providers && !S.providers.phone) { renderSignIn(reason, "email"); return; }
    const raw = $("#ident").value.trim();
    const err = $("#signin-err");
    let ident;
    if (mode === "phone") {
      const digits = raw.replace(/[^0-9]/g, "");
      if (digits.length < 8) { err.hidden = false; err.textContent = "Please enter your mobile number with country code, e.g. +971 50 123 4567."; return; }
      ident = { phone: "+" + digits };
    } else {
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw)) { err.hidden = false; err.textContent = "Please enter a valid email address."; return; }
      ident = { email: raw };
    }
    const btn = $("#signin-btn");
    btn.disabled = true; btn.textContent = "Sending…";
    let error;
    try {
      if (!S.sb) throw new Error("not ready");
      ({ error } = await withTimeout(S.sb.auth.signInWithOtp({ ...ident, options: mode === "email" ? { emailRedirectTo: location.origin + location.pathname } : {} }), 20000));
    } catch (ex) { error = { message: ex.message === "timeout" ? "timeout" : "network" }; }
    if (error) {
      btn.disabled = false; btn.textContent = "Send me a code";
      err.hidden = false;
      err.textContent = /rate|seconds/i.test(error.message) ? "Please wait a minute before asking for another code."
        : /timeout|network/.test(error.message) ? "Couldn't reach the sign-in service. Please check your connection and try again."
        : mode === "phone" ? "Couldn't send a text to that number. Please check it, or sign in with email." : "Couldn't send the email. Please check the address and try again.";
      return;
    }
    renderCodeEntry(ident, mode, reason);
  });
}

  $("#sheet-body").innerHTML = `
    <h3 style="margin:4px 0 8px">Enter your code</h3>
