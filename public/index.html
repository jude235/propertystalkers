    intro.innerHTML = lister
      ? `Tell me about the property in your own words. Please include the <b>unit number</b>, the <b>size</b>, the <b>location</b> (building, area and city) and the <b>price</b>.<br><br>📷 Add photos and I'll write the listing from them. You can also paste a listing from WhatsApp.<br><br><span class="muted">Your unit number is never shown to visitors. It only stops the same unit being listed more than 3 times.</span>`
      : host
        ? `Tell me about your space in your own words: a <b>room in co-living</b> (rent a month, who you'd like to live with, what your household enjoys) or a <b>holiday home</b> (price a night, how many it sleeps). Include the <b>unit number</b> and the <b>location</b> (building, area and city).<br><br>📷 Add photos and I'll write the listing from them.<br><br><span class="muted">Your unit number is never shown to visitors.</span>`
      : (role === "seeker"
        ? `Tell me what you're looking for, in your own words: to <b>buy</b>, to <b>rent</b>, or a <b>room in co-living</b>, the <b>area and city</b>, and your budget. For co-living, say a little about yourself (non-smoker, works from home, loves cooking…) so we can match you. Licensed brokers and hosts will see it and can call or WhatsApp you.`
        : `Tell me about the property, in your own words. Always include the <b>location</b> (building, area and city), anywhere in the world, and the price.`)
        ;
    log.appendChild(intro);
    S.prefill = true;
    const ex = document.createElement("div");
    ex.className = "examples";
    ex.innerHTML = EXAMPLES.map((e, i) => false ? `<button type="button" class="example" data-i="${i}"><b>${esc(e.label)}</b><span>${esc(e.text)}</span></button>` : "").join("");
    log.appendChild(ex);
    ex.querySelectorAll(".example").forEach((b) => b.addEventListener("click", () => useExample(EXAMPLES[+b.dataset.i].text)));
  } else {
    S.chat.forEach((m) => { if (!m.hidden) bubble(m.role === "user" ? "me" : "ai", m.display || m.content); });
    if (S.draft) renderDraft(S.draft);
  }

  const msg = $("#msg");
  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  msg.addEventListener("input", () => { ghostUpdate(); autoGrow(); });
  const pics = $("#chat-pics");
  if (pics) pics.addEventListener("change", async () => {
    const files = [...pics.files].slice(0, Math.max(0, 8 - S.chatPics.length - S.pendingPics.length));

    if (!files.length) return toast("A listing can have up to 8 photos.");
    const note = bubble("me", `Uploading ${files.length} photo${files.length > 1 ? "s" : ""}…`);
    try {
      for (const f of files) S.pendingPics.push(await uploadPhoto(f));

  });
  if (S.prefill) { S.prefill = false; msg.value = START; ghostUpdate(); autoGrow(); }
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  if (isDesktop()) msg.focus();
  scrollLog();
}

const ghostText = () => GHOSTS[roleOf()] || GHOSTS.landlord;
/* Faded suggestion that follows "I want to " until the person starts typing their own words. */
function ghostUpdate() {
  const t = $("#msg"), g = $("#ghost");
  if (!t || !g) return;
  const base = (S.ghost && S.ghost.base) || START;
  const on = t.value.trimEnd().toLowerCase() === base.trimEnd().toLowerCase();
  g.hidden = !on;
  t.classList.toggle("ghosting", on);
  if (!on) return;
  const cs = getComputedStyle(t);
  for (const k of ["fontFamily", "fontSize", "fontWeight", "fontStretch", "fontFeatureSettings", "fontKerning", "wordSpacing", "textTransform", "lineHeight", "letterSpacing", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderLeftWidth", "borderRightWidth", "borderBottomWidth"]) g.style[k] = cs[k];
  g.innerHTML = `<span class="gt">${esc(t.value.endsWith(" ") ? t.value : t.value + " ")}</span><span class="gh">${esc((S.ghost && S.ghost.hint) || ghostText())}</span>`;
}
function autoGrow() {
  const t = $("#msg"), g = $("#ghost");
  if (!t) return;
  t.style.height = "auto";
  const need = Math.max(t.scrollHeight, g && !g.hidden ? g.scrollHeight : 0) + 2;
  t.style.height = Math.min(need, 136) + "px";
  t.style.overflowY = need > 136 ? "auto" : "hidden";
}
function scrollLog() { const b = $("#sheet-body"); b.scrollTop = b.scrollHeight; }

function useExample(text) {
  const t = $("#msg");
  t.value = text;
  autoGrow();
  t.focus();
  const i = text.indexOf("["), j = text.indexOf("]", i);
  if (i >= 0 && j > i) t.setSelectionRange(i, j + 1);
}

function bubble(kind, text) {
  const log = $("#log");
  if (!log) return null;
  const d = document.createElement("div");
  d.className = "bubble " + kind;
  d.textContent = text;
  log.appendChild(d);
  scrollLog();
  return d;
}

async function send() {
  const t = $("#msg");
  const text = t.value.trim();
  if ((!text && !S.pendingPics.length) || S.busy) return;
  if ([START, S.ghost && S.ghost.base].some((b) => b && text.toLowerCase() === b.trim().toLowerCase()) && !S.pendingPics.length) { toast("Please finish the sentence: what, where, unit number, size and price."); t.focus(); return; }
  if (/\[[^\]]*\]/.test(text)) {
    toast("Please replace the [brackets] with your details first.");
    const i = text.indexOf("["); t.focus(); t.setSelectionRange(i, text.indexOf("]", i) + 1);
    return;
  }
  t.value = ""; autoGrow();
  const ideas = $("#ideas"); if (ideas) ideas.remove();
  const images = S.pendingPics.splice(0);
  S.chatPics.push(...images);
  S.chat.push(images.length ? { role: "user", content: text || "Here are photos of the property.", images } : { role: "user", content: text });
  if (text) bubble("me", text);
  await askAI();
}

async function askAI() {
  S.busy = true;
  $("#send").disabled = true;
  const typing = bubble("ai", "");
  typing.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  try {
    const r = await api("/chat", { method: "POST", body: JSON.stringify({ messages: S.chat.map(({ role, content, images }) => (images ? { role, content, images } : { role, content })) }) });
    typing.remove();
    if (r.type === "draft") {
      if (r.text) bubble("ai", r.text);
      S.chat.push({ role: "assistant", content: (r.text ? r.text + "\n" : "") + "[Draft shown to the user for confirmation: " + draftSummary(r.draft) + "]", display: r.text || "Here's your post. Please check it." , hidden: !r.text });
      S.draft = r.draft;
      S.draftPhotos = [];
      renderDraft(r.draft);
    } else {
      S.chat.push({ role: "assistant", content: r.text });
      bubble("ai", r.text);
    }
  } catch (e) {
    typing.remove();
    if (e.code === "profile_required") return renderProfileStep();
    if (e.code === "role_required") return renderRolePicker(false);
    if (e.status === 401) { store.set("ps_resume", "1"); return renderSignIn("Your session expired. Please sign in again."); }
    bubble("err", e.message);
  } finally {
    S.busy = false;
    const b = $("#send"); if (b) b.disabled = false;
  }
}

async function shrink(file, square) {
  try {
    const bmp = await createImageBitmap(file);
    const c = document.createElement("canvas");
    if (square) {
      // Centre-crop to a square for profile pictures.
      const side = Math.min(bmp.width, bmp.height), out = Math.min(square, side);
      c.width = c.height = out;
      c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);
      return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.85));
    }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.82));
  } catch (e) {
    return file;
  }
}

async function uploadPhoto(file, opts = {}) {
  if (file.type && !/^image\//.test(file.type)) throw new Error("Please choose a photo.");
  const blob = await shrink(file, opts.square);
  if (blob.size > 5 * 1024 * 1024) throw new Error("One photo is too large. Please use photos under 5 MB.");
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random()).replace(".", "");
  const path = `${S.session.user.id}/${id}.jpg`;
  const { error } = await S.sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw new Error("A photo couldn't be uploaded. Please try again.");
  // Smaller copies for list cards (800px) and thumbnails (240px), so phones never download the full photo for a small picture.
  // If they can't be made, the full photo is used instead (see the image error handler).
  if (!opts.square) {
    await Promise.all([["m", 800, 0.78], ["s", 240, 0.7]].map(async ([k, max, q]) => {
      try {
        const small = await resized(blob, max, q);
        if (small) await S.sb.storage.from("photos").upload(`${S.session.user.id}/${id}_${k}.webp`, small, { contentType: small.type || "image/webp", upsert: false });
      } catch (e) { /* the full photo still works */ }
    }));
  }
  return S.sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}
/** A smaller copy: WebP where the browser can make it, JPEG otherwise. */
async function resized(blob, max, quality) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const webp = await new Promise((res) => c.toBlob(res, "image/webp", quality));
  if (webp && webp.type === "image/webp") return webp;
  return await new Promise((res) => c.toBlob(res, "image/jpeg", quality));
}

function openAssistant(context = null) {
  if (!S.session) return needSignIn("Sign in to chat with Stalker.");
  if (!profileComplete()) return renderProfileStep();
  const ctxId = context && context.post_id;
  if (!S.ask || S.ask.ctx !== ctxId) S.ask = { ctx: ctxId || null, messages: [] };
  const here = ctxId && getPost(ctxId);
  openSheet("ask", here ? "Ask Stalker about this property" : "Stalker");
  $("#sheet-body").innerHTML = `<div class="log" id="log"></div>`;
  $("#sheet-foot").innerHTML = `
    <form class="composer" id="composer">
      <div class="crow">
        <div class="msg-wrap"><textarea id="msg" rows="1" placeholder="${here ? "Ask anything about this property…" : "Ask about properties, prices, areas…"}" aria-label="Message"></textarea></div>
        <button class="send-btn" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>`;
  if (!S.ask.messages.length) {
    const intro = document.createElement("div");
    intro.className = "bubble ai";
    intro.innerHTML = here
      ? `Ask me anything about this <b>${esc(titleOf(here).toLowerCase())}</b>: the price, the area, what's included. If I don't know, I'll pass your question to the lister. I can also set up a viewing.`
      : `Hi${S.me && S.me.profile && S.me.profile.name ? " " + esc(S.me.profile.name.split(" ")[0]) : ""}, I'm Stalker. I can find properties, check if a price is fair, do the maths on buying or renting, stalk a building, write or score your listing, and alert you when something new matches.`;
    $("#log").appendChild(intro);
    const ex = document.createElement("div");
    ex.className = "examples";
    const starters = here ? ["Is the price fair?", "Any red flags?", "What would the monthly mortgage be?", "I'd like to see it"] : [...(ASK_STARTERS[roleOf()] || []), ...ASK_STARTERS.any].slice(0, 7);
    ex.innerHTML = starters.map((t) => `<button type="button" class="example"><span>${esc(t)}</span></button>`).join("");
    $("#log").appendChild(ex);
    ex.querySelectorAll(".example").forEach((b) => b.addEventListener("click", () => { $("#msg").value = b.textContent; askSend(); }));
  } else {
    for (const m of S.ask.messages) {
      if (m.role === "user") bubble("me", m.content);
      else { if (m.content) aiBubble(m.content); (m.cards || []).forEach(renderAskCard); }
    }
  }
  const msg = $("#msg");
  msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
  msg.addEventListener("input", autoGrow);
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); askSend(); });
  if (isDesktop()) msg.focus();
  scrollLog();
}

async function askSend() {
  const t = $("#msg");
  const text = t.value.trim();
  if (!text || S.busy) return;
  t.value = ""; autoGrow();
  document.querySelectorAll("#log .examples").forEach((x) => x.remove());
  S.ask.messages.push({ role: "user", content: text });
  bubble("me", text);
  S.busy = true; $("#send").disabled = true;
  const typing = bubble("ai", "");
  typing.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  try {
    const history = S.ask.messages.map((m) => ({ role: m.role, content: m.role === "assistant" ? (m.content || "") + (m.note ? "\n" + m.note : "") : m.content }));
    const r = await api("/assistant", { method: "POST", body: JSON.stringify({ messages: history, context: S.ask.ctx ? { post_id: S.ask.ctx } : undefined }) });
    typing.remove();
    const note = (r.cards || []).map((c) => c.type === "listings" ? `[Showed listings: ${c.ids.join(", ")}]` : c.type === "draft" ? `[Showed a request draft to confirm]` : c.type === "enquiry" ? `[Showed an enquiry card for ${c.post_id}]` : `[Showed a ${c.type} card]`).join(" ");
    S.ask.messages.push({ role: "assistant", content: r.text, cards: r.cards || [], note });
    aiBubble(r.text);
    (r.cards || []).forEach(renderAskCard);
  } catch (e) {
    typing.remove();
    S.ask.messages.pop();
    bubble("err", e.code === "profile_required" ? "Please complete your profile first." : e.message);
  } finally {
    S.busy = false; const s = $("#send"); if (s) s.disabled = false;
  }
}

/** The assistant writes light markdown: **bold** and "- " bullets. */
function aiBubble(text) {
  const d = bubble("ai", "");
  if (d) d.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*•] /gm, "• ").replace(/^#{1,4} /gm, "");
  return d;
}

function badgeHtml(p) {
  const out = [];
  if (p.below_market_pct >= 10) out.push(`<span class="badge good">${p.below_market_pct}% below area price</span>`);
  if (p.price_cut_pct >= 3) out.push(`<span class="badge cut">Price cut ${p.price_cut_pct}%</span>`);
  if (p.cobroke) out.push(`<span class="badge">Open to co-broking</span>`);
  return out.join("");
}

function renderAskCard(c) {
  const log = $("#log");
  if (!log) return;
  const box = document.createElement("div");
  box.className = "ask-card";
  if (c.type === "listings") {
    const missing = c.ids.filter((id) => !getPost(id));
    if (missing.length && !c._fetched) {
      // Stalker's picks may be anywhere on the map: fetch the ones we haven't loaded, then draw the card.
      c._fetched = true;
      api("/posts/batch", { method: "POST", body: JSON.stringify({ ids: missing }) }).then((r) => { r.pins.forEach(cachePut); renderAskCard(c); }).catch(() => renderAskCard(c));
      return;
    }
    const items = c.ids.map((id) => getPost(id)).filter(Boolean);
    if (!items.length) return;
    box.innerHTML = `${c.title ? `<div class="ac-title">${esc(c.title)}</div>` : ""}${items.map((p) => `
      <button class="litem" data-id="${esc(p.id)}">

      </button>`).join("")}`;
    box.querySelectorAll(".litem").forEach((b) => b.addEventListener("click", () => { closeSheet(); openDetails(b.dataset.id, { zoom: 15 }); }));
  } else if (c.type === "description") {

    box.querySelector('[data-a="copy"]').addEventListener("click", async () => { try { await navigator.clipboard.writeText(c.text); toast("Copied."); } catch (e) { toast("Couldn't copy."); } });
    box.querySelector('[data-a="use"]').addEventListener("click", async (e) => {
      e.currentTarget.disabled = true;
      try { await api("/posts/" + c.post_id, { method: "PATCH", body: JSON.stringify({ description: c.text }) }); toast("Description updated."); await loadFeed(); e.currentTarget.textContent = "Applied ✓"; }

    box.innerHTML = `<div class="ac-row">🔔 <span>Alert saved: <b>${esc(c.label)}</b>. I'll tell you in the bell and by email when something new matches.</span></div>`;
  } else if (c.type === "watch") {
    box.innerHTML = `<div class="ac-row">☆ <span>Watching the price of <b>${esc(c.title)}</b>. You'll hear if it drops.</span></div>`;
    loadFeed();
  } else if (c.type === "draft") {
    const d = c.draft;
    box.innerHTML = `<div class="ac-title">Your request</div><b>${esc(titleOf(d))}</b><div class="muted">${esc(placeOf(d))} · ${esc(priceOf(d))}</div>
      ${d.description ? `<p class="ac-text">${esc(d.description)}</p>` : ""}
      <p class="muted" style="font-size:13px">Brokers with a licence will see it, and owners whose listing fits can send it to you. Your number is shared only with people who reach out.</p>
      <div class="actions"><button class="btn accent" data-a="post">Post my request</button></div>`;
    box.querySelector('[data-a="post"]').addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Posting…";
      try { const r = await api("/posts", { method: "POST", body: JSON.stringify({ draftId: d.id }) }); b.textContent = "Posted ✓"; toast("Your request is on the map."); await loadFeed(); }
      catch (err) { b.disabled = false; b.textContent = "Post my request"; toast(err.message); }
    });
  } else if (c.type === "enquiry") {
    const viewing = c.kind === "viewing";
    box.innerHTML = `<div class="ac-title">${viewing ? "Viewing request" : "Question for the lister"} · ${esc(c.title)}</div>
      ${viewing ? `<label class="field"><span>When?</span><input type="datetime-local" class="e-slot" value="${esc(toLocalInput(c.slot))}"></label>` : ""}
      <label class="field"><span>Message</span><textarea class="e-msg" maxlength="800">${esc(c.message || "")}</textarea></label>
      ${c.summary ? `<p class="muted" style="font-size:13px">Shared with them: ${esc(c.summary)}</p>` : ""}
      <p class="muted" style="font-size:13px">They'll get your name and mobile number so they can reply.</p>
      <div class="actions"><button class="btn accent" data-a="send">Send</button></div>`;
    box.querySelector('[data-a="send"]').addEventListener("click", async (e) => {
      const b = e.currentTarget;
      const slotEl = box.querySelector(".e-slot");
      const slot = slotEl && slotEl.value ? new Date(slotEl.value).toISOString() : null;
      if (viewing && !slot) return toast("Please pick a date and time.");

function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 16);
}

  const [al, tn] = await Promise.all([api("/alerts").catch(() => ({ alerts: [] })), api("/tenancies").catch(() => ({ tenancies: [] }))]);
  const role = roleOf();
  box.innerHTML = `
    <div class="section-title">My alerts</div>
    ${al.alerts.length ? al.alerts.map((a) => `<div class="my-post"><div><b>${esc(a.label)}</b><small>Since ${esc(ago(a.created_at))}</small></div><button class="btn" data-del-alert="${a.id}">Remove</button></div>`).join("") : `<p class="muted">No alerts yet.</p>`}
    <button class="btn" id="new-alert" style="width:100%;margin-top:8px">New alert with Stalker</button>
    ${role === "landlord" || role === "broker" || role === "host" || tn.tenancies.length ? `
    <div class="section-title">My tenancies</div>
    <p class="muted" style="font-size:13px">Get rent and renewal reminders, and give your tenant a link to report repairs.</p>
    ${tn.tenancies.map((t) => `<div class="my-post"><div><b>${esc(t.label)}</b><small>${esc([t.tenant_name, t.rent ? `${t.currency || ""} ${Number(t.rent).toLocaleString("en-US")}/month` : "", t.due_day ? `due on the ${t.due_day}` : "", t.lease_end ? `lease ends ${t.lease_end}` : ""].filter(Boolean).join(" · "))}</small></div>
      <button class="btn" data-copy-link="${esc(t.repair_token)}">Repair link</button><button class="btn" data-edit-ten="${t.id}">Edit</button></div>`).join("")}
    <button class="btn" id="new-tenancy" style="width:100%;margin-top:8px">Add a tenancy</button>` : ""}
    ${S.me && S.me.isAdmin ? `<div class="section-title">Admin</div><button class="btn" id="adm-flags" style="width:100%">Flagged posts</button>
      <button class="btn" id="adm-jobs" style="width:100%;margin-top:8px">Run reminders and stale checks now</button><div id="adm-out"></div>` : ""}`;
  box.querySelectorAll("[data-del-alert]").forEach((b) => b.addEventListener("click", async () => { await api("/alerts/" + b.dataset.delAlert, { method: "DELETE" }); renderExtras(); }));
  $("#new-alert").addEventListener("click", () => { openAssistant(); setTimeout(() => { const m = $("#msg"); if (m) { m.value = "Alert me when "; m.focus(); } }, 50); });
  const nt = $("#new-tenancy"); if (nt) nt.addEventListener("click", () => openTenancyForm(null));
  box.querySelectorAll("[data-edit-ten]").forEach((b) => b.addEventListener("click", () => openTenancyForm(tn.tenancies.find((t) => t.id === b.dataset.editTen))));
  box.querySelectorAll("[data-copy-link]").forEach((b) => b.addEventListener("click", () => shareRepairLink(b.dataset.copyLink)));
  const af = $("#adm-flags");
  if (af) af.addEventListener("click", async () => {
    const r = await api("/admin/flags");
    $("#adm-out").innerHTML = r.posts.length ? r.posts.map((p) => `<div class="my-post"><div><b>${esc(p.title)}</b><small>${esc(p.flags.join(", "))} · ${esc(p.contact_name || "")}</small></div><button class="btn" data-view="${p.id}">View</button></div>`).join("") : `<p class="muted">Nothing flagged.</p>`;
    document.querySelectorAll("#adm-out [data-view]").forEach((b) => b.addEventListener("click", () => { closeSheet(); openDetails(b.dataset.view, { zoom: 15 }); }));
  });
  const aj = $("#adm-jobs");
  if (aj) aj.addEventListener("click", async () => { const r = await api("/admin/run-jobs", { method: "POST" }); $("#adm-out").innerHTML = `<p class="muted">${esc(Object.entries(r.done).map(([k, v]) => `${k}: ${v}`).join(" · "))}</p>`; });
}

async function shareRepairLink(token) {
  const link = `${location.origin}/#repair=${token}`;
  const text = `Report any repairs for your home here: ${link}`;
  try { if (await shareOut({ title: "Repair requests", text, url: link })) return; } catch (e) { if (isCancel(e)) return; }
  try { await navigator.clipboard.writeText(link); toast("Repair link copied. Send it to your tenant."); }
  catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); }
}

function openTenancyForm(t) {
  openSheet("tenancy", t ? "Edit tenancy" : "Add a tenancy");
  t = t || {};
  $("#sheet-body").innerHTML = `
    <form id="ten-form" novalidate>
      <label class="field"><span>Property</span><input id="t-label" maxlength="80" value="${esc(t.label)}" placeholder="e.g. Skyview 1204"></label>
      <div class="grid2">
        <label class="field"><span>Tenant name <span class="opt">(optional)</span></span><input id="t-name" value="${esc(t.tenant_name)}"></label>
        <label class="field"><span>Tenant mobile <span class="opt">(optional)</span></span><input id="t-phone" type="tel" value="${esc(t.tenant_phone ? "+" + t.tenant_phone : "")}"></label>
      </div>
      <label class="field"><span>Tenant email <span class="opt">(optional, for rent reminders)</span></span><input id="t-email" type="email" value="${esc(t.tenant_email)}"></label>
      <div class="field"><span>Monthly rent</span><div class="price-row"><input id="t-rent" inputmode="numeric" value="${esc(t.rent ? Number(t.rent).toLocaleString("en-US") : "")}">
        <select id="t-cur">${CURRENCIES.map((c) => `<option${(t.currency || "AED") === c ? " selected" : ""}>${c}</option>`).join("")}</select></div></div>
      <div class="grid2">
        <label class="field"><span>Rent due on day</span><input id="t-due" inputmode="numeric" value="${esc(t.due_day || "")}" placeholder="1 to 28"></label>
        <label class="field"><span>Lease ends</span><input id="t-end" type="date" value="${esc(t.lease_end || "")}"></label>
      </div>
      <button class="btn accent" style="width:100%" id="t-save">Save</button>
      ${t.id ? `<button type="button" class="btn" style="width:100%;margin-top:8px" id="t-newlink">Make a new repair link (the old one stops working)</button><button type="button" class="link-btn" id="t-del">Delete this tenancy</button>` : ""}
      <p class="error" id="t-err" hidden></p>
    </form>`;
  const v = (id) => $(id).value.trim();
  $("#ten-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { label: v("#t-label"), tenant_name: v("#t-name"), tenant_phone: v("#t-phone"), tenant_email: v("#t-email"), rent: v("#t-rent").replace(/\D/g, ""), currency: v("#t-cur"), due_day: v("#t-due"), lease_end: v("#t-end") };
    try { await api(t.id ? "/tenancies/" + t.id : "/tenancies", { method: t.id ? "PATCH" : "POST", body: JSON.stringify(body) }); toast("Saved."); renderAccount(); }
    catch (err) { const el = $("#t-err"); el.hidden = false; el.textContent = err.message; }
  });
  if (t.id) {
    $("#t-newlink").addEventListener("click", async () => { const r = await api("/tenancies/" + t.id, { method: "PATCH", body: JSON.stringify({ new_link: true }) }); shareRepairLink(r.tenancy.repair_token); });
    $("#t-del").addEventListener("click", async () => { if (!confirm("Delete this tenancy?")) return; await api("/tenancies/" + t.id, { method: "DELETE" }); renderAccount(); });
  }
}

/* ---------------- repair link (tenants, no sign-in) ---------------- */
async function openRepairForm(token) {
  openSheet("repair", "Report a repair");
  $("#sheet-body").innerHTML = `<p class="muted">Loading…</p>`;
  let info;
  try { info = await api("/repair/" + token); }
  catch (e) { $("#sheet-body").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  $("#sheet-body").innerHTML = `
    <p class="muted">For <b>${esc(info.label)}</b>. Your landlord gets this straight away.</p>
    <label class="field"><span>Your name</span><input id="r-name" value="${esc(info.tenant_name || "")}"></label>
    <label class="field"><span>Your mobile <span class="opt">(optional)</span></span><input id="r-phone" type="tel"></label>
    <label class="field"><span>What needs fixing?</span><textarea id="r-msg" maxlength="800" placeholder="e.g. The kitchen tap is leaking since yesterday."></textarea></label>
    <button class="btn accent" style="width:100%" id="r-send">Send to my landlord</button><p class="error" id="r-err" hidden></p>`;
  $("#r-send").addEventListener("click", async () => {
    const b = $("#r-send"); b.disabled = true;
    try { await api("/repair/" + token, { method: "POST", body: JSON.stringify({ name: $("#r-name").value, phone: $("#r-phone").value, message: $("#r-msg").value }) });
      $("#sheet-body").innerHTML = `<p>Sent ✓ Your landlord has been told.</p>`; }
    catch (e) { b.disabled = false; const el = $("#r-err"); el.hidden = false; el.textContent = e.message; }
  });
}

$("#ask").addEventListener("click", () => openAssistant());
$("#locate").addEventListener("click", () => {
  if (!navigator.geolocation || !S.map) return toast("Your browser can't share its location.");
  navigator.geolocation.getCurrentPosition((pos) => { S.map.panTo({ lat: pos.coords.latitude, lng: pos.coords.longitude }); S.map.setZoom(15); },
    () => toast("Couldn't get your location. Please allow location access."), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
});
$("#palette").addEventListener("click", () => {
  openSheet("theme", "Colour theme");
  $("#sheet-body").innerHTML = `<p class="muted">Pick the look you like. It's saved on this device.</p>${themePicker()}`;
  bindThemePicker($("#sheet-body"));
});

/* ---------------- Set the pin ---------------- */
/** Where to open the picker: the draft's spot, else its area / city, else the map's current view. */
async function startPoint(d) {
  if (d.lat != null && d.lng != null) return { lat: d.lat, lng: d.lng, zoom: 18 };
  const q = [d.building, d.locality, d.city].filter(Boolean).join(", ");
  for (const text of [q, [d.locality, d.city].filter(Boolean).join(", "), d.city]) {
    if (!text) continue;
    try { const r = await api("/geocode?q=" + encodeURIComponent(text)); if (r.place) return { lat: r.place.lat, lng: r.place.lng, zoom: 15 }; } catch (e) {}
  }
  const c = S.map && S.map.getCenter ? S.map.getCenter() : null;
  return c ? { lat: c.lat(), lng: c.lng(), zoom: Math.max(S.map.getZoom() || 12, 12) } : { lat: 25.2, lng: 55.27, zoom: 11 };
}

let pkMap = null;
async function openPinPicker({ lat, lng, zoom = 17 }) {
  const box = $("#picker");
  box.hidden = false;
  const { Map } = await google.maps.importLibrary("maps");
  if (!pkMap) {
    pkMap = new Map($("#pk-map"), { center: { lat, lng }, zoom, mapId: S.cfg.mapId, mapTypeId: "hybrid", disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy", clickableIcons: false });
  } else { pkMap.setCenter({ lat, lng }); pkMap.setZoom(zoom); }
  const q = $("#pk-q"), sug = $("#pk-sug");
  q.value = ""; sug.hidden = true;
  return new Promise((resolve) => {
    let timer = null;
    const done = (v) => { box.hidden = true; clearTimeout(timer); q.oninput = null; resolve(v); };
    $("#pk-close").onclick = () => done(null);
    $("#pk-ok").onclick = () => { const c = pkMap.getCenter(); done({ lat: +c.lat().toFixed(7), lng: +c.lng().toFixed(7) }); };
    $("#pk-here").onclick = () => {
      if (!navigator.geolocation) return toast("Your browser can't share its location.");
      const b = $("#pk-here"); b.disabled = true; b.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        (pos) => { pkMap.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude }); pkMap.setZoom(18); b.disabled = false; b.textContent = "📍 My location"; toast("Check the pin is on the right building, then tap Use this spot."); },
        () => { b.disabled = false; b.textContent = "📍 My location"; toast("Couldn't get your location. Allow location access, or move the map yourself."); },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    };
    // Search: one suggestion as you type (a short pause keeps lookups low).
    q.oninput = () => {
      clearTimeout(timer);
      const text = q.value.trim();
      if (text.length < 3) { sug.hidden = true; return; }
      timer = setTimeout(async () => {
        try {
          const r = await api("/geocode?q=" + encodeURIComponent(text));
          if (!r.place) { sug.innerHTML = `<button disabled>No match. Try the area name.</button>`; sug.hidden = false; return; }
          sug.innerHTML = `<button id="pk-go">📍 ${esc(r.place.address || text)}</button>`;
          sug.hidden = false;
          $("#pk-go").onclick = () => {
            if (r.place.viewport) pkMap.fitBounds(r.place.viewport); else { pkMap.setCenter({ lat: r.place.lat, lng: r.place.lng }); pkMap.setZoom(17); }
            sug.hidden = true; q.blur();
          };
        } catch (e) { sug.hidden = true; }
      }, 650);
    };
  });
}

boot();
