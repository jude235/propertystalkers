    <form id="code-form" novalidate>
      <label class="field"><span>Code</span><input id="otp" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
      <button class="btn primary" style="width:100%" id="code-btn">Sign in</button>
      <p class="error" id="code-err" hidden></p>
    </form>
    <button class="link-btn" style="color:var(--brand)" id="code-back">Use a different ${mode === "phone" ? "number" : "email"} or send again</button>`;
  const otp = $("#otp");
  otp.focus();
  otp.addEventListener("input", () => {
    otp.value = otp.value.replace(/\D/g, "");
    $("#code-err").hidden = true;
    if (otp.value.length >= 6 && otp.value.length === Number(otp.dataset.len || 6)) $("#code-form").requestSubmit();
  });
  $("#code-back").addEventListener("click", () => renderSignIn(reason, mode));
  $("#code-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = otp.value.trim();
    const err = $("#code-err");
    if (token.length < 6) { err.hidden = false; err.textContent = "Please enter the code from the " + (mode === "phone" ? "text message." : "email."); return; }
    const btn = $("#code-btn"); btn.disabled = true; btn.textContent = "Checking…";
    let error;
    try { ({ error } = await withTimeout(S.sb.auth.verifyOtp({ ...ident, token, type: mode === "phone" ? "sms" : "email" }), 20000)); }
    catch (ex) { error = { message: "network" }; }
    if (error) {
      btn.disabled = false; btn.textContent = "Sign in";
      err.hidden = false; err.textContent = /expired|invalid/i.test(error.message) ? "That code isn't right or has expired. Check the latest email, or tap below to get a new code."
        : error.message === "network" ? "Couldn't reach the sign-in service. Please check your connection and try again." : "That code isn't right. Please check it and try again.";
      return;
    }
    closeSheet();
    toast("You're signed in.");
  });
}

function profileForm(profile, submitLabel) {
  profile = profile || {};
  const email = profile.email || (S.me && S.me.email) || "";
  const phone = profile.phone ? "+" + profile.phone : (S.me && S.me.phone ? "+" + String(S.me.phone).replace(/^\+/, "") : "");
  return `
    <form id="profile-form" novalidate>
      <div class="pf-pic-row">
        <div class="pf-pic" id="pf-pic">${profile.avatar_url ? `<img src="${esc(shown(profile.avatar_url))}" alt="Your profile picture">` : esc(initials(profile.name || email || "Me"))}</div>
        <div class="pf-pic-actions">
          <button type="button" class="btn" id="pf-pic-add">${profile.avatar_url ? "Change photo" : "Add profile photo"}</button>
          <button type="button" class="link-btn" id="pf-pic-remove" ${profile.avatar_url ? "" : "hidden"}>Remove photo</button>
          <input type="file" id="pf-pic-file" accept="image/*" hidden>
        </div>
      </div>
      <label class="field"><span>Your name</span><input id="pf-name" maxlength="60" autocomplete="name" value="${esc(profile.name)}"></label>
      <label class="field"><span>Email</span><input id="pf-email" type="email" maxlength="120" autocomplete="email" value="${esc(email)}" placeholder="you@example.com"></label>
      <label class="field"><span>Mobile number with country code (for calls and WhatsApp)</span><input id="pf-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+971 50 123 4567" value="${esc(phone)}"></label>
      <label class="field"><span>Broker licence / RERA number <span class="opt">(optional)</span></span><input id="pf-rera" maxlength="40" autocomplete="off" value="${esc(profile.rera_number)}" placeholder="e.g. 45530 or BRN 45530"></label>
      <button class="btn primary" style="width:100%" id="pf-save">${esc(submitLabel)}</button>
      <p class="error" id="pf-err" hidden></p>
    </form>`;
}
function bindProfileForm(onSaved) {
  let avatar; // undefined = unchanged, "" = remove, url = new picture
  const showErr = (m) => { const el = $("#pf-err"); el.hidden = false; el.textContent = m; };
  $("#profile-form").addEventListener("input", () => { $("#pf-err").hidden = true; });
  $("#pf-pic-add").addEventListener("click", () => $("#pf-pic-file").click());
  $("#pf-pic-file").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const btn = $("#pf-pic-add"), save = $("#pf-save");
    btn.disabled = true; save.disabled = true; btn.textContent = "Uploading…";
    try {
      const url = await uploadPhoto(file, { square: 400 });
      avatar = url;
      $("#pf-pic").innerHTML = `<img src="${esc(shown(url))}" alt="Your profile picture">`;
      $("#pf-pic-remove").hidden = false;
    } catch (err) { showErr(err.message || "The photo couldn't be uploaded. Please try again."); }
    btn.disabled = false; save.disabled = false; btn.textContent = "Change photo";
  });
  $("#pf-pic-remove").addEventListener("click", () => {
    avatar = "";
    $("#pf-pic").textContent = initials($("#pf-name").value.trim() || "Me");
    $("#pf-pic-remove").hidden = true;
    $("#pf-pic-add").textContent = "Add profile photo";
  });
  $("#profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#pf-save"), label = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const v = (id) => $(id).value.trim();
      if (v("#pf-name").length < 2) throw new Error("Please enter your name.");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("#pf-email"))) throw new Error("Please enter a valid email address.");
      if (v("#pf-phone").replace(/\D/g, "").length < 8) throw new Error("Please enter your mobile number with country code.");
      await api("/me", { method: "POST", body: JSON.stringify({ name: v("#pf-name"), email: v("#pf-email"), phone: v("#pf-phone"), rera: v("#pf-rera"), ...(avatar !== undefined ? { avatar } : {}) }) });
      await refreshMe();
      onSaved();
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      const el = $("#pf-err"); el.hidden = false; el.textContent = err.message;
    }
  });
}

function renderProfileStep() {
  openSheet("profile", "Complete your profile");
  $("#sheet-body").innerHTML = `
    <p class="muted">Your name, mobile number and email are needed before you post. Your name and mobile are shown on your posts so people can call or WhatsApp you.</p>
    ${profileForm(S.me && S.me.profile, "Continue")}`;
  bindProfileForm(() => startPosting());
}

function renderProfileStepThen(next) {
  openSheet("profile", "Complete your profile");
  $("#sheet-body").innerHTML = `
    <p class="muted">Welcome! Please add your details. Email and mobile number are required; your licence / RERA number is optional.</p>
    ${profileForm(S.me && S.me.profile, "Save profile")}`;
  bindProfileForm(next);
}

function renderAccount() {
  if (!S.me) return renderSignIn();
  openSheet("account", "My profile");
  const mine = S.posts.filter((p) => p.mine);
  const prof = S.me.profile || {};
  $("#sheet-body").innerHTML = `
    ${(S.me.email || S.me.phone || S.me.isAdmin) ? `<p class="muted">${S.me.email || S.me.phone ? `Signed in as <b>${esc(S.me.email || "+" + String(S.me.phone).replace(/^\+/, ""))}</b>` : ""}${S.me.isAdmin ? `${S.me.email || S.me.phone ? "<br>" : ""}<b>Admin</b>: you can see and remove every post.` : ""}</p>` : ""}
    ${profileComplete() ? "" : `<p class="banner-inline">Please complete your profile. Email and mobile number are required.</p>`}
    <div class="section-title" style="margin-top:4px">Your details</div>
    ${profileForm(prof, "Save profile")}
    <div class="my-post" style="border-top:1px solid var(--line);margin:18px 0 6px">
      <div><b>Posting as ${esc(prof.role ? ROLES[prof.role].label : "—")}</b><small>${prof.role ? esc(ROLES[prof.role].desc) : "Choose how you'll use Property Stalkers"}</small></div>
      <button class="btn" id="switch-role">${prof.role ? "Switch" : "Choose"}</button>
    </div>
    <div class="section-title">Your posts</div>
    ${mine.length ? mine.map((p) => `
      <div class="my-post">
        <div><b>${esc(titleOf(p))}</b><small>${esc(placeOf(p))} · ${esc(ago(p.created_at))}</small></div>
        <button class="btn" data-view="${esc(p.id)}">View</button>
        <button class="btn" data-edit="${esc(p.id)}">Edit</button>
        <button class="btn" data-remove="${esc(p.id)}">Remove</button>
      </div>`).join("") : `<p class="muted">You haven't posted anything yet.</p>`}
    <button class="btn" style="width:100%;margin-top:24px" id="signout">Sign out</button>`;
  bindProfileForm(() => { toast("Profile saved."); renderAccount(); });
  $("#switch-role").addEventListener("click", () => renderRolePicker(true));
  document.querySelectorAll("#sheet-body button[data-view]").forEach((b) => b.addEventListener("click", () => { closeSheet(); openDetails(b.dataset.view, { zoom: 15 }); }));
  document.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => removePost(b.dataset.remove)));
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openEditForm(b.dataset.edit)));
  $("#signout").addEventListener("click", async () => {
    await S.sb.auth.signOut();
    S.session = null; S.userId = null; S.chat = []; S.draft = null;
    closeSheet();
    await refreshMe();
    await loadFeed();
    toast("Signed out.");
  });
}

/* ---------------- posting chat ---------------- */
function openComposer() {
  if (!S.session) { store.set("ps_resume", "1"); return renderSignIn("Sign in to post a property or a request."); }
  if (!S.me || !S.me.profile || !S.me.profile.name || !S.me.profile.phone) return renderProfileStep();
  const role = roleOf();
  if (!role) return renderRolePicker(false);
  openSheet("chat", ROLES[role].cta);
  $("#sheet-body").innerHTML = `<div class="log" id="log"></div>`;
  $("#sheet-foot").innerHTML = `
    <form class="composer" id="composer">
      <textarea id="msg" rows="2" placeholder="Describe what you want to post…" aria-label="Message"></textarea>
      <button class="btn accent" id="send" aria-label="Send">Send</button>
    </form>`;

  const log = $("#log");
  if (!S.chat.length) {
    const intro = document.createElement("div");
    intro.className = "bubble ai";
    intro.innerHTML = (role === "buyer" || role === "tenant"
      ? `Tell me what you're looking for, in your own words: the <b>area and city</b>, the type of home and your budget. Licensed brokers will see it and can call or WhatsApp you.`
      : `Tell me about the property, in your own words. Always include the <b>location</b> (building, area and city), anywhere in the world, and the price.`)
      + `<br><br>Tap an example and fill in the brackets:`;
    log.appendChild(intro);
    const ex = document.createElement("div");
    ex.className = "examples";
    ex.innerHTML = EXAMPLES.map((e, i) => (e.role === role || (role === "developer" && e.role === "broker")) ? `<button type="button" class="example" data-i="${i}"><b>${esc(e.label)}</b><span>${esc(e.text)}</span></button>` : "").join("");
    log.appendChild(ex);
    ex.querySelectorAll(".example").forEach((b) => b.addEventListener("click", () => useExample(EXAMPLES[+b.dataset.i].text)));
  } else {
    S.chat.forEach((m) => { if (!m.hidden) bubble(m.role === "user" ? "me" : "ai", m.display || m.content); });
    if (S.draft) renderDraft(S.draft);
  }

  const msg = $("#msg");
  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  msg.addEventListener("input", autoGrow);
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  if (isDesktop()) msg.focus();
  scrollLog();
}

function autoGrow() { const t = $("#msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
function scrollLog() { const b = $("#sheet-body"); b.scrollTop = b.scrollHeight; }

function useExample(text) {
  const t = $("#msg");
  t.value = text;
  autoGrow();
  t.focus();
  const i = text.indexOf("["), j = text.indexOf("]", i);
  if (i >= 0 && j > i) t.setSelectionRange(i, j + 1);
}

function bubble(kind, text) {
  const log = $("#log");
  if (!log) return null;
  const d = document.createElement("div");
  d.className = "bubble " + kind;
  d.textContent = text;
  log.appendChild(d);
  scrollLog();
  return d;
}

async function send() {
  const t = $("#msg");
  const text = t.value.trim();
  if (!text || S.busy) return;
  if (/\[[^\]]*\]/.test(text)) {
    toast("Please replace the [brackets] with your details first.");
    const i = text.indexOf("["); t.focus(); t.setSelectionRange(i, text.indexOf("]", i) + 1);
    return;
  }
  t.value = ""; autoGrow();
  S.chat.push({ role: "user", content: text });
  bubble("me", text);
  await askAI();
}

async function askAI() {
  S.busy = true;
  $("#send").disabled = true;
  const typing = bubble("ai", "");
  typing.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  try {
    const r = await api("/chat", { method: "POST", body: JSON.stringify({ messages: S.chat.map(({ role, content }) => ({ role, content })) }) });
    typing.remove();
    if (r.type === "draft") {
      if (r.text) bubble("ai", r.text);
      S.chat.push({ role: "assistant", content: (r.text ? r.text + "\n" : "") + "[Draft shown to the user for confirmation: " + draftSummary(r.draft) + "]", display: r.text || "Here's your post. Please check it." , hidden: !r.text });
      S.draft = r.draft;
      S.draftPhotos = [];
      renderDraft(r.draft);
    } else {
      S.chat.push({ role: "assistant", content: r.text });
      bubble("ai", r.text);
    }
  } catch (e) {
    typing.remove();
    if (e.code === "profile_required") return renderProfileStep();
    if (e.code === "role_required") return renderRolePicker(false);
    if (e.status === 401) { store.set("ps_resume", "1"); return renderSignIn("Your session expired. Please sign in again."); }
    bubble("err", e.message);
  } finally {
    S.busy = false;
    const b = $("#send"); if (b) b.disabled = false;
  }
}

function draftSummary(d) {
  return [posterLine(d), titleOf(d), placeOf(d), priceOf(d), d.description].filter(Boolean).join(" | ");
}

function renderDraft(d) {
  document.querySelectorAll(".draft").forEach((x) => { x.classList.add("stale"); x.querySelectorAll("button, input").forEach((b) => (b.disabled = true)); });
  const card = document.createElement("div");
  card.className = "draft";
  const isListing = d.kind === "listing";
  card.innerHTML = `
    <span class="tag${isListing ? "" : " req"}">Check your post</span>
    <h3>${esc(titleOf(d))}</h3>
    <div class="muted">${esc(placeOf(d))}</div>
    <dl>
      <dt>Posting as</dt><dd>${esc(posterLine(d))}</dd>
      <dt>${isListing ? "Price" : "Budget"}</dt><dd>${esc(priceOf(d).replace(/^Budget /, ""))}</dd>
      <dt>On the map</dt><dd>${esc(d.address || placeOf(d))}${d.precision === "area" ? " (sector / area pin)" : ""}</dd>
      <dt>Contact</dt><dd>${esc(d.contact_name)} · +${esc(d.contact_phone)}</dd>
    </dl>
    ${(d.notes || []).map((n) => `<p class="note">${esc(n)}</p>`).join("")}
    ${d.description ? `<p class="desc">${esc(d.description)}</p>` : ""}
    ${isListing ? `<label class="photo-pick">Add photos (optional, up to 8)<input type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="thumbs"></div>` : ""}
    <div class="actions">
      <button class="btn" data-act="change">Change something</button>
      <button class="btn accent" data-act="confirm">Confirm and post</button>
    </div>`;
  $("#log").appendChild(card);
  scrollLog();

  const input = card.querySelector("input[type=file]");
  if (input) input.addEventListener("change", () => {
    S.draftPhotos = [...S.draftPhotos, ...input.files].slice(0, 8);
    input.value = "";
    const th = card.querySelector(".thumbs");
    th.innerHTML = "";
    S.draftPhotos.forEach((f) => { const im = document.createElement("img"); im.src = URL.createObjectURL(f); im.alt = ""; th.appendChild(im); });
  });
  card.querySelector('[data-act="change"]').addEventListener("click", () => {
    if ($("#sheet").dataset.view === "devform") return openDevForm();
    const t = $("#msg"); t.value = ""; t.placeholder = "Tell me what to change, e.g. price is 1.1 Cr"; t.focus();
  });
  card.querySelector('[data-act="confirm"]').addEventListener("click", (e) => confirmDraft(d, e.currentTarget));
}

async function confirmDraft(d, btn) {
  btn.disabled = true;
  try {
    const urls = [];
    for (let i = 0; i < S.draftPhotos.length; i++) {
      btn.textContent = `Uploading photo ${i + 1} of ${S.draftPhotos.length}…`;
      urls.push(await uploadPhoto(S.draftPhotos[i]));
    }
    btn.textContent = "Posting…";
    const r = await api("/posts", { method: "POST", body: JSON.stringify({ draftId: d.id, photos: urls }) });
    S.chat = []; S.draft = null; S.draftPhotos = []; S.devForm = null;
    closeSheet();
    toast(r.post.kind === "listing" ? "Posted! Your property is on the map." : "Posted! Your request is on the map.");
    await loadFeed();
    openDetails(r.post.id, { zoom: 15 });
  } catch (e) {
    btn.disabled = false; btn.textContent = "Confirm and post";
    bubble("err", e.message);
  }
}

async function shrink(file, square) {
  try {
    const bmp = await createImageBitmap(file);
    const c = document.createElement("canvas");
    if (square) {
      // Centre-crop to a square for profile pictures.
      const side = Math.min(bmp.width, bmp.height), out = Math.min(square, side);
      c.width = c.height = out;
      c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);
      return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.85));
    }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.82));
  } catch (e) {
    return file;
  }
}

async function uploadPhoto(file, opts = {}) {
  if (file.type && !/^image\//.test(file.type)) throw new Error("Please choose a photo.");
  const blob = await shrink(file, opts.square);
  if (blob.size > 5 * 1024 * 1024) throw new Error("One photo is too large. Please use photos under 5 MB.");
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random()).replace(".", "");
  const path = `${S.session.user.id}/${id}.jpg`;
  const { error } = await S.sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw new Error("A photo couldn't be uploaded. Please try again.");
  return S.sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}

boot();
</script>
