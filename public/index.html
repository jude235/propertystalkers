  $("#new-alert").addEventListener("click", () => { openAssistant(); setTimeout(() => { const m = $("#msg"); if (m) { m.value = "Alert me when "; m.focus(); } }, 50); });
  const nt = $("#new-tenancy"); if (nt) nt.addEventListener("click", () => openTenancyForm(null));
  box.querySelectorAll("[data-edit-ten]").forEach((b) => b.addEventListener("click", () => openTenancyForm(tn.tenancies.find((t) => t.id === b.dataset.editTen))));
  box.querySelectorAll("[data-copy-link]").forEach((b) => b.addEventListener("click", () => shareRepairLink(b.dataset.copyLink)));
  const af = $("#adm-flags");
  if (af) af.addEventListener("click", async () => {
    const r = await api("/admin/flags");
    $("#adm-out").innerHTML = r.posts.length ? r.posts.map((p) => `<div class="my-post"><div><b>${esc(p.title)}</b><small>${esc(p.flags.join(", "))} · ${esc(p.contact_name || "")}</small></div><button class="btn" data-view="${p.id}">View</button></div>`).join("") : `<p class="muted">Nothing flagged.</p>`;
    document.querySelectorAll("#adm-out [data-view]").forEach((b) => b.addEventListener("click", () => { closeSheet(); openDetails(b.dataset.view, { zoom: 15 }); }));
  });
  const aj = $("#adm-jobs");
  if (aj) aj.addEventListener("click", async () => { const r = await api("/admin/run-jobs", { method: "POST" }); $("#adm-out").innerHTML = `<p class="muted">${esc(Object.entries(r.done).map(([k, v]) => `${k}: ${v}`).join(" · "))}</p>`; });
}

async function shareRepairLink(token) {
  const link = `${location.origin}/#repair=${token}`;
  const text = `Report any repairs for your home here: ${link}`;
  try { if (navigator.share) { await navigator.share({ title: "Repair requests", text, url: link }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(link); toast("Repair link copied. Send it to your tenant."); }
  catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); }
}

function openTenancyForm(t) {
  openSheet("tenancy", t ? "Edit tenancy" : "Add a tenancy");
  t = t || {};
  $("#sheet-body").innerHTML = `
    <form id="ten-form" novalidate>
      <label class="field"><span>Property</span><input id="t-label" maxlength="80" value="${esc(t.label)}" placeholder="e.g. Skyview 1204"></label>
      <div class="grid2">
        <label class="field"><span>Tenant name <span class="opt">(optional)</span></span><input id="t-name" value="${esc(t.tenant_name)}"></label>
        <label class="field"><span>Tenant mobile <span class="opt">(optional)</span></span><input id="t-phone" type="tel" value="${esc(t.tenant_phone ? "+" + t.tenant_phone : "")}"></label>
      </div>
      <label class="field"><span>Tenant email <span class="opt">(optional, for rent reminders)</span></span><input id="t-email" type="email" value="${esc(t.tenant_email)}"></label>
      <div class="field"><span>Monthly rent</span><div class="price-row"><input id="t-rent" inputmode="numeric" value="${esc(t.rent ? Number(t.rent).toLocaleString("en-US") : "")}">
        <select id="t-cur">${CURRENCIES.map((c) => `<option${(t.currency || "AED") === c ? " selected" : ""}>${c}</option>`).join("")}</select></div></div>
      <div class="grid2">
        <label class="field"><span>Rent due on day</span><input id="t-due" inputmode="numeric" value="${esc(t.due_day || "")}" placeholder="1 to 28"></label>
        <label class="field"><span>Lease ends</span><input id="t-end" type="date" value="${esc(t.lease_end || "")}"></label>
      </div>
      <button class="btn accent" style="width:100%" id="t-save">Save</button>
      ${t.id ? `<button type="button" class="btn" style="width:100%;margin-top:8px" id="t-newlink">Make a new repair link (the old one stops working)</button><button type="button" class="link-btn" id="t-del">Delete this tenancy</button>` : ""}
      <p class="error" id="t-err" hidden></p>
    </form>`;
  const v = (id) => $(id).value.trim();
  $("#ten-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { label: v("#t-label"), tenant_name: v("#t-name"), tenant_phone: v("#t-phone"), tenant_email: v("#t-email"), rent: v("#t-rent").replace(/\D/g, ""), currency: v("#t-cur"), due_day: v("#t-due"), lease_end: v("#t-end") };
    try { await api(t.id ? "/tenancies/" + t.id : "/tenancies", { method: t.id ? "PATCH" : "POST", body: JSON.stringify(body) }); toast("Saved."); renderAccount(); }
    catch (err) { const el = $("#t-err"); el.hidden = false; el.textContent = err.message; }
  });
  if (t.id) {
    $("#t-newlink").addEventListener("click", async () => { const r = await api("/tenancies/" + t.id, { method: "PATCH", body: JSON.stringify({ new_link: true }) }); shareRepairLink(r.tenancy.repair_token); });
    $("#t-del").addEventListener("click", async () => { if (!confirm("Delete this tenancy?")) return; await api("/tenancies/" + t.id, { method: "DELETE" }); renderAccount(); });
  }
}

/* ---------------- repair link (tenants, no sign-in) ---------------- */
async function openRepairForm(token) {
  openSheet("repair", "Report a repair");
  $("#sheet-body").innerHTML = `<p class="muted">Loading…</p>`;
  let info;
  try { info = await api("/repair/" + token); }
  catch (e) { $("#sheet-body").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  $("#sheet-body").innerHTML = `
    <p class="muted">For <b>${esc(info.label)}</b>. Your landlord gets this straight away.</p>
    <label class="field"><span>Your name</span><input id="r-name" value="${esc(info.tenant_name || "")}"></label>
    <label class="field"><span>Your mobile <span class="opt">(optional)</span></span><input id="r-phone" type="tel"></label>
    <label class="field"><span>What needs fixing?</span><textarea id="r-msg" maxlength="800" placeholder="e.g. The kitchen tap is leaking since yesterday."></textarea></label>
    <button class="btn accent" style="width:100%" id="r-send">Send to my landlord</button><p class="error" id="r-err" hidden></p>`;
  $("#r-send").addEventListener("click", async () => {
    const b = $("#r-send"); b.disabled = true;
    try { await api("/repair/" + token, { method: "POST", body: JSON.stringify({ name: $("#r-name").value, phone: $("#r-phone").value, message: $("#r-msg").value }) });
      $("#sheet-body").innerHTML = `<p>Sent ✓ Your landlord has been told.</p>`; }
    catch (e) { b.disabled = false; const el = $("#r-err"); el.hidden = false; el.textContent = e.message; }
  });
}

$("#ask").addEventListener("click", () => openAssistant());

/* ---------------- Set the pin ---------------- */
/** Where to open the picker: the draft's spot, else its area / city, else the map's current view. */
async function startPoint(d) {
  if (d.lat != null && d.lng != null) return { lat: d.lat, lng: d.lng, zoom: 18 };
  const q = [d.building, d.locality, d.city].filter(Boolean).join(", ");
  for (const text of [q, [d.locality, d.city].filter(Boolean).join(", "), d.city]) {
    if (!text) continue;
    try { const r = await api("/geocode?q=" + encodeURIComponent(text)); if (r.place) return { lat: r.place.lat, lng: r.place.lng, zoom: 15 }; } catch (e) {}
  }
  const c = S.map && S.map.getCenter ? S.map.getCenter() : null;
  return c ? { lat: c.lat(), lng: c.lng(), zoom: Math.max(S.map.getZoom() || 12, 12) } : { lat: 25.2, lng: 55.27, zoom: 11 };
}

let pkMap = null;
async function openPinPicker({ lat, lng, zoom = 17 }) {
  const box = $("#picker");
  box.hidden = false;
  const { Map } = await google.maps.importLibrary("maps");
  if (!pkMap) {
    pkMap = new Map($("#pk-map"), { center: { lat, lng }, zoom, mapId: S.cfg.mapId, mapTypeId: "hybrid", disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy", clickableIcons: false });
  } else { pkMap.setCenter({ lat, lng }); pkMap.setZoom(zoom); }
  const q = $("#pk-q"), sug = $("#pk-sug");
  q.value = ""; sug.hidden = true;
  return new Promise((resolve) => {
    let timer = null;
    const done = (v) => { box.hidden = true; clearTimeout(timer); q.oninput = null; resolve(v); };
    $("#pk-close").onclick = () => done(null);
    $("#pk-ok").onclick = () => { const c = pkMap.getCenter(); done({ lat: +c.lat().toFixed(7), lng: +c.lng().toFixed(7) }); };
    $("#pk-here").onclick = () => {
      if (!navigator.geolocation) return toast("Your browser can't share its location.");
      const b = $("#pk-here"); b.disabled = true; b.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        (pos) => { pkMap.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude }); pkMap.setZoom(18); b.disabled = false; b.textContent = "📍 My location"; toast("Check the pin is on the right building, then tap Use this spot."); },
        () => { b.disabled = false; b.textContent = "📍 My location"; toast("Couldn't get your location. Allow location access, or move the map yourself."); },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    };
    // Search: one suggestion as you type (a short pause keeps lookups low).
    q.oninput = () => {
      clearTimeout(timer);
      const text = q.value.trim();
      if (text.length < 3) { sug.hidden = true; return; }
      timer = setTimeout(async () => {
        try {
          const r = await api("/geocode?q=" + encodeURIComponent(text));
          if (!r.place) { sug.innerHTML = `<button disabled>No match. Try the area name.</button>`; sug.hidden = false; return; }
          sug.innerHTML = `<button id="pk-go">📍 ${esc(r.place.address || text)}</button>`;
          sug.hidden = false;
          $("#pk-go").onclick = () => {
            if (r.place.viewport) pkMap.fitBounds(r.place.viewport); else { pkMap.setCenter({ lat: r.place.lat, lng: r.place.lng }); pkMap.setZoom(17); }
            sug.hidden = true; q.blur();
          };
        } catch (e) { sug.hidden = true; }
      }, 650);
    };
  });
}
